<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeup Pro – Phương án B</title>
<style>
:root{
  --bg:#FAF8F6; --surface:#FFFFFF; --line:#E9E3DE; --line-2:#F2EDE9;
  --text:#221C19; --muted:#716862; --faint:#A39A94;
  --accent:#A63D62; --accent-soft:#F7E8EE;
  --rose:#A63D62; --rose-bg:#FBEDF2;
  --amber:#9A5B0F; --amber-bg:#FDF2E2;
  --violet:#5B45A0; --violet-bg:#F0ECFA;
  --danger:#B42318; --danger-bg:#FEF0EE; --danger-line:#F3B8B0;
  --warn:#8A5A00; --warn-bg:#FFF6E0; --warn-line:#EED6A0;
  --font:"Be Vietnam Pro", Inter, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Đầu trang (máy tính: thanh ngang) ===== */
.head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:28px;height:60px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand b{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.tabs{display:flex;gap:4px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.head .me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.av.sm{width:26px;height:26px;font-size:10.5px}
.av.na{background:#fff;border:1.5px dashed var(--faint);color:var(--muted)}
.mtitle{display:none}
.bottomnav{display:none}

.screen{display:none}
.screen.on{display:block}
.wrap{padding:20px 28px 28px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}

/* ===== Lịch: bố cục 2 cột ===== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.titlerow h1{font-size:20px;font-weight:700}
.titlerow .d{color:var(--muted);font-weight:500}
.titlerow .sp{flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;position:relative}
.day .w{font-size:12px;color:var(--muted)}
.day .n{font-size:18px;font-weight:700;line-height:1.2}
.day .c{font-size:11.5px;color:var(--muted)}
.day.on{border-color:var(--accent);background:var(--accent-soft)}
.day.on .w,.day.on .c{color:var(--accent)}
.day .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.day.we .w{color:var(--accent)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:500;color:var(--text);font-size:13px;cursor:pointer}
.chip.plain{padding:6px 12px}
.chip .k{color:var(--faint)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.on .k{color:var(--accent)}
.chip .av{width:22px;height:22px;font-size:9.5px}

.sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.sec:first-child{margin-top:0}
#agenda .sec:first-child{margin-top:20px}
.todo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:600}
.task .t span{font-size:13px}
.task.red{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
.task.yel{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.task .btn{background:#fff}
.task.red .btn{border-color:var(--danger-line);color:var(--danger)}
.task.yel .btn{border-color:var(--warn-line);color:var(--warn)}

.agenda{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 0;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.item .tm{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.item .tm small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.item .sv{font-weight:600;color:var(--c);font-size:13px}
.item .kh{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .nc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;white-space:nowrap}
.item.conflict{border-color:var(--danger-line);background:#FFFBFA}
.item.conflict::before{background:var(--danger)}
.item .warnline{display:flex;align-items:center;gap:6px;color:var(--danger);font-size:12.5px;font-weight:500;margin-top:4px}
.item .warnline svg{width:14px;height:14px}
.item.na{border-style:dashed}
.cd{--c:var(--rose)} .ah{--c:var(--amber)} .tc{--c:var(--violet)}

/* Bảng bên phải */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:80px}
.panel h3{font-size:15px;margin-bottom:4px}
.panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.load{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.load .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.load .nm span{font-weight:400;color:var(--muted);font-size:12.5px;white-space:nowrap}
.track{position:relative;height:10px;background:var(--line-2);border-radius:5px;margin-top:6px}
.track i{position:absolute;top:0;height:10px;border-radius:3px;background:var(--c)}
.track i.x{background:var(--danger)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding-left:42px;margin-top:4px}
.sum{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-size:13px;color:var(--muted)}
.sum b{color:var(--text)}

/* ===== Bảng giá ===== */
.pgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.addm{display:none}
.segrow{display:none;gap:8px;align-items:center;margin-bottom:14px}
.segrow .seg{flex:1;margin:0}
.seg{display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;height:38px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>h2{font-size:15px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h2 .sp{flex:1}
.gh{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 4px;background:#FDFCFB;border-top:1px solid var(--line-2)}
.gh:first-of-type{border-top:0}
.svc{display:grid;grid-template-columns:10px minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);cursor:pointer}
.svc .dotc{width:8px;height:8px;border-radius:50%;background:var(--c)}
.svc .n{font-weight:600}
.svc .s{font-size:12.5px;color:var(--muted)}
.svc .p{font-weight:600;white-space:nowrap}
.svc.open{background:var(--accent-soft)}
.edit{padding:4px 16px 14px 38px;background:var(--accent-soft);border-top:0}
.set{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #EBD3DC}
.set:first-child{border-top:0}
.set label{font-weight:500}
.ctl{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;width:100%;min-width:0}
.money{text-align:right}
.sw{width:38px;height:22px;border-radius:11px;background:#D9D2CD;position:relative;justify-self:end}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)} .sw.on::after{left:19px}
.edit .acts{display:flex;justify-content:flex-end;gap:8px;padding-top:10px}
.pk{padding:14px 16px;border-top:1px solid var(--line-2)}
.pk:first-of-type{border-top:0}
.pk .top{display:flex;align-items:baseline;gap:10px}
.pk .top b{flex:1;font-size:15px}
.pk .gia{font-weight:700;font-size:16px;white-space:nowrap}
.pk ul{list-style:none;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}
.pk li{font-size:12.5px;background:var(--line-2);border-radius:6px;padding:3px 8px}
.pk .save{font-size:12.5px;color:var(--muted)}
.pk .save del{color:var(--faint)}
.pk .save b{color:#2F7D72;font-weight:600}
.stack{display:flex;flex-direction:column;gap:24px}

.tip{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);color:var(--muted);font-size:10.5px;font-weight:700;cursor:help;margin-left:6px;vertical-align:1px}
.tip:hover::after{content:attr(data-tip);position:absolute;left:-10px;top:calc(100% + 8px);white-space:normal;width:230px;background:#2A2220;color:#fff;font-weight:400;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;z-index:50;text-align:left}
.fab{display:none}

/* ===== Máy tính bảng ===== */
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr) 290px;gap:18px}
  .wrap{padding:18px 20px 24px}
  .head{padding:0 20px;gap:16px}
  .tabs a{padding:0 10px}
  .head .me span{display:none}
  .todo{grid-template-columns:1fr}
  .pgrid{gap:18px}
}
/* ===== Điện thoại ===== */
@media (max-width:640px){
  body{padding-bottom:72px}
  .head{height:54px;padding:0 16px}
  .brand span,.tabs,.head .me span{display:none}
  .mtitle{display:block;font-weight:700;font-size:16px}
  .wrap{padding:12px 16px 20px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{display:none}
  .titlerow h1{display:none}
  .titlerow{margin-bottom:10px}
  .titlerow .d{color:var(--text);font-weight:600;font-size:15px}
  .titlerow .hide-m{display:none}
  #s-bang-gia .titlerow{display:none}
  .days{gap:5px}
  .day{padding:6px 2px;border-radius:9px}
  .day .n{font-size:16px}
  .day .c{font-size:10.5px}
  .filters{margin:0 -16px 12px;padding:0 16px}
  .item{grid-template-columns:52px minmax(0,1fr);padding:12px 12px 12px 0;gap:10px}
  .item .who{grid-column:2;font-size:12.5px}
  .item .tm{font-size:13.5px}
  .task{padding:10px 12px}
  .bottomnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--line);z-index:20}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);text-decoration:none}
  .bottomnav a.on{color:var(--accent);font-weight:600}
  .fab{display:grid;position:fixed;right:16px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;place-items:center;z-index:21;border:0}
  .fab svg{width:24px;height:24px}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex}
  .segrow{display:flex}
  .addm{display:inline-flex;height:40px;width:40px}
  .stack.pk-col{display:none}
  .card>h2{display:none}
  .gh:first-of-type{border-top:0}
  .edit{padding-left:16px}
  .set{grid-template-columns:minmax(0,1fr) 150px}
}
</style>
</head>

  {n:'Cô dâu',l:'cd',ten:'Makeup cô dâu chụp ảnh cưới',phut:90,gia:1200000},
  {n:'Cô dâu',l:'cd',ten:'Làm tóc cô dâu',phut:60,gia:800000},
  {n:'Ăn hỏi',l:'ah',ten:'Makeup ăn hỏi',phut:90,gia:1500000,mo:true},
  {n:'Tiệc & sự kiện',l:'tc',ten:'Makeup tiệc',phut:60,gia:600000},
  {n:'Tiệc & sự kiện',l:'tc',ten:'Makeup mẹ cô dâu / chú rể',phut:45,gia:500000},
  {n:'Tiệc & sự kiện',l:'tc',ten:'Makeup kỷ yếu',phut:45,gia:350000},
  {n:'Tiệc & sự kiện',l:'tc',ten:'Makeup chú rể',phut:20,gia:200000},
];
const PP=[{ten:'Phụ phí đi xa trên 10 km',gia:300000},{ten:'Phụ phí ca sớm trước 5 giờ',gia:200000}];
const GOI=[
  {ten:'Gói Cưới Trọn Vẹn',gom:['Makeup ăn hỏi','Makeup cô dâu (ngày cưới)','Làm tóc × 2 buổi'],gia:4300000,le:5600000},
  {ten:'Gói Ăn Hỏi Gia Đình',gom:['Makeup ăn hỏi','Làm tóc cô dâu','Makeup mẹ × 2'],gia:2900000,le:3300000},
  {ten:'Gói Tiệc Nhóm 5 Người',gom:['Makeup tiệc × 5'],gia:2500000,le:3000000},
];
const vnd=x=>x.toLocaleString('vi-VN').replace(/,/g,'.')+' ₫';
const h=t=>{const[a,b]=t.split(':').map(Number);return a+b/60};
const phut=p=>p>=60?(Math.floor(p/60)+' giờ'+(p%60?' '+p%60+' phút':'')):p+' phút';
const tho=id=>THO.find(t=>t.id===id);
const trung=[];
LICH.forEach((a,i)=>LICH.forEach((b,j)=>{if(j>i&&a.tho&&a.tho===b.tho&&h(a.bd)<h(b.kt)&&h(b.bd)<h(a.kt)){a.c=b;b.c=a;trung.push([a,b])}}));

function drawLich(){
  document.getElementById('days').innerHTML=TUAN.map(([w,n,c,x])=>`<div class="day${n===24?' on':''}${w==='T7'||w==='CN'?' we':''}">${x?'<span class="dot" title="Có ca trùng"></span>':''}<div class="w">${w}</div><div class="n">${n}</div><div class="c">${c} ca</div></div>`).join('');
  const cnt=id=>LICH.filter(e=>e.tho===id).length;
  document.getElementById('filters').innerHTML=`<span class="chip plain on">Tất cả <span class="k">${LICH.length}</span></span>`+THO.map(t=>`<span class="chip"><span class="av" style="background:${t.mau}">${t.vt}</span>${t.ngan} <span class="k">${cnt(t.id)}</span></span>`).join('')+`<span class="chip"><span class="av na">?</span>Chưa có thợ <span class="k">${cnt(null)}</span></span>`;
  const [a,b]=trung[0];const na=LICH.find(e=>!e.tho);
  document.getElementById('todo').innerHTML=`
    <div class="task red"><svg class="i"><use href="#i-warn"/></svg><div class="t"><b>Trùng lịch – ${tho(a.tho).ngan}</b><span>${a.bd}–${a.kt} và ${b.bd}–${b.kt}</span></div><button class="btn sm">Đổi thợ</button></div>
    <div class="task yel"><svg class="i"><use href="#i-user"/></svg><div class="t"><b>Chưa có thợ</b><span>${na.bd} · ${na.dv} · ${na.kh}</span></div><button class="btn sm">Phân thợ</button></div>`;
  const nhom=[['Sáng sớm',0,7],['Buổi sáng',7,12],['Buổi chiều',12,24]];
  let html='';
  nhom.forEach(([ten,f,t])=>{
    const ds=LICH.filter(e=>h(e.bd)>=f&&h(e.bd)<t);if(!ds.length)return;
    html+=`<div class="sec">${ten} · ${ds.length} ca</div><div class="agenda">`;
    ds.forEach(e=>{const th=tho(e.tho);
      html+=`<div class="item ${e.loai}${e.c?' conflict':''}${th?'':' na'}">
        <div class="tm">${e.bd}<small>${e.kt}</small></div>
        <div style="min-width:0"><div class="sv">${e.dv}</div><div class="kh">${e.kh}</div><div class="nc">${e.nc}</div>
        ${e.c?`<div class="warnline"><svg class="i"><use href="#i-warn"/></svg>Trùng giờ với ca ${e.c.bd}–${e.c.kt}</div>`:''}</div>
        <div class="who">${th?`<span class="av sm" style="background:${th.mau}">${th.vt}</span>${th.ngan}`:'<button class="btn sm">Phân thợ</button>'}</div></div>`});
    html+='</div>';
  });
  document.getElementById('agenda').innerHTML=html;
  const S=4,E=18,pc=x=>((x-S)/(E-S)*100).toFixed(2)+'%';
  let p=`<h3>Thợ trong ngày</h3><div class="sub">Thứ Bảy 24/10 · 04:00 – 18:00</div>`;
  THO.forEach(t=>{const ds=LICH.filter(e=>e.tho===t.id);const gio=ds.reduce((s,e)=>s+h(e.kt)-h(e.bd),0);
    const ranh=ds.length?ds[ds.length-1].kt:'cả ngày';
    p+=`<div class="load"><span class="av" style="background:${t.mau}">${t.vt}</span><div style="min-width:0"><div class="nm">${t.ngan}<span>${ds.length} ca · ${String(gio).replace('.',',')} giờ</span></div><div class="track">${ds.map(e=>`<i class="${e.c?'x':''} ${e.loai}" style="left:${pc(h(e.bd))};width:${pc(h(e.kt)-h(e.bd)+S)}" title="${e.bd}–${e.kt} ${e.dv}"></i>`).join('')}</div></div></div>`});
  p+=`<div class="scale"><span>4h</span><span>8h</span><span>12h</span><span>16h</span><span>18h</span></div>`;
  p+=`<div class="sum"><span>Tổng trong ngày</span><b>${LICH.length} ca · ${LICH.filter(e=>!e.tho).length} ca chưa có thợ</b></div>`;
  document.getElementById('panel').innerHTML=p;
}

function drawGia(){
  let s='<h2>Dịch vụ lẻ<span class="sp"></span><span style="font-weight:400;color:var(--faint);font-size:13px">'+DV.length+' dịch vụ</span></h2>';
  let last='';
  DV.forEach(d=>{
    if(d.n!==last){s+=`<div class="gh">${d.n}</div>`;last=d.n}
    s+=`<div class="svc ${d.l}${d.mo?' open':''}"><span class="dotc"></span><div style="min-width:0"><div class="n">${d.ten}</div><div class="s">${phut(d.phut)}</div></div><div class="p">${vnd(d.gia)}</div><svg class="i" style="color:var(--faint)"><use href="#i-${d.mo?'up':'down'}"/></svg></div>`;
    if(d.mo)s+=`<div class="edit">
      <div class="set"><label>Giá</label><input class="ctl money" value="${vnd(d.gia)}"></div>
      <div class="set"><label>Thời lượng<span class="tip" data-tip="Thời gian thợ làm cho một khách. Lịch dùng con số này để báo trùng lịch.">?</span></label><select class="ctl"><option>1 giờ 30 phút</option></select></div>
      <div class="set"><label>Thời gian di chuyển<span class="tip" data-tip="Khoảng chặn thêm trước ca khi thợ phải đến nhà khách.">?</span></label><select class="ctl"><option>30 phút</option></select></div>
      <div class="set"><label>Nhận đặt online<span class="tip" data-tip="Dịch vụ hiện trên trang đặt lịch công khai của studio.">?</span></label><span class="sw on"></span></div>
      <div class="acts"><button class="btn sm">Huỷ</button><button class="btn sm pri">Lưu</button></div></div>`;
  });
  document.getElementById('svc').innerHTML=s;
  document.getElementById('pk').innerHTML='<h2>Gói makeup<span class="sp"></span><button class="btn sm"><svg class="i"><use href="#i-plus"/></svg>Tạo gói</button></h2>'+GOI.map(g=>`<div class="pk"><div class="top"><b>${g.ten}</b><span class="gia">${vnd(g.gia)}</span></div><ul>${g.gom.map(x=>`<li>${x}</li>`).join('')}</ul><div class="save">Giá lẻ <del>${vnd(g.le)}</del> · khách tiết kiệm <b>${vnd(g.le-g.gia)}</b></div></div>`).join('');
  document.getElementById('pp').innerHTML='<h2>Phụ phí</h2>'+PP.map(x=>`<div class="svc" style="grid-template-columns:minmax(0,1fr) auto"><div class="n">${x.ten}</div><div class="p">${vnd(x.gia)}</div></div>`).join('');
}

function route(){
  const s=(location.hash||'#lich').slice(1)==='bang-gia'?'bang-gia':'lich';
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id==='s-'+s));
  document.querySelectorAll('[data-s]').forEach(a=>a.classList.toggle('on',a.dataset.s===s));
  document.getElementById('mtitle').textContent=s==='lich'?'Lịch makeup':'Bảng giá';
}
window.addEventListener('hashchange',route);
drawLich();drawGia();route();
</script>
</body>
</html>

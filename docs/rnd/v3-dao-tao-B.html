/* ===== apps/web/src/styles/tokens.css ===== */
/*
 * Design tokens — bản vẽ thông số C, mục 1 (docs/rnd/BAN-VE-C.md).
 * Giá trị lấy đúng từ docs/rnd/v2-phuong-an-C.html.
 * Tên biến màu ở khối đầu giữ Y NHƯ bản vẽ. Các biến phía dưới (loại ca, tooltip, lớp phủ, sọc,
 * màu ảnh đại diện, màu rê chuột) là giá trị bản vẽ có ghi nhưng chưa đặt tên.
 * Chế độ tối: bản mẫu chưa có, bản vẽ để sau lát 1 — không làm ở đây.
 */
:root {
  /* 1.1 Màu — tên y như bản vẽ */
  --bg: #F6F4F2;
  --surface: #FFFFFF;
  --line: #E9E3DE;
  --line-2: #F2EDE9;
  --soft: #FBFAF9;
  --text: #221C19;
  --muted: #716862;
  --faint: #A39A94;
  --accent: #A63D62;
  --accent-soft: #F7E8EE;
  --accent-line: #E7B8C9;
  --ok: #2F7D72;
  --ok-bg: #E6F3F0;
  --warn: #8A5A00;
  --warn-bg: #FFF6E0;
  --warn-line: #EED6A0;
  --danger: #B42318;
  --danger-bg: #FEF0EE;
  --danger-line: #F3B8B0;

  /* Màu loại ca trên lịch */
  --kind-bride: #A63D62;
  --kind-bride-bg: #FBEDF2;
  --kind-engagement: #9A5B0F;
  --kind-engagement-bg: #FDF2E2;
  --kind-event: #5B45A0;
  --kind-event-bg: #F0ECFA;

  /* Tooltip, lớp phủ, sọc "không làm được" */
  --tip-bg: #2A2220;
  --tip-text: #FFFFFF;
  --overlay-dialog: rgba(34, 28, 25, .42);
  --overlay-sheet: rgba(34, 28, 25, .45);
  --stripe-off: repeating-linear-gradient(135deg, #F4F1EE 0 6px, #FAF8F6 6px 12px);

  /* Màu bản vẽ mục 3 ghi thẳng giá trị (rê chuột, khoá, nhãn Nháp) */
  --line-hover: #D8CFC9;
  --accent-hover: #8F3354;
  --dashed-bg: #FFFCFD;
  --switch-off: #D9D2CD;
  --seg-off-text: #CFC7C1;
  --draft-bg: #EFEBE8;

  /* Ảnh đại diện chữ viết tắt: chọn theo membershipId (băm, lấy dư 6), chữ trắng */
  --av-0: #A63D62;
  --av-1: #5B45A0;
  --av-2: #2F7D72;
  --av-3: #9A5B0F;
  --av-4: #7A6A62;
  --av-5: #3D6A9A;

  /* 1.2 Chữ */
  --font: "Be Vietnam Pro", Inter, "Segoe UI", Roboto, Arial, sans-serif;
  --fs-body: 14px;
  --lh-body: 1.45;
  --fs-h1: 24px;
  --fs-h1-tablet: 21px;
  --fs-topbar: 16px;
  --fs-h2: 16px;
  --fs-h2-subject: 15px;
  --fs-group: 13px;
  --fs-caps: 12px;
  --fs-fx: 12px;
  --fs-tag: 11.5px;
  --fs-total: 18px;
  --fs-total-phone: 16px;

  /* 1.3 Thang khoảng cách (px) */
  --sp-2: 2px;
  --sp-4: 4px;
  --sp-6: 6px;
  --sp-8: 8px;
  --sp-10: 10px;
  --sp-12: 12px;
  --sp-14: 14px;
  --sp-16: 16px;
  --sp-18: 18px;
  --sp-20: 20px;
  --sp-24: 24px;
  --sp-28: 28px;

  /* Bo góc */
  --r-card: 12px;
  --r-dialog: 14px;
  --r-sheet: 16px;
  --r-ctl: 8px;
  --r-seg: 10px;
  --r-seg-in: 7px;
  --r-pill: 999px;
  --r-tip: 6px;
  --r-skel: 6px;

  /* Đổ bóng: không có. Mục đang chọn dùng viền trong. */
  --sel-row: inset 3px 0 0 var(--accent);
  --sel-seg: 0 0 0 1px var(--line);
  --focus-ring: 2px solid var(--accent);
  --focus-offset: 2px;
  --input-ring: 0 0 0 3px var(--accent-soft);

  /* Chiều cao điều khiển */
  --h-ctl: 36px;
  --h-ctl-sm: 30px;
  --h-topbar: 54px;
  --h-bottomnav: 64px;

  /*
   * 1.4 Điểm gãy (biến CSS không dùng được trong @media — ghi để tra):
   *   máy tính ≥ 1181px · máy tính bảng 641–1180px · điện thoại ≤ 640px
   */
}

/* ===== apps/web/src/styles/base.css (phần sau @font-face) ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

img,
svg {
  display: block;
  max-width: 100%;
}

input[type='checkbox'],
input[type='radio'] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  flex: none;
}

/* Số tiền, giờ, km */
.num {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Quy ước tiêu điểm bàn phím chung — chỉ khi :focus-visible */
:focus-visible {
  outline: var(--focus-ring);
  outline-offset: var(--focus-offset);
}
:focus:not(:focus-visible) {
  outline: none;
}

/* Chữ chỉ dành cho trình đọc màn hình */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
}

/* ===== apps/web/src/ui/ui.css ===== */
/*
 * Kiểu cho component dùng chung — bản vẽ C mục 3.
 * Chỉ dùng token ở src/styles/tokens.css; không thêm màu mới.
 * [data-demo="hover"|"focus"] chỉ để trang xem thử bày trạng thái tĩnh (src/ui/__xem-thu__).
 * Điểm gãy: máy tính bảng ≤ 1180px, điện thoại ≤ 640px.
 */

/* ===== Biểu tượng & vòng xoay ===== */
.ui-ico {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.ui-btn--sm .ui-ico { width: 16px; height: 16px; }

.ui-spinner {
  width: 16px;
  height: 16px;
  flex: none;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: ui-spin .7s linear infinite;
}
@keyframes ui-spin { to { transform: rotate(360deg); } }

/* ===== Button ===== */
.ui-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--h-ctl);
  padding: 0 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--r-ctl);
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  flex: none;
  max-width: 100%;
}
.ui-btn:hover:not(:disabled), .ui-btn[data-demo='hover'] { border-color: var(--line-hover); }
.ui-btn[data-demo='focus'] { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

.ui-btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ui-btn--primary:hover:not(:disabled), .ui-btn--primary[data-demo='hover'] {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.ui-btn--ghost { background: none; border-color: transparent; color: var(--accent); padding: 0 8px; }
.ui-btn--ghost:hover:not(:disabled), .ui-btn--ghost[data-demo='hover'] {
  background: var(--accent-soft);
  border-color: transparent;
}

.ui-btn--dashed { border-style: dashed; border-color: var(--accent-line); background: var(--dashed-bg); color: var(--accent); }
.ui-btn--dashed:hover:not(:disabled), .ui-btn--dashed[data-demo='hover'] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

.ui-btn--sm { height: var(--h-ctl-sm); padding: 0 10px; font-size: 13px; }
.ui-btn--ghost.ui-btn--sm { padding: 0 6px; }
.ui-btn--icon { width: 34px; padding: 0; }
.ui-btn--icon.ui-btn--sm { width: 30px; }
.ui-btn--block { width: 100%; }
.ui-btn:disabled { opacity: .5; cursor: not-allowed; }
.ui-btn[aria-busy='true'] { cursor: progress; }
.ui-btn__text { overflow: hidden; text-overflow: ellipsis; }

/* ===== Ô nhập: TextInput, Textarea, MoneyInput, UnitInput, Select ===== */
.ui-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; width: 100%; }
.ui-field__error { font-size: 12px; line-height: 1.4; color: var(--danger); }
.ui-field__hint { font-size: 12px; line-height: 1.4; color: var(--muted); }

.ui-input {
  height: var(--h-ctl);
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  padding: 0 10px;
  background: var(--surface);
  color: var(--text);
  width: 100%;
  min-width: 0;
}
.ui-input::placeholder { color: var(--faint); opacity: 1; }
.ui-input--sm { height: var(--h-ctl-sm); padding: 0 8px; font-size: 13px; }
.ui-input--right { text-align: right; font-variant-numeric: tabular-nums; }
.ui-input:hover:not(:disabled):not(:focus):not([aria-invalid='true']),
.ui-input[data-demo='hover'] { border-color: var(--line-hover); }
.ui-input:focus, .ui-input[data-demo='focus'] {
  outline: none;
  border-color: var(--accent);
  box-shadow: var(--input-ring);
}
.ui-input[aria-invalid='true'] { border-color: var(--danger); }
.ui-input[aria-invalid='true']:focus { box-shadow: 0 0 0 3px var(--danger-bg); }
.ui-input:disabled, .ui-input:read-only:not(select) {
  background: var(--soft);
  color: var(--muted);
}
.ui-input:disabled { cursor: not-allowed; }

.ui-textarea {
  height: auto;
  min-height: calc(2 * 1.45em + 18px); /* tối thiểu 2 dòng + đệm 8 trên dưới + viền */
  padding: 8px 10px;
  resize: vertical;
  line-height: 1.45;
}
.ui-textarea.ui-input--sm { padding: 6px 8px; }

.ui-unit { position: relative; display: block; width: 100%; min-width: 0; }
.ui-unit .ui-input { padding-right: 46px; }
.ui-unit__suffix {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  font-weight: 500;
  color: var(--faint);
  pointer-events: none;
}

.ui-select { padding-right: 6px; cursor: pointer; text-overflow: ellipsis; }
.ui-select:disabled { opacity: 1; }

/* ===== Checkbox ===== */
.ui-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  min-height: 34px; /* dòng danh sách tick như .ckl bản mẫu (đệm 7 trên dưới) */
  padding: 7px 0;
  cursor: pointer;
  min-width: 0;
}
.ui-check input { margin: 0; cursor: inherit; }
.ui-check-row { display: flex; align-items: center; gap: 8px; min-width: 0; } /* nhãn → "?" cách 8 + 6 như bản mẫu */
.ui-check--grow { flex: 1; }
.ui-check__label { min-width: 0; overflow-wrap: anywhere; display: inline-flex; align-items: center; }
.ui-check__trail { margin-left: auto; color: var(--muted); font-weight: 400; padding-left: 12px; }
.ui-check--disabled { color: var(--muted); cursor: not-allowed; }
.ui-check--mute-off:has(input:not(:checked)) { color: var(--faint); }
.ui-check input[data-demo='focus'] { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

/* ===== CheckChip ===== */
.ui-ckchip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 4px 10px 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  max-width: 100%;
}
.ui-ckchip input { width: 14px; height: 14px; margin: 0; cursor: inherit; }
.ui-ckchip input:focus-visible { outline: none; }
.ui-ckchip:has(input:focus-visible), .ui-ckchip:has(input[data-demo='focus']) {
  outline: var(--focus-ring);
  outline-offset: var(--focus-offset);
}
.ui-ckchip:hover:not(.ui-ckchip--disabled), .ui-ckchip:has(input[data-demo='hover']) { border-color: var(--line-hover); }
.ui-ckchip__price { color: var(--muted); font-weight: 400; }
.ui-ckchip--on { background: var(--accent-soft); border-color: var(--accent-line); }
.ui-ckchip--on:hover:not(.ui-ckchip--disabled) { border-color: var(--accent-line); }
.ui-ckchip--disabled { background: var(--surface); color: var(--muted); cursor: not-allowed; }
.ui-ckchip--disabled.ui-ckchip--on { background: var(--accent-soft); }
.ui-ckchip-wrap { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 100%; }
.ui-ckchip--void { color: var(--faint); cursor: default; }
.ui-ckchip--void .ui-ckchip__name, .ui-ckchip--void .ui-ckchip__price { text-decoration: line-through; color: var(--faint); }

/* ===== Switch ===== */
.ui-switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 22px;
  border-radius: 11px;
  border: 0;
  padding: 0;
  background: var(--switch-off);
  flex: none;
  cursor: pointer;
}
.ui-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: left .12s ease;
}
.ui-switch[aria-checked='true'] { background: var(--accent); }
.ui-switch[aria-checked='true']::after { left: 19px; }
.ui-switch:hover:not(:disabled), .ui-switch[data-demo='hover'] { filter: brightness(.95); }
.ui-switch[data-demo='focus'] { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.ui-switch:disabled { opacity: .5; cursor: not-allowed; }

/* ===== Segmented ===== */
.ui-seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  background: var(--surface);
  flex: none;
  max-width: 100%;
  align-self: flex-start; /* trong cột flex không bị kéo giãn hết hàng */
}
.ui-seg__opt {
  border: 0;
  border-left: 1px solid var(--line);
  background: none;
  padding: 0 12px;
  height: 34px;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  min-width: 0;
}
.ui-seg__opt:first-of-type { border-left: 0; border-radius: 7px 0 0 7px; }
.ui-seg__opt:last-of-type { border-radius: 0 7px 7px 0; }
.ui-seg__opt:only-of-type { border-radius: 7px; }
.ui-seg__opt:hover:not([aria-disabled='true']):not([aria-checked='true']),
.ui-seg__opt[data-demo='hover'] { color: var(--text); background: var(--soft); }
.ui-seg__opt:focus-visible, .ui-seg__opt[data-demo='focus'] {
  outline: var(--focus-ring);
  outline-offset: 0;
  position: relative;
  z-index: 1;
}
.ui-seg__opt[aria-checked='true'] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ui-seg__opt[aria-disabled='true']:not([aria-checked='true']) {
  color: var(--seg-off-text);
  background: var(--stripe-off);
  cursor: not-allowed;
}
.ui-seg--disabled .ui-seg__opt[aria-checked='true'] { cursor: default; }
.ui-seg--sm .ui-seg__opt { height: 28px; padding: 0 9px; font-size: 12.5px; }
.ui-seg--block { display: flex; width: 100%; align-self: stretch; }
.ui-seg--block .ui-seg__opt { flex: 1 1 auto; padding: 0 8px; }

/* ===== Qty ===== */
.ui-qty {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  overflow: hidden;
  background: var(--surface);
  flex: none;
}
.ui-qty__btn {
  width: 32px;
  height: 30px;
  border: 0;
  background: var(--soft);
  color: var(--muted);
  font-weight: 700;
  display: grid;
  place-items: center;
}
.ui-qty__btn:hover:not(:disabled), .ui-qty__btn[data-demo='hover'] { color: var(--accent); background: var(--accent-soft); }
.ui-qty__btn:focus-visible { outline-offset: -2px; }
.ui-qty__btn:disabled { opacity: .5; cursor: not-allowed; }
.ui-qty__val { min-width: 34px; text-align: center; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.ui-qty--sm .ui-qty__btn { width: 28px; height: 26px; }
.ui-qty--sm .ui-qty__val { min-width: 30px; }
.ui-qty--disabled .ui-qty__val { color: var(--muted); }

/* ===== Card ===== */
.ui-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  min-width: 0;
}
.ui-card__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.ui-card__title { font-size: var(--fs-h2); font-weight: 700; flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; column-gap: 8px; }
.ui-card__sub { color: var(--faint); font-weight: 400; font-size: 13px; white-space: nowrap; }
.ui-card__body { padding: 10px 18px; }
.ui-card__body--flush { padding: 0; }
.ui-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 18px;
  border-top: 1px solid var(--line-2);
  background: var(--soft);
  border-radius: 0 0 var(--r-card) var(--r-card);
  font-size: 13px;
}

/* ===== Dòng cài đặt: nhãn + điều khiển ===== */
.ui-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--row-ctl, 220px));
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line-2);
}
.ui-row:first-child { border-top: 0; }
.ui-row__label { font-weight: 500; display: flex; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.ui-row__ctl { min-width: 0; display: flex; justify-content: flex-end; }
.ui-row__ctl > .ui-field { align-items: stretch; }
.ui-row--stack { grid-template-columns: 1fr; gap: 6px; }
.ui-row--stack .ui-row__ctl { justify-content: flex-start; }
.ui-req { color: var(--danger); margin-left: 2px; }

/* ===== Tooltip "?" ===== */
.ui-tip {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid var(--faint);
  background: none;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1;
  cursor: help;
  margin-left: 6px;
  padding: 0;
  flex: none;
  font-style: normal;
  text-transform: none;
  letter-spacing: 0;
  vertical-align: 1px;
  position: relative;
}
/* Vùng bấm rộng hơn hình vẽ cho ngón tay, không đổi bố cục */
.ui-tip::before { content: ''; position: absolute; inset: -8px; }
.ui-tip:hover, .ui-tip[aria-expanded='true'] { border-color: var(--muted); color: var(--text); }
.ui-tip-anchor { display: inline-flex; max-width: 100%; }
.ui-tip-bubble {
  position: absolute;
  z-index: 80;
  width: 240px;
  max-width: calc(100vw - 16px);
  background: var(--tip-bg);
  color: var(--tip-text);
  font-weight: 400;
  font-size: 12px;
  line-height: 1.45;
  padding: 8px 10px;
  border-radius: var(--r-tip);
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
  pointer-events: none;
  text-transform: none;
  letter-spacing: 0;
}

/* ===== Avatar ===== */
.ui-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex: none;
  background: var(--av-4);
  overflow: hidden;
  line-height: 1;
  user-select: none;
}
.ui-av img { width: 100%; height: 100%; object-fit: cover; }
.ui-av--sm { width: 28px; height: 28px; font-size: 10.5px; }
.ui-av--xs { width: 22px; height: 22px; font-size: 9px; }
.ui-avs { display: inline-flex; flex: none; align-items: center; }
.ui-avs .ui-av { border: 2px solid #fff; }
.ui-avs > * + * { margin-left: -8px; }
.ui-avs__more { background: var(--line-2); color: var(--muted); }

/* ===== StatusTag ===== */
.ui-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-tag);
  font-weight: 600;
  line-height: 1.45;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--line-2);
  color: var(--muted);
  white-space: nowrap;
  flex: none;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ui-tag--draft { background: var(--draft-bg); color: var(--muted); }
.ui-tag--ok { background: var(--ok-bg); color: var(--ok); }
.ui-tag--danger { background: var(--danger-bg); color: var(--danger); }
.ui-tag--warn { background: var(--warn-bg); color: var(--warn); }
.ui-tag--accent { background: var(--accent-soft); color: var(--accent); }
.ui-tag--neutral { background: var(--line-2); color: var(--muted); }

/* ===== Chip (bộ lọc) ===== */
.ui-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-pill);
  padding: 5px 12px;
  font-weight: 500;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  flex: none;
}
.ui-chip__count { color: var(--faint); }
.ui-chip:hover:not(:disabled), .ui-chip[data-demo='hover'] { border-color: var(--line-hover); }
.ui-chip[data-demo='focus'] { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.ui-chip[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ui-chip[aria-pressed='true'] .ui-chip__count { color: var(--accent); }
.ui-chip:disabled { opacity: .5; cursor: not-allowed; }

/* ===== StickyTotalBar ===== */
.ui-total {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  min-width: 0;
}
.ui-total--sticky { position: sticky; bottom: 0; z-index: 15; }
.ui-total__sums { display: flex; gap: 4px 20px; flex: 1; flex-wrap: wrap; align-items: baseline; min-width: 0; }
.ui-total__item { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ui-total__amt { font-size: var(--fs-total); font-weight: 700; color: var(--text); margin-left: 6px; transition: opacity .15s; }
.ui-total__item--dep .ui-total__amt { font-size: 15px; }
.ui-total[aria-busy='true'] .ui-total__amt { opacity: .5; }
.ui-total__actions { display: flex; gap: 8px; flex: none; align-items: center; }

/* ===== EmptyState ===== */
.ui-empty {
  display: flex;
  align-items: center;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding: 14px 18px;
}
.ui-empty__text { color: var(--muted); flex: 1 1 220px; min-width: 0; }
.ui-card__body > .ui-empty { padding: 4px 0; }

/* ===== Skeleton ===== */
.ui-skel {
  display: block;
  background: var(--line-2);
  border-radius: var(--r-skel);
  animation: ui-pulse 1.4s ease-in-out infinite;
}
.ui-skel-line { display: flex; align-items: center; height: calc(1em * 1.45); }
.ui-skel-line > .ui-skel { height: .9em; width: 100%; }
.ui-skel-group { display: flex; flex-direction: column; min-width: 0; }
@keyframes ui-pulse { 50% { opacity: .55; } }

/* ===== Dialog ===== */
.ui-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--overlay-dialog);
  display: grid;
  place-items: center;
  padding: 24px;
}
.ui-dialog {
  background: var(--surface);
  border-radius: var(--r-dialog);
  width: min(980px, 100%);
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.ui-dialog--sm { width: min(440px, 100%); }
.ui-dialog:focus { outline: none; }
.ui-dialog__head {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
}
.ui-dialog__titles { flex: 1; min-width: 0; }
.ui-dialog__eyebrow { font-size: 12px; color: var(--muted); }
.ui-dialog__title { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.ui-dialog__body { overflow: auto; padding: 8px 22px 12px; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.ui-dialog__foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 22px;
  border-top: 1px solid var(--line);
  background: var(--surface);
  flex: none;
}

/* ===== BottomSheet ===== */
.ui-sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--overlay-sheet);
}
.ui-sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 78%;
  background: var(--surface);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.ui-sheet:focus { outline: none; }
.ui-sheet__grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 2px; flex: none; }
.ui-sheet__head { display: flex; align-items: center; gap: 10px; padding: 8px 12px 10px 18px; border-bottom: 1px solid var(--line); flex: none; }
.ui-sheet__title { font-size: var(--fs-h2); font-weight: 700; flex: 1; min-width: 0; }
.ui-sheet__body { overflow: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.ui-sheet__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex: none; }

/* Ngăn kéo đáy dùng cho điện thoại; ở màn rộng hơn thì đặt giữa, rộng tối đa 640px */
@media (min-width: 641px) {
  .ui-sheet { left: 50%; right: auto; width: min(640px, 100%); transform: translateX(-50%); }
}

/* ===== Điện thoại ===== */
@media (max-width: 640px) {
  .ui-row { grid-template-columns: minmax(0, 1fr) minmax(0, var(--row-ctl-phone, 160px)); }
  .ui-row--stack { grid-template-columns: 1fr; }
  .ui-total { padding: 10px 14px; gap: 10px; }
  .ui-total--sticky {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--h-bottomnav);
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    z-index: 25;
  }
  .ui-total__sums { flex-direction: column; gap: 2px 12px; }
  .ui-total__amt { font-size: var(--fs-total-phone); }
  .ui-total__hide-phone { display: none; }
  /* Hộp thoại trên điện thoại: trang toàn màn (bản mẫu #bang-gia-goi trên điện thoại) */
  .ui-overlay { padding: 0; place-items: stretch; }
  .ui-dialog, .ui-dialog--sm { width: 100%; max-height: none; height: 100%; border-radius: 0; }
  .ui-dialog--sm { height: auto; align-self: end; border-radius: var(--r-sheet) var(--r-sheet) 0 0; }
  .ui-dialog__head { padding: 12px 14px; }
  .ui-dialog__body { padding: 4px 14px 12px; }
  .ui-dialog__foot { padding: 10px 14px; }
}

/* ===== Khung điều hướng (bản vẽ C mục 2) ===== */
/* ===== Khung điều hướng — bản vẽ C mục 2 (giống v2-phuong-an-C.html) ===== */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--surface);border-right:1px solid var(--line)}
.side{display:flex;flex-direction:column;position:sticky;top:0;max-height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:18px 20px;font-weight:700;font-size:17px;color:var(--accent);border-bottom:1px solid var(--line)}
.side .user{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}
.side .user small{display:block;color:var(--muted);font-size:12px}
.menu{padding:12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.menu a.on{background:var(--accent);color:#fff}
.menu .kids{margin:2px 0 6px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.menu .kids a{padding:8px 14px;border-radius:0 8px 8px 0;font-size:13.5px;font-weight:400}
.menu .kids a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.body{min-width:0}
.topbar{display:none}
.bnav{display:none}
.main{padding:24px 28px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:var(--fs-h1);font-weight:700}
.ph .sp{flex:1}
.fx{font-size:12px;color:var(--muted)}
.faint{color:var(--faint)}
.muted{color:var(--muted)}
.b{font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.ui-card__body .ui-row:first-child{border-top:0}
.grp-t{font-size:13px;font-weight:700;padding:12px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;align-items:center}
.caps{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.overdue{color:var(--danger);font-weight:600}
@media (max-width:1180px){
  .app{grid-template-columns:68px minmax(0,1fr)}
  .side .brand span,.side .user div,.menu a span,.menu .kids{display:none!important}
  .side .brand,.side .user{justify-content:center;padding:16px 0}
  .menu a{justify-content:center}
  .main{padding:20px 20px 32px}
  .ph h1{font-size:var(--fs-h1-tablet)}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidecol{display:none}
  body{padding-bottom:var(--h-bottomnav)}
  .topbar{display:flex;align-items:center;gap:10px;height:var(--h-topbar);padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .tt{font-weight:700;font-size:var(--fs-topbar);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:var(--h-bottomnav);background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none}
  .bnav a.on{color:var(--accent);font-weight:600}
  .main{padding:12px 12px 24px}
  .main.has-sum{padding-bottom:96px}
  .ph{display:none}
  .hide-m{display:none!important}
  .ui-row.st-m{grid-template-columns:1fr;gap:6px}
  .ui-row.st-m .ui-row__ctl{justify-content:flex-start}
}
/* Tooltip tĩnh cho bản mẫu (app thật dùng Tooltip.tsx với .ui-tip-bubble) */
.ui-tip:hover::after,.ui-tip:focus::after{content:attr(data-tip);position:absolute;left:-10px;top:calc(100% + 8px);z-index:80;width:240px;background:var(--tip-bg);color:var(--tip-text);font-weight:400;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:var(--r-tip);text-align:left;white-space:normal}
/* Thanh tiến độ, bảng gọn dùng chung */
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.ok{background:var(--ok)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.sel td:first-child{box-shadow:var(--sel-row)}
.tbl .n{font-weight:600}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2);color:var(--text);text-decoration:none}
.lr:first-child{border-top:0}
.lr.sel{background:var(--accent-soft);box-shadow:var(--sel-row)}
.lr .n{font-weight:600;min-width:0}
.lr .d{font-size:12.5px;color:var(--faint)}
.lr .p{font-weight:700;text-align:right;white-space:nowrap}
.gh{padding:12px 18px 6px;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line-2)}
.gh:first-child{border-top:0}
.who{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.who span{display:inline-flex;align-items:center;gap:6px}
.who .ui-ico{width:15px;height:15px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 16px;min-width:0}
.kpi .k .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.kpi .k .v{font-size:20px;font-weight:700;margin-top:2px}
.kpi .k .v.red{color:var(--danger)}
@media (max-width:640px){.kpi{grid-template-columns:1fr 1fr}.lr{padding:12px 14px}.gh{padding:12px 14px 6px}}

  const tt=card('Thông tin khoá',`${row('Tên khoá',inp(k.ten),{w:'300px',sm:1})}${row('Nhóm khoá'+tip('Nhóm do trung tâm tự đặt tên.'),sel(nhom(k.g).ten))}${row('Số buổi',unit(k.buoi,'buổi'))}${row('Mỗi buổi',unit(k.phut,'phút'))}${row('Mô tả',`<textarea class="ui-input ui-textarea">${k.mt}</textarea>`,{stack:1})}`);
  const hp=card('Học phí & cọc',`${row('Học phí',inp(vnd(k.hp),{r:1}))}${row('Cọc mặc định'+tip('Gợi ý khi lập hợp đồng; sửa được ở từng hợp đồng.'),inp(vnd(k.coc),{r:1}))}`);
  const lop=card('Lớp khai giảng',ls.map(l=>`<div class="lopc"><div class="t"><b>Lớp ${l.ma} · ${l.bd}</b>${tag(l.da+'/'+l.max+' học viên','accent')}</div><div class="bar"><i style="width:${l.da/l.max*100}%"></i></div>
     <div class="who"><span>${ic('clock')}${l.lich}</span><span>${av(l.gv,'ui-av--xs')}${NV[l.gv].ten}</span><span>${ic('pin')}Studio Chiến</span></div></div>`).join('')+btn('Mở lớp mới','dashed block',{ic:'plus'}),{sub:ls.length+' lớp'});
  return `<div class="ph">${btn('Khoá & lớp','sm',{ic:'l',href:'#khoa-hoc'})}<h1>${k.ten}</h1>${tag(nhom(k.g).ten,'accent')}<span class="sp"></span>${btn('Huỷ','')}${btn('Lưu','primary')}</div>
   <div class="two"><div class="stack">${tt}${hp}</div>${lop}</div>`;
}
/* ---------- 2. HỢP ĐỒNG: 4 bước ---------- */
function buoc(cur){const B=['Loại & học viên','Khoá & lớp','Học phí & tiến độ','Điều khoản & xác nhận'];
  return `<div class="steps">${B.map((t,i)=>`<div class="sx ${i<cur?'done':i===cur?'cur':''}"><b>${i<cur?'✓':i+1}</b><span class="t">${t}</span></div>`).join('')}</div>`}
function tomTat(nut){const {l,k,tong}=tinhHD();
  return card('Tóm tắt',`<div class="sumc">${row('Học viên',`<span class="b" style="text-align:right;overflow-wrap:anywhere">${HV.ten}</span>`)}${row('Khoá',`<span style="text-align:right">${k.ten} · ${l.ma}</span>`)}
   <div class="who" style="padding:6px 0 10px;flex-direction:column;align-items:flex-start;gap:4px"><span>${ic('clock')}${l.bd} · ${l.lich}</span><span>${av(l.gv,'ui-av--xs')}${NV[l.gv].ten}</span><span>${ic('pin')}Studio Chiến</span></div>
   ${row('<b>Tổng</b>',`<span class="b num" style="font-size:18px">${vnd(tong)}</span>`)}${row('Cọc',`<span class="b num">${vnd(k.coc)}</span>`)}
   ${row('Phụ trách',`<span style="display:flex;gap:6px;align-items:center">${av('hm','ui-av--xs')}${NV.hm.ten}</span>`)}</div><div style="display:flex;flex-direction:column;gap:8px;padding:8px 0 4px">${nut}</div>`,{cls:'side-sum'});
}
function bar(nut){const {tong,coc}=tinhHD();return `<div class="nb">${totalBar([['Tổng',vnd(tong)],['Cọc',vnd(coc),1]],nut)}</div>`}
function veB3(){
  const {k,tong}=tinhHD();
  const hp=card('Học phí',`${row('Học phí',`<span class="b num">${vnd(k.hp)}</span>`)}${row('Giảm giá',inp(vnd(HDK.giam),{r:1}))}${row('Lý do giảm',inp(HDK.lyDoGiam))}${row('<b>Tổng</b>',`<span class="b num" style="font-size:18px">${vnd(tong)}</span>`)}${row('Cọc phải thu'+tip('Gợi ý từ cọc mặc định của khoá.'),inp(vnd(k.coc),{r:1}))}`);
  const td=card('Tiến độ thanh toán',`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px"><span class="fx">Chia gợi ý</span>${seg(['Cọc + 1','Cọc + 2','Cọc + 3'],'Cọc + 2',{sm:1})}</div>
     <div class="tl">${HDK.dot.map(d=>`<div class="it"><div class="g3">${inp(d.ten)}${inp(d.han)}${inp(vnd(d.tien),{r:1})}</div></div>`).join('')}</div>
     <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">${btn('Thêm đợt','ghost sm',{ic:'plus'})}<span style="color:var(--ok);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center">${ic('chk')}Cộng các đợt = ${vnd(tong)}</span></div>`);
  return `<div class="ph"><h1>Lập hợp đồng</h1>${tag('Khoá học','accent')}${tag('Nháp','draft')}</div>${buoc(2)}
   <div class="wz"><div class="stack">${hp}${td}</div>${tomTat(btn('Tiếp: Điều khoản','primary block',{ic:'r'})+btn('Quay lại','block',{ic:'l'}))}</div>${bar(btn('Tiếp','primary',{ic:'r'}))}`;
}
function veB1(){
  const op=(t,d,on,i)=>`<label class="opt ${on?'on':''}"><input type="radio" name="loai" ${on?'checked':''}><span class="oi">${ic(i)}</span><span style="min-width:0"><b>${t}</b><div class="fx">${d}</div></span></label>`;
  const loai=card('Loại hợp đồng',`<div class="opts">${op('Khoá học','Học viên ghi danh vào một lớp; thu theo các đợt.',1,'hoc')}${op('Dịch vụ makeup','Chuyển sang mẫu hợp đồng dịch vụ: gói, phụ phí, lịch makeup.',0,'hd')}</div>`);
  const hv=card('Học viên & phụ trách',`${row('Học viên',`<div style="display:flex;gap:10px;align-items:center;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)"><div style="flex:1;min-width:0"><div class="b" style="overflow-wrap:anywhere">${HV.ten}</div><div class="fx">${HV.sdt}</div></div>${btn('Đổi','sm')}</div>`,{w:'340px',sm:1})}
     ${row('Người phụ trách'+tip('Người tư vấn và nhắc học viên đóng các đợt.'),`<span style="display:flex;gap:8px;align-items:center;width:100%">${av('hm','ui-av--sm')}${sel(NV.hm.ten)}</span>`,{w:'260px',sm:1})}`,{act:btn('Học viên mới','sm',{ic:'plus'})});
  const tt=card('Tóm tắt',`<div class="sumc">${row('Loại','Khoá học')}${row('Học viên',`<span class="b" style="text-align:right;overflow-wrap:anywhere">${HV.ten}</span>`)}${row('Phụ trách',`<span style="display:flex;gap:6px;align-items:center">${av('hm','ui-av--xs')}${NV.hm.ten}</span>`)}</div><div style="display:flex;flex-direction:column;gap:8px;padding:8px 0 4px">${btn('Tiếp: Khoá & lớp','primary block',{ic:'r'})}</div>`,{cls:'side-sum'});
  return `<div class="ph"><h1>Lập hợp đồng</h1>${tag('Nháp','draft')}</div>${buoc(0)}
   <div class="wz"><div class="stack">${loai}${hv}</div>${tt}</div><div class="nb">${totalBar([],btn('Tiếp: Khoá & lớp','primary',{ic:'r'}))}</div>`;
}
function veB2(){
  const ch=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${NHOM.map(g=>chip(g.ten,g.id==='g2')).join('')}</div>`;
  const kh=card('Chọn khoá',KHOA.filter(k=>k.g==='g2').map(k=>`<label class="kr" style="grid-template-columns:auto minmax(0,1fr) auto;align-items:center"><input type="radio" name="k" ${k.id==='k3'?'checked':''}><span class="n">${k.ten}<div class="fx">${k.buoi} buổi · ${gio(k.phut)}/buổi</div></span><span class="p num">${vnd(k.hp)}</span></label>`).join(''),{flush:1});
  const lp=card('Chọn lớp',LOP.filter(l=>l.k==='k3').map(l=>`<label class="lopc" style="flex-direction:row;gap:10px;align-items:flex-start;${l.id==='c1'?'border-color:var(--accent);background:var(--accent-soft)':''}"><input type="radio" name="l" ${l.id==='c1'?'checked':''} style="margin-top:3px"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span style="display:flex;justify-content:space-between;gap:8px"><b>Lớp ${l.ma} · ${l.bd}</b>${tag('còn '+(l.max-l.da)+' chỗ','accent')}</span>
     <span class="who"><span>${ic('clock')}${l.lich}</span><span>${av(l.gv,'ui-av--xs')}${NV[l.gv].ten}</span><span>${ic('pin')}Studio Chiến</span></span></span></label>`).join(''));
  return `<div class="ph"><h1>Lập hợp đồng</h1>${tag('Khoá học','accent')}${tag('Nháp','draft')}</div>${buoc(1)}
   <div class="wz"><div class="stack">${ch}${kh}${lp}</div>${tomTat(btn('Tiếp: Học phí','primary block',{ic:'r'}))}</div>${bar(btn('Tiếp','primary',{ic:'r'}))}`;
}
function veB4(){
  const t=(m,arr)=>card(m.ten,`<ol style="padding-left:18px;display:flex;flex-direction:column;gap:6px">${arr.map(x=>`<li>${x}</li>`).join('')}</ol>`,{sub:'Bản '+m.ban,act:btn('Đổi mẫu','ghost sm')});
  return `<div class="ph"><h1>Lập hợp đồng</h1>${tag('Khoá học','accent')}${tag('Nháp','draft')}</div>${buoc(3)}
   <div class="wz"><div class="stack">${t(MAU_DK,DIEUKHOAN)}${t(MAU_NQ,NOIQUY)}<div class="fx" style="display:flex;gap:6px;align-items:center">${ic('lock')}Bấm Xác nhận: nội dung trên được chụp vào hợp đồng, sửa mẫu sau không đổi hợp đồng này.</div></div>
   ${tomTat(btn('Xác nhận hợp đồng','primary block',{ic:'chk'})+btn('Xem bản in','block',{ic:'in'})+btn('Lưu nháp','block'))}</div>${bar(btn('Xác nhận','primary'))}`;
}
/* ---------- 3. THU TIỀN: thẻ hợp đồng có thanh tiến độ ---------- */
function theThu(t){const pct=Math.min(100,t.da/t.tong*100),cp=t.coc/t.tong*100;
  return `<a class="ui-card tc" href="#thu-tien-ct"><div class="h"><span style="min-width:0"><b>${t.kh}</b><span class="fx">${t.ma} · ${t.nd}</span></span>${trangThaiTien(t)}</div>
   <div class="pbar" title="Đã thu ${vnd(t.da)} / ${vnd(t.tong)}. Vạch đen: mức cọc."><i style="width:${pct}%"></i><u style="left:${cp}%"></u></div>
   <div class="nums"><span>Tổng<b class="num">${vnd(t.tong)}</b></span><span>Cọc phải thu<b class="num">${vnd(t.coc)}</b></span><span>Đã thu<b class="num">${vnd(t.da)}</b></span><span>Còn lại<b class="num">${vnd(t.tong-t.da)}</b></span></div></a>`}
function veThu(){
  return `<div class="ph"><h1>Thu tiền</h1><span class="sp"></span>${btn('Ghi phiếu thu','primary',{ic:'plus',href:'#thu-tien-ghi'})}</div>
   <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px">${chip('Tất cả',1,THU.length)}${chip('Quá hạn',0,2)}${chip('Khoá học',0,4)}${chip('Dịch vụ makeup',0,2)}</div>
   <div class="tgrid">${THU.map(theThu).join('')}</div>`;
}
function veThuCT(){
  const {tong,coc,da}=tinhHD();
  return `<div class="ph">${btn('Thu tiền','sm',{ic:'l',href:'#thu-tien'})}<h1>${HDK.ma}</h1><span class="sp"></span>${btn('Ghi phiếu thu','primary',{ic:'plus',href:'#thu-tien-ghi'})}</div>
   <div class="stack">${theThu(THU[2]).replace('<a class="ui-card tc" href="#thu-tien-ct">','<div class="ui-card tc">').replace(/<\/a>$/,'</div>')}
   ${card('Các đợt',`<div class="tl">${HDK.dot.map(d=>`<div class="it ${d.thu>=d.tien?'paid':''}"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${d.ten}</b><div class="fx">Hạn ${d.han}</div></span><span style="text-align:right"><span class="num b">${vnd(d.tien)}</span><div>${d.thu>=d.tien?tag('Đã thu','ok'):tag('Chưa thu')}</div></span></div></div>`).join('')}</div>`)}
   ${card('Phiếu đã thu',HDK.phieu.map(p=>`<div class="gl"><span><b>${p.ngay} · ${p.cach}</b><div class="fx">${p.noi} · ${NV[p.nguoi].ten} thu · ${p.dot}</div></span><b class="num">${vnd(p.tien)}</b></div>`).join(''))}</div>
   <div class="nb">${totalBar([['Còn lại',vnd(tong-da)]],btn('Ghi phiếu thu','primary',{ic:'plus',href:'#thu-tien-ghi'}))}</div>`;
}
function veThuGhi(){
  return veThuCT()+`<div class="ui-sheet-overlay"><div class="ui-sheet"><div class="ui-sheet__grab"></div><div class="ui-sheet__head"><div class="ui-sheet__title">Ghi phiếu thu<div class="fx" style="font-weight:400">${HDK.ma} · ${HV.ten}</div></div>${btn('','ghost icon sm',{ic:'x',href:'#thu-tien-ct'})}</div>
   <div class="ui-sheet__body" style="padding:0 16px">${formPhieu()}</div><div class="ui-sheet__foot">${btn('Huỷ','',{href:'#thu-tien-ct'})}${btn('Lưu phiếu thu','primary')}</div></div></div>`;
}
/* ---------- 4. THỐNG KÊ: ô số + biểu đồ + danh sách nhóm ---------- */
function veTK(){
  const tiles=[['Doanh số'+tip('Tổng giá trị hợp đồng xác nhận trong kỳ.'),TK.tong.ds],['Cọc phải thu',TK.tong.coc],['Đã thu thực tế'+tip('Tiền đã thu của các hợp đồng này, tính đến hôm nay.'),TK.tong.thu],['Còn lại',TK.tong.con]];
  const gl=(t,o)=>`<div class="gl"><span><b>${t}</b><div class="fx">${o.hd} hợp đồng · cọc ${vnd(o.coc)}</div></span><span style="text-align:right"><b class="num">${vnd(o.ds)}</b><div class="fx">còn ${vnd(o.con)}</div></span><div class="pbar" title="Đã thu ${vnd(o.thu)}"><i style="width:${o.ds?o.thu/o.ds*100:0}%;background:#5B45A0"></i></div></div>`;
  return `<div class="ph"><h1>Doanh thu</h1><span class="sp"></span>${seg(['Tháng','Quý','Năm'],'Tháng')}</div>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">${btn('','sm icon',{ic:'l'})}<b>${TK.ky}</b>${btn('','sm icon',{ic:'r'})}<span class="nb" style="margin-left:auto">${seg(['Tháng','Quý','Năm'],'Tháng',{sm:1})}</span></div>
   <div class="kpi" style="margin-bottom:14px">${tiles.map(([l,v])=>`<div class="k"><div class="l">${l}</div><div class="v num">${vnd(v)}</div></div>`).join('')}</div>
   <div class="two">${card('5 tháng gần đây',bieuDo(),{sub:'thực thu tháng 10: '+vnd(TK.thucThu)})}
   ${card('Theo nhóm',`<div class="fx" style="padding:4px 0">Thanh tím: phần đã thu trên doanh số</div>${TK.khoa.map(g=>gl(g.ten,g)).join('')}${gl('Dịch vụ makeup',TK.dv)}`,{act:seg(['Tất cả','Khoá học','Dịch vụ'],'Tất cả',{sm:1})})}</div>`;
}
/* ---------- 5. THẺ CHÀO MỪNG ---------- */
function veThe(){
  const pv=`<div class="pvb"><img src="${THUMB['pastel-1-vuong-lon']}" alt="Xem trước"></div>`;
  const st=`<div class="strip">${[1,2,3].map(i=>`<button class="${i===1?'on':''}"><img src="${THUMB['pastel-'+i+'-vuong-nho']}" alt="Pastel ${i}"></button>`).join('')}</div>`;
  const f=`${row('Hướng',seg(['Sang trọng','Pastel','Tạp chí'],'Pastel',{sm:1,block:1}),{stack:1})}${st}
   ${row('Khổ ảnh',seg(['Vuông','Dọc story'],'Vuông',{sm:1}))}
   ${row('Học viên',`<span class="b" style="text-align:right;overflow-wrap:anywhere">${HV.ten}</span>`,{w:'200px'})}
   ${row('Khoá',`<span style="text-align:right">Makeup chuyên nghiệp · K12</span>`,{w:'200px'})}
   ${row('Ảnh học viên',btn('Đổi ảnh','sm',{ic:'img'}))}
   ${row('Thương hiệu'+tip('Lấy từ Cài đặt trung tâm.'),`<span>${TT.ten}</span>`,{w:'180px'})}`;
  return `<div class="ph"><h1>Thẻ chào mừng</h1><span class="fx">${HDK.ma} · Lương Hà My · ${HOM_NAY}</span></div>
   <div class="pv2">${pv}<div class="stack">${card('',f)}<span class="hide-m">${btn('Tải ảnh PNG','primary block',{ic:'tai'})}</span></div></div>
   <div class="nb">${totalBar([],btn('Tải ảnh PNG','primary block',{ic:'tai'}))}</div>`;
}
const MAN={
 'khoa-hoc':{n:'dt',c:0,t:'Khoá & lớp',act:btn('','primary icon sm',{ic:'plus'}),ve:veKhoa},
 'khoa-hoc-ct':{n:'dt',c:0,t:'Makeup chuyên nghiệp',back:'#khoa-hoc',ve:veKhoaCT},
 'hop-dong':{n:'hd',c:0,t:'Lập hợp đồng · Bước 3/4',act:tag('Nháp','draft'),sum:1,ve:veB3},
 'hop-dong-b1':{n:'hd',c:0,t:'Lập hợp đồng · Bước 1/4',act:tag('Nháp','draft'),sum:1,ve:veB1},
 'hop-dong-b2':{n:'hd',c:0,t:'Lập hợp đồng · Bước 2/4',act:tag('Nháp','draft'),sum:1,ve:veB2},
 'hop-dong-b4':{n:'hd',c:0,t:'Lập hợp đồng · Bước 4/4',act:tag('Nháp','draft'),sum:1,ve:veB4},
 'thu-tien':{n:'hd',c:2,bn:'tien',t:'Thu tiền',act:btn('','primary icon sm',{ic:'plus'}),ve:veThu},
 'thu-tien-ct':{n:'hd',c:2,bn:'tien',t:HDK.ma,back:'#thu-tien',sum:1,ve:veThuCT},
 'thu-tien-ghi':{n:'hd',c:2,bn:'tien',t:HDK.ma,back:'#thu-tien',sum:1,ve:veThuGhi},
 'thong-ke':{n:'bc',c:0,bn:'them',t:'Doanh thu',ve:veTK},

};
route();

</script></body></html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đo độ dài mã — R&D 11</title>
<link rel="stylesheet" href="../v4-chung/v4.css">
<link rel="stylesheet" href="chung/v11.css">
<style>body{padding:20px 16px}.wrap{max-width:1180px;margin:0 auto}h1{font-size:20px;margin-bottom:4px}</style>
</head>
<body>
<div class="wrap">
<h1>Mã số dài bao nhiêu thì vừa ô mã trên 10 mẫu chào mừng mới?</h1>
<p class="muted small" style="margin-bottom:12px">Ảnh cắt từ tệp vẽ thật docs/rnd/v10-chao-mung/cm-NN.html?ma=… (khổ dọc 1080×1350), tự mở xem từng ô. Xanh = vừa · Vàng = chạm viền · Đỏ = vỡ (tràn khung hoặc xuống 2 dòng).</p>
<section class="card"><div class="do-luoi" id="luoi"></div></section>
<p class="small" style="margin-top:10px" id="tong"></p>
</div>
<script>
const MA = ['07', '123', 'B3', 'A12', 'M12', 'A-07'];
// Kết quả nhìn bằng mắt (R&D 11, 26/10/2026).
const SAT = { A12: ['cm-03'], M12: ['cm-01', 'cm-03', 'cm-05', 'cm-06'] };
const VO = { 'A-07': ['cm-01', 'cm-03', 'cm-05', 'cm-06', 'cm-07', 'cm-09'] };
const kq = (m, c) => (VO[c] || []).includes(m) ? ['vo', 'vỡ'] : (SAT[c] || []).includes(m) ? ['sat', 'chạm viền'] : ['ok', 'vừa'];
let h = '<span></span>' + MA.map((c) => `<span class="h">“${c}” · ${c.length} ký tự</span>`).join('');
for (let i = 1; i <= 10; i++) {
  const m = 'cm-' + String(i).padStart(2, '0');
  h += `<span class="m">${m}</span>` + MA.map((c) => { const [k, t] = kq(m, c); return `<span class="o"><img src="do/${m}-${c}.png" alt="${m} mã ${c}"><span class="kq ${k}">${t}</span></span>`; }).join('');
}
document.getElementById('luoi').innerHTML = h;
document.getElementById('tong').innerHTML = MA.map((c) => { const v = (VO[c] || []).length, s = (SAT[c] || []).length; return `<b>${c}</b>: vừa ${10 - v - s}/10${s ? `, chạm viền ${s}` : ''}${v ? `, vỡ ${v}` : ''}`; }).join(' · ');
</script>
</body>
</html>

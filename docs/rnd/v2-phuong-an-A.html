<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeup Pro – Vòng 2 – Phương án A</title>
<style>
:root{
  --bg:#F6F4F2; --surface:#FFFFFF; --line:#E9E3DE; --line-2:#F2EDE9; --soft:#FBFAF9;
  --text:#221C19; --muted:#716862; --faint:#A39A94;
  --accent:#A63D62; --accent-soft:#F7E8EE; --accent-line:#E7B8C9;
  --ok:#2F7D72; --ok-bg:#E6F3F0;
  --warn:#8A5A00; --warn-bg:#FFF6E0; --warn-line:#EED6A0;
  --danger:#B42318; --danger-bg:#FEF0EE; --danger-line:#F3B8B0;
  --font:"Be Vietnam Pro", Inter, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;flex:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* ===== Khung theo phương án lịch C ===== */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--surface);border-right:1px solid var(--line)}
.side{display:flex;flex-direction:column;position:sticky;top:0;max-height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:18px 20px;font-weight:700;font-size:17px;color:var(--accent);border-bottom:1px solid var(--line)}
.side .user{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}
.side .user small{display:block;color:var(--muted);font-size:12px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;background:#7A6A62}
.menu{padding:12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.menu a.on{background:var(--accent);color:#fff}
.menu .kids{margin:2px 0 6px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.menu .kids a{padding:8px 14px;border-radius:0 8px 8px 0;font-size:13.5px;font-weight:400}
.menu .kids a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.body{min-width:0}
.topbar{display:none}
.bnav{display:none}
.main{padding:24px 28px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:700}
.ph .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ch2{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch2 h2{font-size:16px;font-weight:700;flex:1}
.ch2 small{color:var(--faint);font-weight:400;font-size:13px}
/* ===== Điều khiển ===== */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff!important}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:0 8px}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{width:34px;padding:0}
.btn.dashed{border-style:dashed;color:var(--accent);border-color:var(--accent-line);background:#FFFCFD}
.ctl{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;width:100%;min-width:0}
.ctl.money,.ctl.r{text-align:right;font-variant-numeric:tabular-nums}
.ctl:disabled{background:var(--soft);color:var(--muted)}
.ctl.sm{height:30px;font-size:13px;padding:0 8px}
textarea.ctl{height:auto;padding:8px 10px;resize:vertical}
.unit{position:relative;display:block}
.unit .ctl{padding-right:46px}
.unit b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:500;color:var(--faint);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex:none}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:0 12px;height:34px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{color:#CFC7C1;background:repeating-linear-gradient(135deg,#FAF8F6 0 5px,#fff 5px 10px);cursor:not-allowed}
.seg.sm button{height:28px;padding:0 9px;font-size:12.5px}
.sw{width:38px;height:22px;border-radius:11px;background:#D9D2CD;position:relative;flex:none;display:inline-block}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)} .sw.on::after{left:19px}
.set{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.set:first-child{border-top:0}
.set>label{font-weight:500}
.set .r{justify-self:end}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:500;font-size:13px;color:var(--text);cursor:pointer}
.chip .k{color:var(--faint)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.on .k{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--muted);white-space:nowrap}
.tag.nv{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.ps{background:var(--warn-bg);color:var(--warn)}
.tag.huy{background:var(--danger-bg);color:var(--danger)}
.tag.draft{background:#EFEBE8;color:var(--muted)}
.loc{display:inline-flex;gap:4px;flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.strike{text-decoration:line-through;color:var(--faint)}
.tip{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);color:var(--muted);font-size:10.5px;font-weight:700;cursor:help;margin-left:6px;vertical-align:1px;flex:none;font-style:normal;text-transform:none;letter-spacing:0}
.tip:hover::after{content:attr(data-tip);position:absolute;left:-10px;top:calc(100% + 8px);width:240px;background:#2A2220;color:#fff;font-weight:400;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;z-index:60;text-align:left;white-space:normal}
.req{color:var(--danger);margin-left:2px}
.kh{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.kh .pn{font-weight:600;overflow-wrap:anywhere}
.fx{font-size:12px;color:var(--muted)}
/* Danh sách gọn + nhóm chi tiết (bảng giá v2.1) */
.gl-h{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center}
.gl-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);color:var(--text);text-decoration:none}
.gl-h+.gl-r{border-top:0}
.gl-r:hover{background:var(--soft)}
.gl-r.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.gl-n{font-weight:600;min-width:0}
.gl-d{font-size:12.5px;color:var(--faint);white-space:nowrap}
.gl-p{font-weight:700;text-align:right;min-width:92px}
.ng{padding:4px 0 10px}
.ng h3{display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--text);padding:12px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.ng .set{grid-template-columns:minmax(0,1fr) minmax(0,180px)}
.ckl{display:flex;flex-direction:column}
.ckl label{display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:500}
.ckl label .p{margin-left:auto;color:var(--muted);font-weight:400}
.ckl label.off{color:var(--muted)}
.tier{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.ng h3+.tier{border-top:0}
.tier-i{display:flex;gap:10px;align-items:center;min-width:0}
.tier-n{font-weight:600}
.avs{display:flex;flex:none}
.av.sm{width:28px;height:28px;font-size:10.5px;border:2px solid #fff}
.avs .av+.av{margin-left:-8px}
.stu{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.ng h3+.stu{border-top:0}
.stu input{margin-top:3px}
/* Tổng tiền dính đáy */
.sumbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:16px;padding:12px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:16px}
.sumbar .t{display:flex;gap:20px;flex:1;flex-wrap:wrap;align-items:baseline}
.sumbar .t span{color:var(--muted);font-size:13px}
.sumbar .t b{font-size:18px;color:var(--text);margin-left:6px}
.sumbar .t .coc b{font-size:15px}
/* ===== Máy tính bảng ===== */
@media (max-width:1180px){
  .app{grid-template-columns:68px minmax(0,1fr)}
  .side .brand span,.side .user div,.menu a span,.menu .kids{display:none!important}
  .side .brand,.side .user{justify-content:center;padding:16px 0}
  .menu a{justify-content:center}
  .main{padding:20px 20px 32px}
  .ph h1{font-size:21px}
}
/* ===== Điện thoại ===== */
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidecol{display:none}
  body{padding-bottom:64px}
  .topbar{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .tt{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none}
  .bnav a.on{color:var(--accent);font-weight:600}
  .main{padding:12px 12px 24px}
  .ph{display:none}
  .set{grid-template-columns:minmax(0,1fr) minmax(0,160px)}
  .sumbar{position:fixed;left:0;right:0;bottom:64px;border-radius:0;border-left:0;border-right:0;margin:0;padding:10px 14px;gap:10px}
  .sumbar .t{gap:2px 12px}
  .sumbar .t{flex-direction:column}
  .sumbar .t b{font-size:16px}
  .sumbar .hide-m{display:none}
  .has-sum{padding-bottom:84px}
  .gl-r{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .gl-r.sel{background:none;box-shadow:none}
  .gl-d{grid-column:1;grid-row:2}
  .gl-p{grid-column:2;grid-row:1 / span 2}
  .ng .set{grid-template-columns:minmax(0,1fr) minmax(0,150px)}
  .tier{grid-template-columns:minmax(0,1fr) 130px}
  .set.stack{grid-template-columns:1fr;gap:6px}
  .set.stack .r{justify-self:start}
}

/* ===== Riêng phương án A ===== */
.jump{display:flex;gap:8px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl .c{text-align:center} .tbl .r{text-align:right}
.tbl tr.grp td{background:#FDFBFA;font-weight:700;font-size:12.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px}
.tbl tr.grp td span{color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0}
.tbl tr.pk td{border-bottom:0;padding-bottom:4px}
.tbl tr.dt td{padding-top:2px;padding-bottom:12px}
.pn{font-weight:600}
.code{font-size:12px;color:var(--faint);margin-left:6px;font-weight:500}
.inc{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px}
.inc .lb{font-size:12px;color:var(--muted);font-weight:600;min-width:60px}
.inc label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.inc label.off{color:var(--faint)}
.inc .pz{color:var(--muted);font-size:12.5px}
.bx{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pad{padding:6px 18px 12px}
.ex{margin-top:10px;padding:10px 12px;background:var(--soft);border:1px solid var(--line-2);border-radius:8px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.stu{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.stu:first-of-type{border-top:0}
.mob{display:none}
/* Hoá đơn */
.info{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;padding:6px 18px 8px}
.info .set,.foot>.set{grid-template-columns:130px minmax(0,1fr)}
.inv td{vertical-align:top}
.inv .sub td{padding-top:7px;padding-bottom:7px;background:#FFFEFE}
.inv .sub td:first-child{padding-left:34px}
.inv .sub.off td{color:var(--faint)}
.inv .end td{border-bottom:1px solid var(--line)}
.ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ln .pn{font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.ddc{display:flex;flex-direction:column;gap:6px;min-width:250px}
.fx{font-size:12px;color:var(--muted)}
.add{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:16px 18px;border-top:1px solid var(--line)}
.tot .set{grid-template-columns:minmax(0,1fr) 170px;padding:8px 0}
.tot .big{font-size:18px;font-weight:700}
.void td{color:var(--faint)!important}
.void .pn,.void .num{text-decoration:line-through}
.lockbar{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--ok-bg);color:var(--ok);font-weight:500;border-bottom:1px solid var(--line)}
@media (max-width:1180px){
  .tbl th,.tbl td{padding-left:8px;padding-right:8px}
  .hide-t{display:none}
  .ddc{min-width:200px}
  .foot{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:640px){
  .desk{display:none}
  .mob{display:block}
  .two{grid-template-columns:1fr}
  .info{grid-template-columns:1fr;padding:4px 14px}
  .info .set{grid-template-columns:100px minmax(0,1fr)}
  .info .set[style]{grid-row:auto!important}
  .foot{grid-template-columns:1fr;padding:12px 14px}
  .add{padding:12px 14px}
  .mpk{padding:12px 14px;border-top:1px solid var(--line-2)}
  .mpk:first-child{border-top:0}
  .mpk .top{display:flex;gap:10px;align-items:flex-start}
  .mpk .top>div{flex:1;min-width:0}
  .mpk .pr{font-weight:700;text-align:right;white-space:nowrap}
  .mpk .pr del{display:block;font-weight:400;color:var(--faint);font-size:12px}
  .mpk .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px}
  .mg{padding:8px 14px;background:#FDFBFA;font-weight:700;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line-2)}
  .ml{padding:12px 14px;border-top:1px solid var(--line)}
  .ml .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .ml .sl{display:flex;justify-content:space-between;gap:8px;padding:7px 0 7px 14px;border-top:1px dashed var(--line-2);font-size:13px;align-items:center}
  .ml .sl.off{color:var(--faint)}
  .ml .ctlrow{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px 14px}
  .ml .ctlrow .seg{align-self:flex-start}
  .ml.void .pn{text-decoration:line-through;color:var(--faint)}
}

/* Bảng giá v2.1 */
.bgA{overflow:hidden}
.tabsA{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabsA a{padding:14px 10px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabsA a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px}
.lst{min-width:0;padding-bottom:8px}
.lst.one{max-width:760px}
.drw{border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.drw .dh{display:flex;gap:8px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
.drw .dh h2{font-size:16px}
.drw .db{padding:0 18px 8px}
.drw footer,.ftA{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);margin-top:auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;padding:4px 18px 12px}
@media (max-width:1180px){ .split{grid-template-columns:minmax(0,1fr) 360px} .tier{grid-template-columns:minmax(0,1fr) 120px} }
@media (max-width:640px){
  .split{grid-template-columns:minmax(0,1fr)}
  .drw{display:none}
  .cols2{grid-template-columns:1fr;padding:4px 14px 10px}
  .tabsA{padding:0 8px}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Dữ liệu minh hoạ — mỗi ô ứng với một trường trong schema.prisma ===== */
// MakeupSubject
const NV=[{id:'cd',ten:'Cô dâu'},{id:'cr',ten:'Chú rể'},{id:'mcd',ten:'Mẹ cô dâu'},{id:'mcr',ten:'Mẹ chú rể'},{id:'pd',ten:'Phù dâu'},{id:'km',ten:'Khách mời'}];
// LocationType
const DD={STUDIO:'Tại studio / cửa hàng',CUSTOMER_HOME:'Tại nhà khách',OTHER:'Địa điểm khác'};
const DDN={STUDIO:'Studio',CUSTOMER_HOME:'Tại nhà',OTHER:'Nơi khác'};
// StudioLocation
const STU=[{id:'s1',ten:'Studio Chiến',dc:'25 Hoàng Quốc Việt, Cầu Giấy, Hà Nội',md:true},{id:'s2',ten:'Cửa hàng Long Biên',dc:'90 Nguyễn Văn Cừ, Long Biên, Hà Nội',md:false}];
// Service (kind MAIN / ADDON / SURCHARGE) + giá hiện hành từ PriceVersion
const DV=[
 {id:'mk-cd',kind:'MAIN',ma:'MK-CD',ten:'Makeup cô dâu',phut:90,gia:2000000},
 {id:'mk-ah',kind:'MAIN',ma:'MK-AH',ten:'Makeup ăn hỏi',phut:75,gia:1300000},
 {id:'mk-me',kind:'MAIN',ma:'MK-ME',ten:'Makeup mẹ',phut:45,gia:500000},
 {id:'mk-pd',kind:'MAIN',ma:'MK-PD',ten:'Makeup phù dâu',phut:40,gia:400000},
 {id:'mk-tc',kind:'MAIN',ma:'MK-TC',ten:'Makeup dự tiệc',phut:45,gia:450000},
 {id:'toc',kind:'ADDON',ma:'PH-TOC',ten:'Làm tóc',phut:30,gia:300000},
 {id:'nail',kind:'ADDON',ma:'PH-NAIL',ten:'Làm nail',phut:45,gia:250000},
 {id:'lens',kind:'ADDON',ma:'PH-LENS',ten:'Lens',phut:0,gia:100000},
 {id:'mi',kind:'ADDON',ma:'PH-MI',ten:'Kẹp mi',phut:15,gia:80000},
 {id:'som',kind:'SURCHARGE',ma:'PP-SOM',ten:'Ca sớm trước 5 giờ',phut:0,gia:200000},
 {id:'them',kind:'SURCHARGE',ma:'PP-NGUOI',ten:'Thêm người',phut:0,gia:150000},
 {id:'cho',kind:'SURCHARGE',ma:'PP-CHO',ten:'Chờ thêm mỗi giờ',phut:60,gia:100000},
];
// ServicePackage + PackageItem (isOptional) + PriceVersion (listPrice, salePrice, effectiveFrom)

/* ---------- BẢNG GIÁ v2.1: tab nhóm trên + danh sách gọn + ngăn kéo phải ---------- */
const BG_KIDS=null;
function tabsBG(cur){return `<nav class="tabsA">${NHOMBG.map(([k,t])=>`<a href="#${k==='goi'?'bang-gia':'bang-gia-'+k}" class="${k===cur?'on':''}">${t}</a>`).join('')}</nav>`}
function ngan(g){return `<aside class="drw"><div class="dh"><div style="min-width:0;flex:1"><div class="fx">${nvTen(g.nv)} · ${g.ma}</div><h2>${g.ten}</h2></div><button class="btn icon sm ghost" title="Đóng">${ic('x')}</button></div>
  <div class="db">${nhomChiTiet(g).map(khoiNhom).join('')}</div><footer><button class="btn">Huỷ</button><button class="btn pri">Lưu</button></footer></aside>`}
function veBangGia(){
  return `<div class="ph"><h1>Bảng giá</h1><span class="sp"></span><button class="btn pri">${ic('plus')}Thêm gói</button></div>
   <div class="card bgA">${tabsBG('goi')}<div class="split"><div class="lst">${dsGoiGon('p1','#bang-gia-goi')}</div>${ngan(goi('p1'))}</div></div>`;
}
function veGoiMobile(){return `<div class="card bgA"><div class="db" style="padding:4px 16px 8px">${nhomChiTiet(goi('p1')).map(khoiNhom).join('')}</div><footer class="ftA"><button class="btn">Huỷ</button><button class="btn pri">Lưu</button></footer></div>`}
function veNhom(k){
  let body='';
  if(k==='phu')body=`<div class="lst one">${nhomPhu()}</div>`;
  if(k==='nv')body=`<div class="lst one">${nhomNhanVat()}</div>`;
  if(k==='dc')body=`<div class="cols2">${nhomDiChuyen().map(x=>`<div>${khoiNhom(x)}</div>`).join('')}</div>`;
  return `<div class="ph"><h1>Bảng giá</h1><span class="sp"></span></div><div class="card bgA">${tabsBG(k)}${body}</div>`;
}
/* ---------- HỢP ĐỒNG: một trang kiểu hoá đơn ---------- */
function veHopDong(xn){
  const T=tong(xn); const khoa=xn;
  const dis=khoa?'disabled':'';
  let rows='',mob='';
  const bt=bangTinh(xn);
  DONG.forEach(d=>{
    const g=goi(d.goi);
    rows+=`<tr><td><div class="ln"><span class="tag nv">${nvTen(d.nv)}</span><span class="pn">${g.ten}</span>${khoa?ic('lock'):''}</div><div class="meta">${g.ma} · ${d.gio}</div></td>
      <td><div class="ddc">${segDD(g,d.dd)}${oDiaDiem(d,khoa)}</div></td>
      <td class="r"><input class="ctl sm r" style="width:56px" value="${d.sl}" ${dis}></td><td class="r num">${vnd(giaGoi(g))}</td><td class="r num"><b>${vnd(d.sl*giaGoi(g))}</b></td><td class="r"><button class="btn icon sm ghost" title="Thao tác">${ic('more')}</button></td></tr>`;
    mob+=`<div class="ml"><div class="hd"><div style="min-width:0"><div class="ln"><span class="tag nv">${nvTen(d.nv)}</span><span class="pn">${g.ten}</span></div><div class="meta">${d.gio} · ${d.sl} × ${vnd(giaGoi(g))}</div></div><b class="num">${vnd(d.sl*giaGoi(g))}</b></div>
      <div class="ctlrow">${segDD(g,d.dd)}${oDiaDiem(d,khoa)}</div>`;
    g.tick.forEach(a=>{const s=dv(a);const on=!!d.them[a];const sl=d.them[a]||d.sl;const huy=xn&&XN.huy[d.id+'-'+a];
      rows+=`<tr class="sub ${on?'':'off'} ${huy?'void':''}"><td><label class="ln"><input type="checkbox" ${on?'checked':''} ${dis}><span class="pn">${s.ten}</span>${huy?`<span class="tag huy">Đã huỷ: ${huy}</span>`:''}</label></td><td></td><td class="r num">${on?sl:''}</td><td class="r num">${vnd(s.gia)}</td><td class="r num">${on?vnd(sl*s.gia):''}</td><td></td></tr>`;
      mob+=`<div class="sl ${on?'':'off'}"><label class="ln"><input type="checkbox" ${on?'checked':''} ${dis}><span class="${huy?'strike':''}">${s.ten}${on&&sl>1?' × '+sl:''}</span></label><span class="num ${huy?'strike':''}">${on?vnd(sl*s.gia):vnd(s.gia)}</span></div>${huy?`<div class="sl" style="border:0;padding-top:0"><span class="tag huy">Đã huỷ: ${huy}</span></div>`:''}`;
    });
    if(d.dd!=='STUDIO'){
      rows+=`<tr class="sub"><td><div class="ln">${ic('car')}<span class="pn">Phí di chuyển</span><span class="req">*</span>${tip(TIP_DC)}</div></td><td><div class="ddc"><div class="ln">${segDC(d,khoa)}${oKm(d,khoa)}</div>${d.dm==='PER_KM'?`<div class="fx">${congThucKm(d)}</div>`:''}</div></td><td class="r">1</td><td class="r num">${vnd(tienDC(d))}</td><td class="r num">${vnd(tienDC(d))}</td><td></td></tr>`;
      mob+=`<div class="sl" style="border-top:1px dashed var(--line-2)"><span class="ln">${ic('car')}Phí di chuyển<span class="req">*</span>${tip(TIP_DC)}</span><span class="num">${vnd(tienDC(d))}</span></div><div class="ctlrow" style="padding-top:0"><div class="ln">${segDC(d,khoa)}${oKm(d,khoa)}</div><div class="fx">${congThucKm(d)}</div></div>`;
    }
    d.pp.forEach(([id,sl])=>{const s=dv(id);
      rows+=`<tr class="sub"><td><div class="ln"><span class="pn">${s.ten}</span></div></td><td></td><td class="r">${sl}</td><td class="r num">${vnd(s.gia)}</td><td class="r num">${vnd(sl*s.gia)}</td><td></td></tr>`;
      mob+=`<div class="sl"><span>${s.ten} <span class="faint small">· phụ phí</span></span><span class="num">${vnd(sl*s.gia)}</span></div>`;
    });
    rows=rows.replace(/<tr class="sub([^"]*)">(?![\s\S]*<tr class="sub)/,'<tr class="sub$1 end">');
    mob+='</div>';
  });
  PHUPHI.forEach(([id,sl,ghi])=>{const s=dv(id);
    rows+=`<tr class="end"><td><div class="ln"><span class="tag">Phụ phí</span><span class="pn">${s.ten}</span></div><div class="meta">${ghi}</div></td><td></td><td class="r">${sl}</td><td class="r num">${vnd(s.gia)}</td><td class="r num"><b>${vnd(sl*s.gia)}</b></td><td class="r"><button class="btn icon sm ghost">${ic('more')}</button></td></tr>`;
    mob+=`<div class="ml"><div class="hd"><div><span class="tag">Phụ phí</span> <span class="pn">${s.ten}</span><div class="meta">${ghi}</div></div><b class="num">${vnd(sl*s.gia)}</b></div></div>`;
  });
  RIENG.forEach(r=>{
    rows+=`<tr class="end"><td><div class="ln"><span class="tag">Tự đặt tên</span><input class="ctl sm" style="max-width:240px" value="${r.ten}" ${dis}></div></td><td></td><td class="r"><input class="ctl sm r" style="width:56px" value="${r.sl}" ${dis}></td><td class="r"><input class="ctl sm money" style="width:120px;margin-left:auto" value="${vnd(r.dg)}" ${dis}></td><td class="r num"><b>${vnd(r.sl*r.dg)}</b></td><td class="r"><button class="btn icon sm ghost">${ic('more')}</button></td></tr>`;
    mob+=`<div class="ml"><div class="hd"><div><span class="tag">Tự đặt tên</span> <span class="pn">${r.ten}</span><div class="meta">${r.sl} × ${vnd(r.dg)}</div></div><b class="num">${vnd(r.sl*r.dg)}</b></div></div>`;
  });
  if(xn)XN.ps.forEach(p=>{
    rows+=`<tr class="end"><td><div class="ln"><span class="tag ps">Phát sinh ${p.luc}</span><span class="pn">${p.ten}</span></div><div class="meta">${p.ghi}</div></td><td></td><td class="r">${p.sl}</td><td class="r num">${vnd(p.dg)}</td><td class="r num"><b>${vnd(p.sl*p.dg)}</b></td><td class="r"><button class="btn icon sm ghost">${ic('more')}</button></td></tr>`;
    mob+=`<div class="ml"><div class="hd"><div><span class="tag ps">Phát sinh ${p.luc}</span> <span class="pn">${p.ten}</span><div class="meta">${p.ghi}</div></div><b class="num">${vnd(p.sl*p.dg)}</b></div></div>`;
  });
  const st=xn?`<span class="tag ok">Đã xác nhận · ${XN.luc}</span>`:`<span class="tag draft">Nháp</span>`;
  const nut=xn?`<button class="btn pri">${ic('plus')}Thêm phát sinh</button>`:`<button class="btn hide-m">Lưu nháp</button><button class="btn pri">Xác nhận hợp đồng</button>`;
  const add=xn?`<button class="btn dashed sm">${ic('plus')}Phát sinh: gói</button><button class="btn dashed sm">${ic('plus')}Phát sinh: phụ phí cài sẵn</button><button class="btn dashed sm">${ic('plus')}Phát sinh: khoản tự đặt tên</button>`
   :`<button class="btn dashed sm">${ic('plus')}Thêm gói</button><button class="btn dashed sm">${ic('plus')}Phụ phí cài sẵn</button><button class="btn dashed sm">${ic('plus')}Khoản tự đặt tên</button>`;
  return `<div class="ph"><h1>${xn?'Hợp đồng':'Lập hợp đồng'} ${HD.ma}</h1>${st}<span class="sp"></span></div>
  <div class="card">
    ${xn?`<div class="lockbar">${ic('lock')}Dòng đã chốt không sửa được. Chỉ thêm phát sinh hoặc huỷ dòng kèm lý do.</div>`:''}
    <div class="ch2"><h2>Khách hàng &amp; ngày</h2>${xn?'':`<button class="btn sm">${ic('plus')}Khách mới</button>`}</div>
    <div class="info">
      <div class="set" style="grid-row:span 2;align-items:start"><label style="padding-top:10px">Khách hàng</label>${theKhach(khoa)}</div>
      <div class="set"><label>Ngày sự kiện</label><input class="ctl" value="${HD.thu}, ${HD.ngay}" ${dis}></div>
      <div class="set"><label>Mã hợp đồng</label><input class="ctl" value="${HD.ma}" disabled></div>
    </div>
    <div class="ch2" style="border-top:1px solid var(--line)"><h2>Nội dung <small>· ${T.soDong} dòng tính tiền</small></h2></div>
    <div class="desk"><table class="tbl inv"><thead><tr><th>Nội dung</th><th>Địa điểm / cách tính</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mob">${mob}</div>
    <div class="add">${add}</div>
    <div class="foot">
      <div class="set" style="align-items:start;border:0"><label>Ghi chú hợp đồng</label><textarea class="ctl" rows="3">${HD.ghichu}</textarea></div>
      <div class="tot">
        <div class="set"><label>Tạm tính</label><span class="r num">${vnd(T.sub)}</span></div>
        <div class="set"><label>Giảm giá${tip(TIP_GIAM)}</label><input class="ctl money" value="${vnd(T.giam)}" ${dis}></div>
        <div class="set"><label class="big">Tổng</label><span class="r num big">${vnd(T.tong)}</span></div>
        <div class="set"><label>Cọc cần thu${tip(TIP_COC)}</label><input class="ctl money" value="${vnd(T.coc)}" ${dis}></div>
      </div>
    </div>
  </div>
  <div class="sumbar"><div class="t"><span>Tổng<b class="num">${vnd(T.tong)}</b></span><span class="coc">Cọc<b class="num">${vnd(T.coc)}</b></span></div>${nut}</div>`;
}
const MAN={
  'bang-gia':{nhom:'bang-gia',tieude:'Bảng giá',tact:`<button class="btn pri sm">${ic('plus')}Gói</button>`,ve:veBangGia},
  'bang-gia-goi':{nhom:'bang-gia',tieude:'Cô dâu – Ngày cưới',back:'#bang-gia',ve:veGoiMobile},
  'bang-gia-phu':{nhom:'bang-gia',tieude:'Bảng giá',ve:()=>veNhom('phu')},
  'bang-gia-dc':{nhom:'bang-gia',tieude:'Bảng giá',ve:()=>veNhom('dc')},
  'bang-gia-nv':{nhom:'bang-gia',tieude:'Bảng giá',ve:()=>veNhom('nv')},
  'hop-dong':{nhom:'hop-dong',con:0,tieude:'Lập hợp đồng '+HD.ma,tact:'<span class="tag draft">Nháp</span>',sum:true,ve:()=>veHopDong(false)},
  'hop-dong-xn':{nhom:'hop-dong',con:1,tieude:'Hợp đồng '+HD.ma,tact:'<span class="tag ok">Đã xác nhận</span>',sum:true,ve:()=>veHopDong(true)},
};
route();

</script>
</body>
</html>

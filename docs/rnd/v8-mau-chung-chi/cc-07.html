<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-07 Hồng mận vàng hồng</title>
<link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 07 — tự sáng tác: chia đôi hiện đại, nửa trái màu mận (gần màu chủ đạo của app #A63D62) với ảnh tròn lớn,
     nửa phải nền trắng hồng, điểm vàng hồng (rose gold). Hợp trung tâm makeup cô dâu.
     Phông: tiêu đề Playfair Display, tên MP Chữ ký 1 (Send Flowers), chữ thường Cormorant Garamond, chữ hoa Montserrat. -->
<style>
.c7{--man:#5A1830;background:#FFF9F7;color:#2A1A20}
.c7 .trai{left:0;top:0;width:410px;height:100%;background:linear-gradient(160deg,#3E0F21 0%,#7A2444 55%,#A63D62 100%)}
.c7 .soc{left:0;top:0;width:410px;height:100%;opacity:.16;background:repeating-linear-gradient(135deg,#F2CDB8 0 1px,transparent 1px 22px)}
.c7 .anh{left:85px;top:150px;width:240px;height:240px;box-shadow:0 0 0 6px #5A1830,0 0 0 9px #E8B9A0,0 0 0 16px rgba(232,185,160,.0),0 0 0 17px #E8B9A0}
.c7 .o-logo{left:181px;top:58px;width:48px;height:48px}
.c7 .thg{left:30px;width:350px;top:430px;text-align:center;font-family:var(--f-sans);font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#F7DCCB}
.c7 .so{left:30px;width:350px;top:466px;text-align:center;color:#F2CDB8}
.c7 .huy{left:335px;top:560px;width:150px}
.c7 .t1{left:470px;top:96px;font-family:var(--f-chan2);font-weight:800;font-size:66px;letter-spacing:.04em;line-height:1;color:var(--man)}
.c7 .t2{left:474px;top:176px;font-size:15px;letter-spacing:.36em;color:#9A5B45}
.c7 .gach0{left:474px;top:212px;width:90px;height:3px;background:linear-gradient(90deg,#C98E73,#F2CDB8)}
.c7 .tag{left:474px;top:258px;font-size:12px;letter-spacing:.28em;color:#7A5560}
.c7 .ten{left:460px;top:280px;width:620px;font-size:calc(78px * var(--ten-co));color:var(--man)}
.c7 .dong{left:474px;top:408px;width:600px;font-size:24px;font-style:italic;font-weight:500}
.c7 .ngay{left:474px;top:448px;font-size:18px;font-style:italic;color:#7A5560}
.c7 .ky1{left:520px;top:560px;width:230px}
.c7 .ky2{left:820px;top:560px;width:230px}
</style></head>
<body class="xem"><main>
<section class="cc c7">
  <div class="trai"></div><div class="soc"></div>
  <div class="o-logo de-sang"><img data-f="logo" alt=""></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="so meta">Số chứng chỉ <b data-f="so"></b></div>
  <div class="huy" data-huy-hieu data-kieu="hoa" data-kim="hong" data-nen="#5A1830"></div>
  <div class="t1" data-td>CHỨNG CHỈ</div>
  <div class="t2 caps">Hoàn thành khoá học</div>
  <div class="gach0"></div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main><script src="chung/cc.js"></script></body></html>

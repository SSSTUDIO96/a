<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Mẫu 10 — tự sáng tác: nền xanh lục bảo có lưới hình thoi chìm, tấm kem vát góc viền vàng.
     HUY HIỆU TO có ruy băng vàng ở cột trái tấm kem. Tiêu đề vàng đậm nổi khối 3D, tên xanh lục bảo.
     Ô ảnh học viên (tròn, nhỏ ~27 mm): góc TRÊN PHẢI của tấm kem. ?anh=an để ẩn. -->
<style>
.c10{--f-ten:var(--f-ky-1);--ten-co:var(--ky-co-1);--luc:#0F3D34;background:#0F3D34;color:#1E2A26}
.c10 .nen{inset:0}
.c10 .anh{left:944px;top:78px;width:104px;height:104px;box-shadow:0 0 0 3px #FBF7EE,0 0 0 5px #B88A35,0 0 0 8px #FBF7EE,0 0 0 9px #0F3D34}
.c10 .huy{left:98px;top:200px;width:240px}
.c10 .so{left:98px;width:240px;top:520px;text-align:center;color:#3F5A52;line-height:1.7}
.c10 .o-logo{left:376px;top:84px;width:38px;height:38px}
.c10 .thg{left:424px;top:84px;line-height:38px;color:var(--luc);max-width:480px}
.c10.khong-logo .thg{left:376px}
.c10 .t1{left:372px;top:134px;width:540px;height:84px}
.c10 .t2{left:376px;top:228px;font-family:var(--f-sans);font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#7A5418;white-space:nowrap}
.c10 .tag{left:376px;top:278px;color:#3F5A52;font-size:12px}
.c10 .ten{left:362px;top:298px;width:690px;height:158px;font-size:calc(118px * var(--ten-co));color:var(--luc)}
.c10 .dong{left:376px;top:470px}
.c10 .ngay{left:376px;top:508px;color:#3F5A52}
.c10 .ky1{left:376px;top:572px;width:230px}
.c10 .ky2{left:800px;top:572px;width:230px}
</style></head>
<body class="xem"><main>
<section class="cc c10">
  <svg class="nen" viewBox="0 0 1123 794" aria-hidden="true">
    <defs>
      <pattern id="thoi10" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M18 0 L36 18 L18 36 L0 18Z" fill="none" stroke="#1B5446" stroke-width="1"/></pattern>

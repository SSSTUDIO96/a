<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-05 Hoa văn vàng cổ điển</title>
<link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 05 — học tinh thần ảnh tham khảo 5 (viền hoa văn vàng cổ điển, chữ xanh đậm, huy hiệu nhỏ giữa hai chữ ký).
     Hoa văn viền, góc và đường cuộn đều sinh bằng SVG trong tệp này (không chép ảnh).
     Phông: tiêu đề Playfair Display, tên MP Chữ ký 2 (Whisper), chữ thường Cormorant Garamond, chữ hoa Montserrat. -->
<style>
.c5{--f-ten:var(--f-ky-2);--ten-co:var(--ky-co-2);--xanh:#14284B;background:#FFFDF8;color:var(--xanh)}
.c5 .vien{inset:0}
.c5 .t1{left:0;right:0;top:110px;text-align:center;font-family:var(--f-chan2);font-weight:700;font-size:58px;letter-spacing:.08em;line-height:1}
.c5 .t2{left:0;right:0;top:178px;text-align:center;font-size:16px;letter-spacing:.42em;color:var(--xanh)}
.c5 .gach0{left:50%;top:210px;width:300px;margin-left:-150px;height:1px;background:#B88A35}
.c5 .tag{left:0;right:0;top:232px;text-align:center;font-size:12.5px;letter-spacing:.28em;color:#3B4A66}
.c5 .ten{left:150px;right:150px;top:254px;text-align:center;font-size:calc(82px * var(--ten-co))}
.c5 .gach{left:50%;top:372px;width:520px;margin-left:-260px;height:1px;background:var(--xanh);opacity:.6}
.c5 .dong{left:0;right:0;top:386px;text-align:center;font-size:24px;font-style:italic;font-weight:500;color:#1F2A3C}
.c5 .ngay{left:0;right:0;top:424px;text-align:center;font-size:18px;font-style:italic;color:#3B4A66}
.c5 .cuon{left:50%;top:462px;width:220px;margin-left:-110px;height:40px}
.c5 .anh{left:50%;top:514px;width:136px;height:136px;margin-left:-68px;box-shadow:0 0 0 4px #FFFDF8,0 0 0 7px #B88A35}
.c5 .huy{left:50%;top:620px;width:84px;margin-left:-42px}
.c5 .ky1{left:190px;top:540px;width:250px}
.c5 .ky2{right:190px;top:540px;width:250px}
.c5 .o-logo{left:50%;top:60px;width:40px;height:40px;margin-left:-20px}
.c5 .thg{left:0;right:0;top:64px;text-align:center;font-family:var(--f-sans);font-weight:600;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;display:none}
.c5.khong-logo .thg{display:block}
.c5 .tht{left:150px;top:108px;width:200px;text-align:center;font-family:var(--f-sans);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#3B4A66;display:none}
.c5 .so{right:120px;top:104px;color:#3B4A66}
.c5 .tenth{left:120px;top:104px;color:#3B4A66}
</style></head>
<body class="xem"><main>
<section class="cc c5">
  <svg class="vien" viewBox="0 0 1122 794" aria-hidden="true">
    <defs>
      <linearGradient id="v5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#E9CF86"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#F3DE9C"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <pattern id="ren5" width="26" height="26" patternUnits="userSpaceOnUse">
        <rect width="26" height="26" fill="#FBF3DF"/>
        <g fill="none" stroke="#A97C2C" stroke-width="1.3"><circle cx="13" cy="7.5" r="5.2"/><circle cx="13" cy="18.5" r="5.2"/><circle cx="7.5" cy="13" r="5.2"/><circle cx="18.5" cy="13" r="5.2"/></g>
        <circle cx="13" cy="13" r="1.8" fill="#8A6420"/><path d="M0 0 l3 0 -3 3z M26 0 l-3 0 3 3z M0 26 l3 0 -3 -3z M26 26 l-3 0 3 -3z" fill="#A97C2C"/>
      </pattern>
    </defs>
    <rect x="18" y="18" width="1086" height="758" fill="url(#ren5)"/>
    <rect x="18" y="18" width="1086" height="758" fill="none" stroke="url(#v5)" stroke-width="3"/>
    <rect x="46" y="46" width="1030" height="702" fill="#FFFDF8" stroke="url(#v5)" stroke-width="3"/>
    <rect x="56" y="56" width="1010" height="682" fill="none" stroke="#B88A35" stroke-width="1"/>
    <rect x="62" y="62" width="998" height="670" fill="none" stroke="#B88A35" stroke-width=".6" stroke-dasharray="2 4"/>
    <g id="goc5"></g>
  </svg>
  <svg class="cuon" viewBox="0 0 220 40" aria-hidden="true" id="cuon5"></svg>
  <div class="o-logo"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="tenth meta" data-f="th"></div>
  <div class="so meta">Số <b data-f="so"></b></div>
  <div class="t1" data-td>CHỨNG NHẬN</div>
  <div class="t2 caps">Tốt nghiệp</div>
  <div class="gach0"></div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="gach"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#14284B" data-dong1="TỐT NGHIỆP"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
// Hoa văn góc và đường cuộn: xoắn ốc tự sinh.
(function(){
  function xoan(cx,cy,r0,vong,chieu,goc0){let d='';const n=60;for(let i=0;i<=n;i++){const t=i/n;const a=goc0+chieu*t*vong*2*Math.PI;const r=r0*(1-t*.82);
    d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);}return d;}
  // Một góc (vẽ ở góc trên trái, các góc khác lật gương)
  const g1=`<g fill="none" stroke="url(#v5)" stroke-width="2.4" stroke-linecap="round">
    <path d="M66 150 C66 100 90 72 140 66"/><path d="M66 190 C72 130 110 90 190 80"/>
    <path d="${xoan(100,104,26,1.1,1,Math.PI*0.9)}"/><path d="${xoan(150,82,14,1,-1,Math.PI*1.4)}"/><path d="${xoan(82,150,14,1,1,Math.PI*0.2)}"/>
    <path d="M190 80 C215 76 228 84 236 96" /><path d="M66 190 C62 215 70 228 82 236"/></g>
    <g fill="#8A6420"><circle cx="238" cy="98" r="3"/><circle cx="84" cy="238" r="3"/><path d="M98 98 l8 -14 8 14 -8 14z" opacity=".9"/></g>`;
  const W=1122,H=794;
  document.getElementById('goc5').innerHTML=[`<g>${g1}</g>`,`<g transform="translate(${W} 0) scale(-1 1)">${g1}</g>`,`<g transform="translate(0 ${H}) scale(1 -1)">${g1}</g>`,`<g transform="translate(${W} ${H}) scale(-1 -1)">${g1}</g>`].join('');
  const nua=`<path d="M100 20 C80 4 52 4 40 20 C30 34 14 30 14 20 C14 12 24 10 26 18" /><path d="${xoan(26,20,9,.9,-1,Math.PI)}"/><path d="M100 20 C84 32 66 34 56 28"/>`;
  document.getElementById('cuon5').innerHTML=`<g fill="none" stroke="#14284B" stroke-width="2.2" stroke-linecap="round">${nua}<g transform="translate(220 0) scale(-1 1)">${nua}</g></g><path d="M110 10 l7 10 -7 10 -7 -10z" fill="#14284B"/>`;
})();
</script>
<script src="chung/cc.js"></script></body></html>

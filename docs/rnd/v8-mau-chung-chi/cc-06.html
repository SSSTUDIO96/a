<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-06 Hoa văn guilloche bạc</title>
<link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 06 — tự sáng tác: hoa văn guilloche (đường lượn đan nhau như trên tiền giấy, bằng cấp) màu bạc–xanh thép.
     Học từ ảnh 5 bản viền bạc: tông bạc, khung trang trọng. Mọi đường guilloche sinh bằng SVG trong tệp.
     Phông: tiêu đề Playfair Display, tên MP Chữ ký 4 (Waterfall), chữ thường Cormorant Garamond, chữ hoa Montserrat. -->
<style>
.c6{--f-ten:var(--f-ky-4);--ten-co:var(--ky-co-4);--thep:#1F3A5A;background:#F4F6F8;color:var(--thep)}
.c6 .hv{inset:0}
.c6 .anh{left:772px;top:178px;width:196px;height:196px;box-shadow:0 0 0 4px #F4F6F8,0 0 0 6px #7D8996}
.c6 .huy{left:940px;top:370px;width:110px}
.c6 .o-logo{left:96px;top:84px;width:40px;height:40px}
.c6 .thg{left:146px;top:84px;line-height:40px;font-family:var(--f-sans);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#3C5470;max-width:420px;white-space:nowrap;overflow:hidden}
.c6.khong-logo .thg{left:96px}
.c6 .t1{left:94px;top:148px;font-family:var(--f-chan2);font-weight:800;font-size:60px;letter-spacing:.05em;line-height:1}
.c6 .t2{left:98px;top:220px;font-size:15px;letter-spacing:.36em;color:#3C5470}
.c6 .tag{left:98px;top:282px;font-size:12px;letter-spacing:.28em;color:#4D6480}
.c6 .ten{left:84px;top:300px;width:610px;font-size:calc(70px * var(--ten-co))}
.c6 .gach{left:98px;top:420px;width:580px;height:1px;background:linear-gradient(90deg,#7D8996,rgba(125,137,150,0))}
.c6 .dong{left:98px;top:434px;width:640px;font-size:24px;font-style:italic;font-weight:500;color:#1D2B3A}
.c6 .ngay{left:98px;top:474px;font-size:18px;font-style:italic;color:#4D6480}
.c6 .so{left:772px;top:476px;width:196px;text-align:center;color:#4D6480;line-height:1.7}
.c6 .ky1{left:98px;top:556px;width:250px}
.c6 .ky2{left:430px;top:556px;width:250px}
</style></head>
<body class="xem"><main>
<section class="cc c6">
  <svg class="hv" viewBox="0 0 1122 794" aria-hidden="true" id="hv6"></svg>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-kim="bac" data-nen="#1F3A5A" data-chu="#E6EBF0"></div>
  <div class="o-logo"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="t1" data-td>CHỨNG CHỈ</div>
  <div class="t2 caps">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="gach"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="so meta">Số chứng chỉ<br><b data-f="so"></b></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
(function(){
  const W=1122,H=794,P=[];
  const f=(n)=>n.toFixed(1);
  // Dải guilloche viền: các sóng sin lệch pha chạy dọc 4 cạnh (dải từ 24 đến 60 px tính từ mép).
  function canh(x0,y0,x1,y1,doc){const L=doc?y1-y0:x1-x0;const n=Math.round(L/4);
    for(let k=0;k<8;k++){const ph=k*Math.PI/4;let d='';
      for(let i=0;i<=n;i++){const t=i/n*L;const o=42+11*Math.sin(t/14+ph)+4*Math.sin(t/5.3-ph);
        const x=doc?(x0<W/2?x0+o:x0-o):x0+t, y=doc?y0+t:(y0<H/2?y0+o:y0-o);d+=(i?'L':'M')+f(x)+' '+f(y);}
      P.push(`<path d="${d}" stroke="${k%2?'#9AA6B3':'#5C7591'}"/>`);}}
  canh(60,0,W-60,0,0);canh(60,H,W-60,H,0);canh(0,60,0,H-60,1);canh(W,60,W,H-60,1);
  // Hoa thị guilloche ở 4 góc
  function hoa(cx,cy,R,a,n,m,mau,w){for(let k=0;k<m;k++){const ph=k*2*Math.PI/m/n;let d='';
    for(let i=0;i<=360;i++){const t=i/360*2*Math.PI;const r=R+a*Math.sin(n*t+ph*n);d+=(i?'L':'M')+f(cx+r*Math.cos(t))+' '+f(cy+r*Math.sin(t));}
    P.push(`<path d="${d}" stroke="${mau}" stroke-width="${w}"/>`);}}
  for(const [x,y] of [[42,42],[W-42,42],[42,H-42],[W-42,H-42]]){P.push(`<circle cx="${x}" cy="${y}" r="30" fill="#F4F6F8"/>`);hoa(x,y,20,7,7,6,'#5C7591',.8);}
  // Hoa thị lớn quanh ảnh
  hoa(870,276,150,16,18,14,'#9AA6B3',.7);hoa(870,276,128,10,24,10,'#5C7591',.6);
  P.push(`<rect x="66" y="66" width="${W-132}" height="${H-132}" stroke="#5C7591" stroke-width="1.2"/>`);
  P.push(`<rect x="72" y="72" width="${W-144}" height="${H-144}" stroke="#9AA6B3" stroke-width=".6"/>`);
  document.getElementById('hv6').innerHTML=`<g fill="none" stroke-width=".9">${P.join('')}</g>`;
})();
</script>
<script src="chung/cc.js"></script></body></html>

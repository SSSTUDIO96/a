<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-16 Vinh danh kim cương (theo ảnh 16)</title>
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 16 — dựng sát ảnh anh Chiến gửi số 16 ("Vinh danh · Diamond Award"): nền trắng ngà-bạc có lấp lánh, viền vàng mảnh bo theo mép,
     KHỐI PHA LÊ NHIỀU MẶT màu xanh bạc ở góc trái (~1/4 chiều ngang, cao gần hết) + dải pha lê ở mép đáy phải (đa giác gradient vẽ SVG),
     trên cùng ô logo | tên trung tâm, tiêu đề 2 dòng (dòng 1 vàng nổi khối 3D, dòng 2 chữ to xanh thẫm + chữ nhỏ đen như "DIAMOND AWARD"),
     đường kẻ hoa văn hình thoi, tên chữ ký trên gạch mảnh, dòng phụ in hoa đậm, đường thoi thứ hai, lời tri ân 3 dòng canh giữa, hai chỗ ký.
     Không dùng chữ/logo của hãng nào trong ảnh; mọi hình tự vẽ.
     Ô ảnh học viên (tròn, viền vàng mảnh, ~33 mm): nằm TRÊN khối pha lê bên trái — chữ không đè lên pha lê. ?anh=an để ẩn. -->
<style>
.c16{--f-ten:var(--f-ky-2);--ten-co:var(--ky-co-2);background:#F7F8FB;color:#1B2B4B}
.c16 .nen{inset:0}
.c16 .anh{left:80px;top:272px;width:128px;height:128px;box-shadow:0 0 0 3px #EAF1FA,0 0 0 5px #C9A961,0 0 0 6px #EAF1FA}
.c16 .day{left:330px;width:740px;top:46px;display:flex;justify-content:center;align-items:center;gap:14px}
.c16 .o-logo{position:static;width:34px;height:34px}
.c16 .thg{color:#1B2B4B;font-size:12px;letter-spacing:.24em;font-weight:600}
.c16 .day i{width:1px;height:20px;background:#7D8996}
.c16 .t1{left:380px;top:88px;width:640px;height:64px}
.c16 .t2a{left:372px;top:158px;width:424px;height:70px}
.c16 .t2b{left:808px;top:182px;width:232px;height:46px}
.c16 .orn{left:0;width:1123px}
.c16 .orn1{top:238px}.c16 .orn2{top:440px}
.c16 .ten{left:330px;top:256px;width:740px;height:144px;font-size:calc(118px * var(--ten-co));color:#1B2B4B}
.c16 .kl{left:330px;width:740px;top:406px;text-align:center;font-family:var(--f-sans);font-weight:700;font-size:15px;letter-spacing:.14em;color:#1B2B4B;white-space:nowrap}
.c16 .loi{left:330px;width:740px;top:460px;text-align:center;font-family:var(--f-chan);font-size:18px;font-weight:500;font-style:italic;line-height:1.55;color:#2A3550}
.c16 .ngay{left:330px;width:740px;top:548px;text-align:center;color:#4A5570;font-size:17px}
.c16 .ky1{left:410px;top:590px;width:220px;color:#1B2B4B}
.c16 .ky2{left:752px;top:590px;width:220px;color:#1B2B4B}
.c16 .ky .cv{font-weight:700;letter-spacing:.14em}
.c16 .ky .nm{font-family:var(--f-sans);text-transform:uppercase;font-weight:700;font-size:12.5px;letter-spacing:.1em}
.c16 .so{left:380px;top:738px;color:#4A5570}
</style></head>
<body class="xem"><main>
<section class="cc c16">
  <svg class="nen" viewBox="0 0 1123 794" aria-hidden="true" id="nen16">
    <defs>
      <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F5FA"/><stop offset=".5" stop-color="#FCFCFE"/><stop offset="1" stop-color="#E9EDF5"/></linearGradient>
      <linearGradient id="v16" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#F3DE9C"/><stop offset=".55" stop-color="#B88A35"/><stop offset=".8" stop-color="#F0D587"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <clipPath id="tr16"><path d="M0 0 H256 L304 118 L272 262 L318 402 L286 562 L336 702 L306 794 H0Z"/></clipPath>
      <clipPath id="ph16"><path d="M560 794 L700 754 L850 730 L1000 704 L1123 654 V794Z"/></clipPath>
    </defs>
    <rect width="1123" height="794" fill="url(#bg16)"/>
    <g id="lap16"></g>
    <g clip-path="url(#tr16)" id="tl16g"></g>
    <g clip-path="url(#ph16)" id="pb16g"></g>
    <path d="M256 0 L304 118 L272 262 L318 402 L286 562 L336 702 L306 794" fill="none" stroke="url(#v16)" stroke-width="1.6"/>
    <path d="M560 794 L700 754 L850 730 L1000 704 L1123 654" fill="none" stroke="url(#v16)" stroke-width="1.6" transform="translate(0 -9)"/>
    <rect x="14" y="14" width="1095" height="766" rx="18" fill="none" stroke="url(#v16)" stroke-width="2.4"/>
    <rect x="22" y="22" width="1079" height="750" rx="13" fill="none" stroke="#C9A961" stroke-width=".8"/>
  </svg>
  <svg class="orn orn1" viewBox="0 0 1123 20" height="20" aria-hidden="true" data-orn></svg>
  <svg class="orn orn2" viewBox="0 0 1123 20" height="20" aria-hidden="true" data-orn></svg>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="day"><span class="o-logo"><img data-f="logo" alt=""></span><i></i><span class="thg" data-f="th"></span></div>
  <div class="tt sv t1" data-td data-gold="dam" data-al="center" data-max="58">Giấy chứng nhận</div>
  <div class="tt sv t2a" data-gold="xanh" data-al="right" data-va="b" data-max="68">Hoàn thành</div>
  <div class="tt sv t2b" data-gold="flat" data-al="left" data-va="b" data-max="40" style="color:#14161C">Khoá học</div>
  <div class="ten sv" data-f="ten" data-al="center" data-line="1" data-line-inset="80" data-line-h="1.2" data-line-color="#1B2B4B"></div>
  <div class="kl" data-f="khoaLop"></div>
  <div class="loi">Trân trọng ghi nhận sự nỗ lực, tinh thần học hỏi và những tiến bộ nổi bật<br>của học viên trong suốt khoá học, góp phần mang đến vẻ đẹp tự tin<br>cho mỗi khách hàng và nâng cao chuẩn mực nghề makeup chuyên nghiệp.</div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
  <div class="so meta">Số <b data-f="so"></b></div>
</section>
</main>
<script>
(function(){
  let seed=16;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const f=(n)=>n.toFixed(1);
  // ---- pha lê: lưới điểm lệch + tam giác, màu xanh bạc theo vị trí ----
  const PAL=['#35588A','#4E73A6','#6F8FBE','#8FAED4','#B3C9E5','#D3E1F2','#EAF1FA','#F8FBFF'];
  function luoi(x0,y0,w,h,nx,ny,tang){const cw=w/nx,ch=h/ny,P=[];
    for(let j=0;j<=ny;j++){P.push([]);for(let i=0;i<=nx;i++){const e=(i==0||j==0||i==nx||j==ny)?.15:1;P[j].push([x0+i*cw+(rnd()-.5)*cw*.85*e,y0+j*ch+(rnd()-.5)*ch*.85*e]);}}
    let s='';
    const mau=(x,y)=>{let t=tang(x,y)+(rnd()-.5)*.5;t=Math.min(.999,Math.max(0,t));return PAL[Math.floor(t*PAL.length)];};
    const tri=(a,b,c)=>{const cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3;s+=`<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}L${f(c[0])} ${f(c[1])}Z" fill="${mau(cx,cy)}" stroke="#F4F8FF" stroke-opacity=".5" stroke-width=".7"/>`;};
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=P[j][i],b=P[j][i+1],c=P[j+1][i],d=P[j+1][i+1];
      if(rnd()<.5){tri(a,b,c);tri(b,d,c);}else{tri(a,b,d);tri(a,d,c);}}
    return s;}
  // khối trái: tối ở giữa-trái, sáng dần ra mép phải và hai đầu
  document.getElementById('tl16g').innerHTML=luoi(-20,-20,380,834,7,15,(x,y)=>0.15+Math.min(1,(x+20)/340)*0.55+Math.abs(y-397)/397*0.25);
  // dải đáy phải: sáng ở mép trên, tối dần xuống đáy
  document.getElementById('pb16g').innerHTML=luoi(540,600,600,210,10,5,(x,y)=>0.9-((y-600)/210)*0.55-((x-540)/600)*0.1);
  // vệt sáng chéo trên khối trái
  document.getElementById('tl16g').innerHTML+=`<path d="M0 560 L330 150 L330 210 L0 640Z" fill="#fff" opacity=".13"/><path d="M0 300 L250 20 L290 20 L0 360Z" fill="#fff" opacity=".1"/>`;
  // ---- lấp lánh (chấm bạc + sao 4 cánh), dày ở góc trên phải ----
  let s='';
  for(let i=0;i<260;i++){const x=340+rnd()*783,y=rnd()*794;const d=Math.hypot(1123-x,y)/900;if(rnd()>Math.max(0.06,0.9-d*1.1))continue;
    if(y>640&&x>560)continue;s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.5+rnd()*1.5)}" fill="${rnd()<.5?'#AEBBD6':'#C9D3E8'}" opacity="${f(.35+rnd()*.5)}"/>`;}
  const sao=(x,y,r)=>`<path d="M${f(x)} ${f(y-r)} Q${f(x+r*.12)} ${f(y-r*.12)} ${f(x+r)} ${f(y)} Q${f(x+r*.12)} ${f(y+r*.12)} ${f(x)} ${f(y+r)} Q${f(x-r*.12)} ${f(y+r*.12)} ${f(x-r)} ${f(y)} Q${f(x-r*.12)} ${f(y-r*.12)} ${f(x)} ${f(y-r)}Z" fill="#fff" stroke="#9FB2D6" stroke-width=".7"/>`;
  for(const [x,y,r] of [[1052,64,9],[1084,176,7],[1092,300,6],[1070,232,4]])s+=sao(x,y,r);
  document.getElementById('lap16').innerHTML=s;
  // ---- đường kẻ hoa văn hình thoi ----
  const dia=(x,y,r,fill)=>`<path d="M${x-r} ${y} L${x} ${y-r} L${x+r} ${y} L${x} ${y+r}Z" ${fill?'fill="url(#v16)"':'fill="none" stroke="url(#v16)" stroke-width="1.2"'}/>`;
  document.querySelectorAll('[data-orn]').forEach(sv=>{const cx=700;
    sv.innerHTML=`<path d="M${cx-190} 10 H${cx-24} M${cx+24} 10 H${cx+190}" stroke="#B88A35" stroke-width="1"/>${dia(cx,10,9,false)}${dia(cx,10,4,true)}${dia(cx-196,10,3,true)}${dia(cx+196,10,3,true)}${dia(cx-34,10,3,true)}${dia(cx+34,10,3,true)}`;
    sv.style.left='0';});
})();
</script>
<script src="chung/cc.js"></script></body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Mẫu 03 — dựng sát ảnh anh Chiến gửi số 3: nền trắng, khung mảnh, dải đỏ + hai sợi vàng cong ở góc TRÊN PHẢI và góc DƯỚI TRÁI,
     tiêu đề giữa trang với dòng phụ kẹp hai đường kẻ, "trân trọng trao cho" chữ to xám, tên chữ ký TO, huy hiệu vàng viền hoa ở góc dưới trái
     (đè lên dải đỏ-vàng), hai chỗ ký. Tự vẽ SVG.
     Ô ảnh học viên (tròn, nhỏ ~26 mm): góc TRÊN TRÁI trong khung (chỗ trắng trống ở ảnh gốc), không đụng tiêu đề/tên/huy hiệu. ?anh=an để ẩn. -->
<style>
.c3{background:#FFFFFF;color:#1E1A18}

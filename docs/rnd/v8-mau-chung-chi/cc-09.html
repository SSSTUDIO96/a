<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Mẫu 09 — tự sáng tác: nền ngà, vòng nguyệt quế vàng ôm ảnh học viên (vòng nguyệt quế chính là huy hiệu), dải ruy băng ghi năm.
     Phông: chữ "Chứng chỉ" MP Chữ ký 4 (Waterfall), tên MP Chữ ký 3 (Oooh Baby), chữ thường Cormorant Garamond, chữ hoa Montserrat. -->
<style>

.c9 .ve{inset:0}
.c9 .anh{left:170px;top:236px;width:200px;height:200px;box-shadow:0 0 0 5px #FAF6EE,0 0 0 7px #B88A35}

.c9 .o-logo{left:540px;top:78px;width:40px;height:40px}
.c9 .thg{left:590px;top:78px;line-height:40px;font-family:var(--f-sans);font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#5C4E3C;max-width:440px;white-space:nowrap;overflow:hidden}
.c9.khong-logo .thg{left:540px}
.c9 .t1{left:528px;top:116px;font-family:var(--f-ky-4);font-size:104px;line-height:1.25;padding:0 .1em}
.c9 .t2{left:542px;top:240px;font-size:14px;letter-spacing:.36em;color:#5C4E3C}
.c9 .tag{left:542px;top:294px;font-size:12px;letter-spacing:.26em;color:#6E604C}
.c9 .ten{left:530px;top:312px;width:540px;font-size:calc(76px * var(--ten-co))}
.c9 .gach{left:542px;top:424px;width:500px;height:1px;background:#B88A35}
.c9 .dong{left:542px;top:436px;width:520px;font-size:23px;font-style:italic;font-weight:500;line-height:1.3}
.c9 .ngay{left:542px;top:500px;font-size:17px;font-style:italic;color:#6E604C}
.c9 .ky1{left:542px;top:568px;width:220px}
.c9 .ky2{left:830px;top:568px;width:220px}
.c9 .so{left:150px;top:600px;width:240px;text-align:center;color:#6E604C}
</style></head>
<body class="xem"><main>
<section class="cc c9">
  <svg class="ve" viewBox="0 0 1122 794" aria-hidden="true" id="ve9">
    <defs><linearGradient id="v9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#D8B96A"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#E2C47A"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <linearGradient id="r9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C7428"/><stop offset="1" stop-color="#7A5418"/></linearGradient></defs>
    <rect x="30" y="30" width="1062" height="734" fill="none" stroke="#B88A35" stroke-width="1.4"/>
    <rect x="38" y="38" width="1046" height="718" fill="none" stroke="#B88A35" stroke-width=".6"/>
    <path d="M470 120 V680" stroke="#D9C79E" stroke-width="1"/>
    <g id="vq9"></g>
    <path d="M150 520 H390 L374 539 L390 558 H150 L166 539Z" fill="url(#r9)"/>
    <path d="M150 520 L132 512 V566 L150 558Z M390 520 L408 512 V566 L390 558Z" fill="#6B4A14"/>
  </svg>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="nam">TỐT NGHIỆP <span data-f="nam"></span></div>
  <div class="so meta">Số <b data-f="so"></b></div>
  <div class="o-logo"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="t1 vang-chu toi" data-td>Chứng chỉ</div>
  <div class="t2 caps">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="gach"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
// Vòng nguyệt quế lớn quanh ảnh (tâm 270,336): hai nhành từ dưới vòng lên trên, lá to dần rồi nhỏ lại.
(function(){const cx=270,cy=336,R=136;let s='';
  for(const h of [1,-1]){const a0=h>0?115:65,a1=h>0?250:-70;const n=17;
    for(let i=0;i<n;i++){const t=i/(n-1),a=(a0+(a1-a0)*t)*Math.PI/180;const L=22-10*t,W=8.5-3.5*t;
      for(const [dr,l] of [[-11,-38],[11,38]]){const x=cx+(R+dr)*Math.cos(a),y=cy+(R+dr)*Math.sin(a);
        const rot=(a*180/Math.PI)+(h>0?180:0)+(h>0?l:-l);
        s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${W.toFixed(1)}" ry="${L.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="url(#v9)"/>`;}
      if(i%4===2){const x=cx+(R+24)*Math.cos(a),y=cy+(R+24)*Math.sin(a);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#8A6420"/>`;}}
    const p=(g)=>[(cx+R*Math.cos(g*Math.PI/180)).toFixed(1),(cy+R*Math.sin(g*Math.PI/180)).toFixed(1)].join(' ');
    s+=`<path d="M${p(a0)} A${R} ${R} 0 0 ${h>0?1:0} ${p(a1)}" fill="none" stroke="url(#v9)" stroke-width="2.4"/>`;}
  document.getElementById('vq9').innerHTML=s;})();
</script>
<script src="chung/cc.js"></script></body></html>

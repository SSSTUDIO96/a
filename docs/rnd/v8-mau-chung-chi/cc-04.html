<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-04 Kem sóng chìm dải đen</title>
<link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 04 — học tinh thần ảnh tham khảo 4 (nền kem có sóng chìm, dải đen–vàng phía trên, huy hiệu ở mép dải). Tự vẽ.
     Phông: chữ "Chứng nhận" MP Chữ ký 4 (Waterfall), tên MP Chữ ký 3 (Oooh Baby), chữ thường Cormorant Garamond, chữ hoa Montserrat. -->
<style>
.c4{--f-ten:var(--f-ky-3);--ten-co:var(--ky-co-3);background:#FBF5E8;color:#2B2117}
.c4 .song{inset:0}
.c4 .dai{left:0;top:0;width:100%;height:260px}
.c4 .anh{left:60px;top:300px;width:180px;height:180px;box-shadow:0 0 0 5px #FBF5E8,0 0 0 7px #B88A35,0 0 0 12px #FBF5E8,0 0 0 13px #C9A961}
.c4 .huy{right:72px;top:96px;width:168px}
.c4 .o-logo{left:72px;top:40px;width:38px;height:38px}
.c4 .thg{left:120px;top:40px;line-height:38px;font-family:var(--f-sans);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E6D7B4}
.c4.khong-logo .thg{left:72px}
.c4 .t1{left:66px;top:58px;font-family:var(--f-ky-4);font-size:118px;line-height:1.25;padding:0 .1em}
.c4 .t2{left:400px;top:196px;font-size:16px;letter-spacing:.5em}
.c4 .tag{left:290px;top:296px;font-size:13px;letter-spacing:.26em;color:#5A4630}
.c4 .ten{left:280px;top:318px;width:780px;font-size:calc(84px * var(--ten-co));color:#3A2A14}
.c4 .gach{left:290px;top:440px;width:740px;height:2px;background:var(--vang)}
.c4 .dong{left:290px;top:456px;width:760px;font-size:24px;font-style:italic;font-weight:500}
.c4 .ngay{left:290px;top:496px;font-size:18px;font-style:italic;color:#5A4630}
.c4 .ky1{left:290px;top:572px;width:250px}
.c4 .ky2{left:770px;top:572px;width:250px}
.c4 .so{left:60px;top:520px;width:180px;text-align:center;color:#6B5536;line-height:1.7}
.c4 .chan{left:0;bottom:0;width:100%;height:16px;background:#1D1A17}
.c4 .chan::before{content:"";position:absolute;left:0;right:0;top:-4px;height:4px;background:var(--vang)}
</style></head>
<body class="xem"><main>
<section class="cc c4">
  <svg class="song" viewBox="0 0 1122 794" preserveAspectRatio="none" aria-hidden="true">
    <defs><pattern id="s4" width="120" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 17 C20 5 40 5 60 17 S100 29 120 17" fill="none" stroke="#E7D9B8" stroke-width="7" stroke-linecap="round"/></pattern></defs>
    <rect width="1122" height="794" fill="url(#s4)" opacity=".38"/>
  </svg>
  <svg class="dai" viewBox="0 0 1122 260" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="vg4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#F3DE9C"/><stop offset=".6" stop-color="#B88A35"/><stop offset="1" stop-color="#E9CF86"/></linearGradient>
      <linearGradient id="den4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2622"/><stop offset="1" stop-color="#171411"/></linearGradient></defs>
    <path d="M0 0 H1122 V128 C960 128 860 150 760 205 C690 244 620 250 520 250 H0Z" fill="url(#vg4)"/>
    <path d="M0 0 H1122 V116 C950 116 850 138 750 192 C680 230 610 238 520 238 H0Z" fill="url(#den4)"/>
  </svg>
  <div class="o-logo de-sang"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="t1 vang-chu sang" data-td>Chứng nhận</div>
  <div class="t2 caps vang-chu sang">Tốt nghiệp</div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#1D1A17"></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="so meta">Số chứng chỉ<br><b data-f="so"></b></div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="gach"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
  <div class="chan"></div>
</section>
</main><script src="chung/cc.js"></script></body></html>

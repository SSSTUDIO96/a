<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-13 Đen cẩm thạch vân vàng</title>
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 13 — mẫu thêm (ý riêng): đen cẩm thạch với VÂN VÀNG chảy chéo (đường cong sinh bằng SVG, hạt giống cố định), nửa phải là cột huy hiệu
     TO + ảnh học viên, nửa trái là chữ. Tiêu đề và tên vàng nổi khối 3D.
     Ô ảnh học viên (tròn, nhỏ ~28 mm): cột phải, DƯỚI huy hiệu. ?anh=an để ẩn. -->
<style>
.c13{--f-ten:var(--f-ky-2);--ten-co:var(--ky-co-2);background:#0A0A0C;color:#EDE6DA}
.c13 .nen{inset:0}
.c13 .huy{left:810px;top:128px;width:250px}
.c13 .anh{left:882px;top:520px;width:106px;height:106px;box-shadow:0 0 0 3px #0A0A0C,0 0 0 5px #C9A961,0 0 0 8px #0A0A0C,0 0 0 9px #8A6420}
.c13 .so{left:770px;width:330px;top:650px;text-align:center;color:#C8BBA2}
.c13 .o-logo{left:96px;top:66px;width:36px;height:36px}
.c13 .thg{left:142px;top:66px;line-height:36px;color:#D9CDB6;font-size:11.5px}
.c13.khong-logo .thg{left:96px}
.c13 .t1{left:90px;top:128px;width:640px;height:84px}
.c13 .t2{left:96px;top:222px;font-family:var(--f-sans);font-weight:500;font-size:16px;letter-spacing:.34em;text-transform:uppercase;color:#D8C58E;white-space:nowrap}
.c13 .tag{left:96px;top:290px;color:#E4D6B4;font-size:12.5px;letter-spacing:.34em}
.c13 .ten{left:84px;top:308px;width:650px;height:156px;font-size:calc(118px * var(--ten-co))}
.c13 .dong{left:96px;top:478px;color:#EDE6DA}
.c13 .ngay{left:96px;top:516px;color:#C8BBA2}
.c13 .ky1{left:96px;top:574px;width:240px;color:#EDE6DA}
.c13 .ky2{left:430px;top:574px;width:240px;color:#EDE6DA}
</style></head>
<body class="xem"><main>
<section class="cc c13">
  <svg class="nen" viewBox="0 0 1123 794" aria-hidden="true" id="nen13">
    <defs>
      <radialGradient id="bg13" cx="800" cy="300" r="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#26262B"/><stop offset=".6" stop-color="#121215"/><stop offset="1" stop-color="#08080A"/></radialGradient>
      <linearGradient id="mg13" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="800" y2="0"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
      <linearGradient id="v13" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#F3DE9C"/><stop offset=".55" stop-color="#B88A35"/><stop offset=".8" stop-color="#F0D587"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
    </defs>
    <rect width="1123" height="794" fill="url(#bg13)"/>
    <mask id="mk13" maskUnits="userSpaceOnUse" x="0" y="0" width="1123" height="794"><rect width="1123" height="794" fill="url(#mg13)"/></mask>
    <g id="van13" fill="none" stroke-linecap="round" mask="url(#mk13)"></g>
    <rect x="22" y="22" width="1079" height="750" fill="none" stroke="url(#v13)" stroke-width="1.6"/>
    <path d="M770 90 V700" stroke="#B88A35" stroke-width="1"/>
    <path d="M770 380 l7 -10 7 10 -7 10z M770 90 l5 -7 5 7 -5 7z M770 700 l5 -7 5 7 -5 7z" fill="url(#v13)" transform="translate(-7 0)"/>
  </svg>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#0A0A0C" data-duoi="0"></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="so meta">Số chứng nhận <b data-f="so"></b></div>
  <div class="o-logo de-sang"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="tt sv t1" data-td data-gold="noi" data-al="left" data-max="62">Giấy chứng nhận</div>
  <div class="t2">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten sv" data-f="ten" data-gold="bong" data-al="left" data-line="1" data-line-h="1.4"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
// Vân cẩm thạch: đường cong MƯỢT (spline Catmull-Rom) đi chéo từ trên phải xuống dưới trái, có quầng sáng mờ và nhánh con; hạt giống cố định.
(function(){
  let seed=1019;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const f=(n)=>n.toFixed(1);let s='';
  function spline(P){let d=`M${f(P[0][0])} ${f(P[0][1])}`;
    for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
      d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;}return d;}
  function vein(x,y,ex,ey,n,amp,w,op,nhanh,dep){const P=[[x,y]];
    for(let i=1;i<n;i++){const t=i/n;P.push([x+(ex-x)*t+(rnd()-.5)*amp,y+(ey-y)*t+(rnd()-.5)*amp*.6]);}
    P.push([ex,ey]);const d=spline(P);
    s+=`<path d="${d}" stroke="#E9CF86" stroke-width="${f(w*5)}" opacity="${f(op*.10)}"/><path d="${d}" stroke="#F3DE9C" stroke-width="${f(w*2)}" opacity="${f(op*.22)}"/><path d="${d}" stroke="url(#v13)" stroke-width="${f(w)}" opacity="${f(op)}"/>`;
    if(dep<1)for(let k=0;k<nhanh;k++){const q=P[1+Math.floor(rnd()*(P.length-2))];
      vein(q[0],q[1],q[0]+(rnd()-.5)*320,q[1]+120+rnd()*180,4,70,Math.max(.6,w*.4),op*.8,0,1);}}
  vein(960,-20,360,830,6,150,2.4,.85,4,0);
  vein(1123,110,640,830,5,130,1.3,.6,3,0);
  vein(700,-20,-20,560,5,130,1.2,.55,3,0);
  vein(1123,470,880,820,4,80,1,.5,1,0);
  document.getElementById('van13').innerHTML=s;})();
</script>
<script src="chung/cc.js"></script></body></html>

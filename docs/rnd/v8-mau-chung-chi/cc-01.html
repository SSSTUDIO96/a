<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC-01 Xanh đêm dải vàng</title>
<link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 01 — học tinh thần ảnh tham khảo 1 (cột xanh đen, dải vàng chéo, huy hiệu tròn). Tự vẽ toàn bộ bằng CSS/SVG.
     Phông: tiêu đề MP Chữ đậm có chân (Playfair Display), tên MP Chữ ký 1 (Send Flowers), chữ thường MP Chữ có chân
     (Cormorant Garamond), chữ hoa nhỏ MP Chữ không chân (Montserrat). -->
<style>
.c1{--navy:#14212F;background:#FFFFFF}
.c1 .song{inset:0;background:
  linear-gradient(118deg,transparent 58%,rgba(201,169,97,.10) 58% 64%,transparent 64% 70%,rgba(201,169,97,.07) 70% 73%,transparent 73%),
  linear-gradient(180deg,#FFFFFF,#FBF8F2)}
.c1 .cot{left:0;top:0;width:262px;height:100%;background:var(--navy)}
.c1 .bd{left:0;right:0;height:22px;background:var(--navy)}
.c1 .bd.t{top:0}.c1 .bd.b{bottom:0}
.c1 .bd::after{content:"";position:absolute;left:262px;right:0;height:3px;background:var(--vang)}
.c1 .bd.t::after{bottom:-3px}.c1 .bd.b::after{top:-3px}
.c1 .vien{left:290px;top:44px;right:30px;bottom:44px;border:1px solid #C9A961}
.c1 .rb{left:-80px;top:0;width:372px;height:100%;pointer-events:none}
.c1 .anh{left:46px;top:70px;width:170px;height:170px;box-shadow:0 0 0 5px var(--navy),0 0 0 8px #C9A961,0 0 0 9px var(--navy),0 0 0 11px #E9CF86}
.c1 .huy{left:51px;top:452px;width:160px}
.c1 .o-logo{left:330px;top:62px;width:46px;height:46px}
.c1 .thg{left:388px;top:64px;font-family:var(--f-sans);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);line-height:46px}
.c1.khong-logo .thg{left:330px}
.c1 .so{right:62px;top:68px;text-align:right;color:#6A5A3E;line-height:1.7}
.c1 .t1{left:330px;top:128px;font-family:var(--f-chan2);font-weight:800;font-size:62px;letter-spacing:.04em;color:var(--navy);line-height:1}
.c1 .t2{left:333px;top:200px;font-size:19px;letter-spacing:.42em}
.c1 .tag{left:330px;top:252px;background:var(--navy);color:#fff;font-family:var(--f-sans);font-size:12px;letter-spacing:.22em;font-weight:600;text-transform:uppercase;padding:7px 14px}
.c1 .ten{left:318px;top:294px;width:740px;font-size:calc(78px * var(--ten-co));color:var(--navy)}
.c1 .gach{left:330px;top:404px;width:700px;height:2px;background:var(--vang)}
.c1 .dong{left:330px;top:424px;width:720px;font-size:25px;font-style:italic;font-weight:500;color:#2A2622}
.c1 .ky1{left:340px;top:560px;width:260px;color:var(--navy)}
.c1 .ky2{left:760px;top:560px;width:260px;color:var(--navy)}
.c1 .ngay{left:330px;top:474px;font-size:19px;color:#4A4038;font-style:italic}
</style></head>
<body class="xem"><main>
<section class="cc c1">
  <div class="song"></div>
  <div class="cot"></div>
  <svg class="rb" viewBox="0 0 372 794" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".35" stop-color="#E9CF86"/><stop offset=".6" stop-color="#B88A35"/><stop offset="1" stop-color="#F3DE9C"/></linearGradient></defs>
    <path d="M150 0 L250 0 L372 214 L372 300 Z" fill="url(#r1)"/>
    <path d="M250 0 L278 0 L372 166 L372 214 Z" fill="#7A5A1E" opacity=".55"/>
    <path d="M80 794 L190 794 L372 538 L372 470 Z" fill="url(#r1)" opacity=".9"/>
  </svg>
  <div class="bd t"></div><div class="bd b"></div>
  <div class="vien"></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#14212F" data-duoi="1" data-ruy="#B88A35"></div>
  <div class="o-logo"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="so meta">Số <b data-f="so"></b></div>
  <div class="t1" data-td>CHỨNG NHẬN</div>
  <div class="t2 caps" style="color:#7A5418">Tốt nghiệp</div>
  <div class="tag">Trân trọng trao cho</div>
  <div class="ten" data-f="ten" data-fitw></div>
  <div class="gach"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main><script src="chung/cc.js"></script></body></html>

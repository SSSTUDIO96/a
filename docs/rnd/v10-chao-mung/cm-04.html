<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng cm-04 – Thư giấy vân</title>
<!-- Makeup Pro · R&D-10 (19/10/2026) · kiểu (d) "Giấy vân tràn trang" của R&D-07 vòng 2: cả thẻ là một tờ giấy mỹ thuật vân thớ, viền vàng hai đường, góc có hoa văn.
     Bố cục "lá thư" căn lề trái: hàng đầu = logo + tên trung tâm (trái) và VÉ MÃ SỐ nền nâu có khuyết hai bên (phải); tên khoá chữ vàng;
     "Thân gửi" + TÊN chữ ký TO căn trái; lời chào bên trái, ảnh tròn nằm góc dưới bên phải trên hoa thị chìm.
     Ô dữ liệu: logo, th, anh (khung tròn), khoa, lop, ngay, ten, diachi + MÃ SỐ seatCode (đề xuất trường mới, lưu ở học viên-trong-lớp; chưa có trong database).
     Phông: MonteCarlo (chữ ký, OFL) · Cormorant Garamond · Playfair Display · Montserrat. Khổ 1080×1350, ?kho=vuong → 1080×1080. ?ma=12 đổi mã số. -->
<link rel="stylesheet" href="chung/phong.css"><link rel="stylesheet" href="chung/mau.css"><link rel="stylesheet" href="chung/cm.css">
<style>
:root{--chu:#2A2420;--phu:#5C4E3E;--nhan:#6B5535;--vien:#B8975A;--tay-co-1:1}
#c{background:#F5EFE3;color:var(--chu)}
.w{left:58px;top:58px;width:964px;height:1234px;padding:62px 82px 52px;align-items:stretch;text-align:left}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.lg{width:60px;height:60px}
.th{font:600 20px/1.35 var(--f-sans);letter-spacing:.28em;color:var(--nhan);text-transform:uppercase;min-width:0}
.seat{flex:none;gap:14px;padding:0 34px;height:96px;color:#FBF3E0;
 background:radial-gradient(circle at 0 50%,transparent 13px,#4A3A24 14px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 13px,#4A3A24 14px) right/51% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(60,40,10,.3))}
.seat-l{font:600 17px var(--f-sans);letter-spacing:.3em;color:#FBF3E0}
.seat-n{font:600 58px/1 var(--f-chan2);color:#FBF3E0}
.hl{height:1px;background:var(--vien);margin-top:30px;width:100%}
.k1{font:500 19px var(--f-sans);letter-spacing:.4em;color:var(--nhan);text-transform:uppercase;margin-top:38px}
.kh{font:600 64px/1.06 var(--f-chan);text-transform:uppercase;letter-spacing:.03em;margin-top:12px;text-align:left}
.lo{font:italic 400 31px var(--f-chan);color:var(--phu);margin-top:10px}
.dg{font:italic 400 34px var(--f-chan);color:var(--phu);margin-top:34px}
.ten{font-size:calc(126px*var(--tay-co-1));color:var(--chu);text-align:left;padding:0}
.bot{display:flex;align-items:flex-end;gap:26px;width:100%;margin-top:10px}
.bot .tx{flex:1;min-width:0}
.ld{font:italic 400 29px/1.45 var(--f-chan);color:var(--phu)}
.by{font:italic 500 29px var(--f-chan);color:var(--chu);margin-top:12px}
.av{width:376px;height:376px;box-shadow:0 0 0 8px #F5EFE3,0 0 0 10px var(--vien),0 0 0 16px #F5EFE3,0 0 0 17px rgba(184,151,90,.6);margin:0 8px 8px 0}
.ft{font:500 18px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--nhan);margin-top:20px}
.dc{font:400 26px var(--f-chan);color:var(--phu);margin-top:6px;max-width:100%;white-space:nowrap}
.vuong .w{height:964px;padding:46px 74px 40px}
.vuong .lg{width:48px;height:48px}.vuong .th{font-size:17px}.vuong .seat{height:80px;padding:0 28px}.vuong .seat-n{font-size:50px}
.vuong .hl{margin-top:20px}.vuong .k1{margin-top:22px;font-size:17px}.vuong .kh{font-size:50px;margin-top:8px}.vuong .lo{font-size:27px;margin-top:6px}
.vuong .dg{margin-top:18px;font-size:29px}.vuong .ten{font-size:calc(100px*var(--tay-co-1))}.vuong .av{width:240px;height:240px}
.vuong .ld{font-size:25px;line-height:1.4}.vuong .by{font-size:25px;margin-top:8px}.vuong .ft{font-size:16px;margin-top:12px}.vuong .dc{font-size:23px}
</style></head><body><div id="c"><div class="w">
<div class="hd"><div class="brand"><img class="lg" data-f="logo" alt=""><div class="th" data-f="th" data-do></div></div>
 <div class="seat"><span class="seat-l" data-do>SỐ</span><b class="seat-n" data-seat data-do></b></div></div>
<div class="hl"></div>
<div class="k1" data-do>Chào mừng đến với lớp</div>
<div class="kh vang" data-f="khoa" data-fit="2" data-do data-vang="#684010,#8E6116,#684010,#8E6116"></div>
<div class="lo" data-do>Lớp <span data-f="lop"></span> · khai giảng <span data-f="ngayCham"></span></div>
<div class="dg" data-do>Thân gửi</div>
<div class="ten" data-f="ten" data-fit="2" data-do></div>
<div class="sp"></div>
<div class="bot"><div class="tx"><div class="ld" data-do>Rất vui được đồng hành cùng em trên hành trình trở thành chuyên viên trang điểm. Hẹn gặp em ở lớp!</div><div class="by" data-do>Thân ái, <span data-f="th"></span></div>
 <div class="ft" data-f="thangNam" data-do></div><div class="dc" data-f="diachi" data-fitw data-do></div></div>
 <div class="av"><img data-f="anh" alt=""></div></div>
</div></div>
<script>window.MAC_DINH={ten:'Đặng Quỳnh Như'};</script>
<script src="chung/ve.js"></script><script src="chung/ve-moi.js"></script>
<script src="chung/mau.js"></script><script src="chung/cm.js"></script>
<script>(function(){const V=window.VE,vuong=new URLSearchParams(location.search).get('kho')==='vuong',W=1080,H=vuong?1080:1350;V.kho(W,H);
 const M='#B8975A';
 // góc: hai đường viền vàng + hoa văn góc (cung tròn đồng tâm + chấm)
 const goc=`<g stroke="${M}" fill="none"><path d="M0,70 A70,70 0 0 0 70,0" stroke-width="1.2"/><path d="M0,52 A52,52 0 0 0 52,0" stroke-width="1"/><path d="M0,34 A34,34 0 0 0 34,0" stroke-width=".9"/><circle cx="20" cy="20" r="3.6" fill="${M}" stroke="none"/></g>`;
 let corner='';[[44,44,1,1],[W-44,44,-1,1],[44,H-44,1,-1],[W-44,H-44,-1,-1]].forEach(([x,y,sx,sy])=>{corner+=`<g transform="translate(${x},${y}) scale(${sx},${sy})">${goc}</g>`;});
 VE_MOUNT(`<defs>${V.LOC}</defs><rect width="${W}" height="${H}" fill="${V.GIAY_MAU}"/><rect width="${W}" height="${H}" fill="#fff" filter="url(#van2)"/><rect width="${W}" height="${H}" fill="#fff" filter="url(#van)" opacity=".2"/>`+
   `<rect x="44" y="44" width="${W-88}" height="${H-88}" fill="none" stroke="${M}" stroke-width="1.6"/><rect x="58" y="58" width="${W-116}" height="${H-116}" fill="none" stroke="${M}" stroke-width=".8"/>`+corner);
 window.CM_SAU.push(()=>{const a=document.querySelector('.av').getBoundingClientRect(),c=document.getElementById('c').getBoundingClientRect();
  const cx=a.left-c.left+a.width/2,cy=a.top-c.top+a.height/2,R=a.width*.5+(vuong?40:56);
  VE_MOUNT(`<g opacity=".75">${V.hoaThi(cx,cy,R,'#B39A68')}</g>`,true);});})();</script>
<script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

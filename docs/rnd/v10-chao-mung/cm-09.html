<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng cm-09 – Thiệp gập ruy băng</title>
<!-- Makeup Pro · R&D-10 (19/10/2026) · KIỂU MỚI 2 (cùng tinh thần R&D-07): THIỆP GẬP ĐÔI CÓ RUY BĂNG.
     Chất liệu: tờ thiệp giấy kem vân thớ gập ngang giữa (nếp gấp có đổ bóng), viền nổi hai lớp, đặt trên nền hoa lá nét khắc đỏ rượu ĐẬM; dải ruy băng satin đỏ rượu
     thắt nơ ngay nếp gấp, CHỮ VÀNG "Chào mừng đến với lớp" chạy trên ruy băng. Nửa trên: logo + tên trung tâm + ảnh tròn; nửa dưới: tên khoá, "Thân gửi", TÊN chữ ký TO.
     MÃ SỐ là THẺ TREO KRAFT buộc dây đỏ rượu ở góc trên bên phải thiệp (số đỏ rượu đậm trên kraft, nghiêng 6°).
     Ô dữ liệu: logo, th, anh (khung tròn), khoa, lop, ngay, ten, diachi + MÃ SỐ seatCode (đề xuất trường mới, lưu ở học viên-trong-lớp; chưa có trong database).
     Phông: MonteCarlo (chữ ký, OFL) · Cormorant Garamond · Playfair Display · Montserrat. Khổ 1080×1350, ?kho=vuong → 1080×1080. ?ma=12 đổi mã số. -->
<link rel="stylesheet" href="chung/phong.css"><link rel="stylesheet" href="chung/mau.css"><link rel="stylesheet" href="chung/cm.css">
<style>
:root{--chu:#2A2420;--phu:#5C4E3E;--nhan:#6B5535;--vien:#B8975A;--tay-co-1:1}
#c{background:#3A1620;color:var(--chu)}
.w{left:100px;top:74px;width:880px;height:1204px;padding:70px 50px 0}
.top{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.lg{width:54px;height:54px}
.th{font:600 20px var(--f-sans);letter-spacing:.28em;color:var(--nhan);text-transform:uppercase;min-width:0}
.av{width:262px;height:262px;margin-top:26px;box-shadow:0 0 0 8px #F5EFE3,0 0 0 10px var(--vien),0 0 0 16px #F5EFE3,0 0 0 17px rgba(184,151,90,.6)}
.rb{width:100%;height:68px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;margin-top:70px;flex:none}
.rb .k1{width:470px;font:600 20px var(--f-sans);letter-spacing:.34em;text-transform:uppercase}
.kh{font:600 58px/1.07 var(--f-chan);text-transform:uppercase;letter-spacing:.04em;margin-top:84px}
.lo{font:italic 400 30px var(--f-chan);color:var(--phu);margin-top:8px}
.dg{font:italic 400 34px var(--f-chan);color:var(--phu)}
.ten{font-size:calc(108px*var(--tay-co-1));color:var(--chu)}
.by{font:italic 400 28px var(--f-chan);color:var(--phu);margin-top:4px}
.ft{font:500 18px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--nhan)}
.dc{font:400 26px var(--f-chan);color:var(--phu);margin-top:6px;max-width:100%;white-space:nowrap}
.seat{position:absolute;right:54px;top:70px;width:150px;height:190px;flex-direction:column;justify-content:flex-end;padding-bottom:20px;transform:rotate(6deg);filter:drop-shadow(2px 4px 4px rgba(50,25,10,.4))}
.seat::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#E4C58B,#D2AE6F);clip-path:polygon(24% 0,76% 0,100% 15%,100% 100%,0 100%,0 15%)}
.seat::after{content:"";position:absolute;left:50%;top:22px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#3A1620;box-shadow:0 0 0 3px #B58E55}
.seat>*{position:relative}
.seat .str{position:absolute;left:50%;top:30px;width:90px;height:140px;margin-left:-8px;overflow:visible;transform:translateY(-130px)}
.seat-l{font:700 17px var(--f-sans);letter-spacing:.32em;text-indent:.32em;color:#3A1620}
.seat-n{font:600 74px/1 var(--f-chan2);color:#3A1620;margin-top:4px}
.vuong .w{left:100px;top:50px;width:880px;height:980px;padding:52px 50px 0}
.vuong .lg{width:44px;height:44px}.vuong .th{font-size:18px}.vuong .av{width:168px;height:168px;margin-top:14px}.vuong .rb{margin-top:46px;height:60px}.vuong .rb .k1{font-size:18px}
.vuong .kh{font-size:44px;margin-top:76px}.vuong .lo{font-size:26px;margin-top:4px}.vuong .dg{font-size:27px}.vuong .ten{font-size:calc(88px*var(--tay-co-1))}.vuong .by{font-size:23px}.vuong .dc{font-size:23px}.vuong .ft{font-size:16px}
.vuong .seat{width:118px;height:150px;top:46px;right:48px;padding-bottom:14px}.vuong .seat-n{font-size:56px}.vuong .seat-l{font-size:14px}
</style></head><body><div id="c"><div class="w">
<div class="top"><img class="lg" data-f="logo" alt=""><div class="th" data-f="th" data-fitw data-do></div></div>
<div class="av"><img data-f="anh" alt=""></div>
<div class="rb"><div class="k1 vang" data-do data-vang="#FBE9AE,#FFF6D2,#FBE9AE,#FFF6D2,#FBE9AE">Chào mừng đến với lớp</div></div>
<div class="kh vang" data-f="khoa" data-fit="2" data-do data-vang="#684010,#8E6116,#684010,#8E6116"></div>
<div class="lo" data-do>Lớp <span data-f="lop"></span> · khai giảng <span data-f="ngayCham"></span></div>
<div class="sp" style="flex:.5 1 0;min-height:10px"></div>
<div class="dg" data-do>Thân gửi</div>
<div class="ten" data-f="ten" data-fit="2" data-do></div>
<div class="by" data-do>Thân ái, <span data-f="th"></span></div>
<div class="sp"></div>
<div class="ft" data-f="thangNam" data-do></div><div class="dc" data-f="diachi" data-fitw data-do style="margin-bottom:44px"></div>
<div class="seat"><svg class="str" viewBox="0 0 90 140"><path d="M8,136 C6,100 40,70 52,0" fill="none" stroke="#B3445E" stroke-width="3.2" stroke-linecap="round"/></svg><span class="seat-l" data-do>SỐ</span><b class="seat-n" data-seat data-do></b></div>
</div></div>
<script>window.MAC_DINH={ten:'Đặng Quỳnh Như'};</script>

<script>(function(){const V=window.VE,vuong=new URLSearchParams(location.search).get('kho')==='vuong';V.kho(1080,vuong?1080:1350);
 const b=vuong?{x:100,y:50,w:880,h:980}:{x:100,y:74,w:880,h:1204};const [m,n]=V.NEN_MAU['ruou'];
 VE_MOUNT(V.veKhac(m,n));
 window.CM_SAU.push(()=>{const c=document.getElementById('c').getBoundingClientRect();const r=document.querySelector('.rb').getBoundingClientRect();
  const y=r.top-c.top+r.height/2,h=r.height,vien='#F0D58E';
  VE_MOUNT(`<defs>${V.LOC}</defs>`+V.thiepGap(b,y,'#B8975A')+V.DEF_RUY('#7A1D36','#9C2C4A','#4A101B')+V.dai(b.x-26,b.x+b.w+26,y,h,vien)+V.no(b.x+176,y,vuong?.46:.52,vien),true);});})();</script>

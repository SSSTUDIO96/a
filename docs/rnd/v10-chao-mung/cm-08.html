<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng cm-08 – Giấy xé washi</title>
<!-- Makeup Pro · R&D-10 (19/10/2026) · KIỂU MỚI 1 (cùng tinh thần R&D-07): GIẤY XÉ MÉP + BĂNG DÍNH WASHI, như trang sổ lưu niệm dán tay.
     Chất liệu: tờ giấy kem vân thớ xé mép (viền xơ trắng, nghiêng nhẹ −1,4°) trên nền hoa lá nét khắc hồng đất; băng dính washi sọc xanh lá / chấm hồng / vàng nghệ
     do R&D tự vẽ bằng SVG; ảnh học viên là hình tròn có viền trắng dày như miếng dán, hai mẩu washi dán ở mép viền.
     MÃ SỐ là một MẨU WASHI VÀNG NGHỆ có chữ, dán chéo ở góc trên bên phải tờ giấy (số nâu đậm trên vàng, rất dễ đọc từ xa).
     Ô dữ liệu: logo, th, anh (khung tròn), khoa, lop, ngay, ten, diachi + MÃ SỐ seatCode (đề xuất trường mới, lưu ở học viên-trong-lớp; chưa có trong database).
     Phông: Ephesis (chữ ký, OFL) · Cormorant Garamond · Playfair Display · Montserrat. Khổ 1080×1350, ?kho=vuong → 1080×1080. ?ma=12 đổi mã số. -->
<link rel="stylesheet" href="chung/phong.css"><link rel="stylesheet" href="chung/mau.css"><link rel="stylesheet" href="chung/cm.css">
<style>
:root{--chu:#2A2420;--phu:#5C4E3E;--nhan:#6B5535;--vien:#B8975A;--f-tay-1:var(--f-tay-2);--tay-co-1:1;--rot:-1.4deg}
#c{background:#F7E7E3;color:var(--chu)}
.w{left:130px;top:130px;width:820px;height:1090px;padding:100px 50px 40px;transform:rotate(var(--rot))}
.top{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.lg{width:56px;height:56px}
.th{font:600 20px var(--f-sans);letter-spacing:.28em;color:var(--nhan);text-transform:uppercase;min-width:0}
.av{width:268px;height:268px;border:12px solid #FFFDF6;box-shadow:0 5px 14px rgba(70,40,20,.28),0 0 0 1px rgba(184,151,90,.5)}
.av img{object-position:50% 36%}
.k1{font:500 19px var(--f-sans);letter-spacing:.4em;color:var(--nhan);text-transform:uppercase}
.kh{font:600 58px/1.07 var(--f-chan);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.lo{font:italic 400 30px var(--f-chan);color:var(--phu);margin-top:8px}
.dg{font:italic 400 34px var(--f-chan);color:var(--phu)}
.ten{font-size:calc(100px*var(--tay-co-1));color:var(--chu)}
.hl{width:300px;height:0;border-top:2px dashed #B8975A;margin:6px 0 0}
.by{font:italic 400 28px var(--f-chan);color:var(--phu);margin-top:12px}
.ft{font:500 18px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--nhan)}
.dc{font:400 26px var(--f-chan);color:var(--phu);margin-top:6px;max-width:100%;white-space:nowrap}
.seat{position:absolute;right:-6px;top:20px;width:196px;height:92px;gap:14px;transform:rotate(7deg);filter:drop-shadow(1px 3px 3px rgba(60,40,10,.35))}
.seat::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 15px,rgba(255,255,255,.2) 15px 17px),#EBB945;
 clip-path:polygon(0 0,100% 0,calc(100% - 8px) 12.5%,100% 25%,calc(100% - 8px) 37.5%,100% 50%,calc(100% - 8px) 62.5%,100% 75%,calc(100% - 8px) 87.5%,100% 100%,0 100%,8px 87.5%,0 75%,8px 62.5%,0 50%,8px 37.5%,0 25%,8px 12.5%)}
.seat>*{position:relative}
.seat-l{font:700 17px var(--f-sans);letter-spacing:.3em;color:#3A2410}
.seat-n{font:600 62px/1 var(--f-chan2);color:#3A2410}
.vuong .w{left:110px;top:80px;width:860px;height:920px;padding:84px 50px 44px}
.vuong .lg{width:46px;height:46px}.vuong .th{font-size:18px}.vuong .av{width:190px;height:190px;border-width:9px}.vuong .k1{font-size:16px}.vuong .kh{font-size:44px;margin-top:6px}
.vuong .lo{font-size:26px;margin-top:4px}.vuong .dg{font-size:28px}.vuong .ten{font-size:calc(88px*var(--tay-co-1))}.vuong .by{font-size:24px;margin-top:6px}.vuong .dc{font-size:23px}.vuong .ft{font-size:16px}
.vuong .seat{width:170px;height:80px;top:12px}.vuong .seat-n{font-size:52px}
</style></head><body><div id="c"><div class="w">
<div class="top"><img class="lg" data-f="logo" alt=""><div class="th" data-f="th" data-fitw data-do></div></div>
<div class="sp" style="flex:.4 1 0;min-height:16px"></div>
<div class="av"><img data-f="anh" alt=""></div>
<div class="sp" style="flex:.5 1 0;min-height:30px"></div>
<div class="k1" data-do>Chào mừng đến với lớp</div>
<div class="kh vang" data-f="khoa" data-fit="2" data-do data-vang="#684010,#8E6116,#684010,#8E6116"></div>
<div class="lo" data-do>Lớp <span data-f="lop"></span> · khai giảng <span data-f="ngayCham"></span></div>
<div class="sp" style="flex:.4 1 0;min-height:10px"></div>
<div class="dg" data-do>Thân gửi</div>
<div class="ten" data-f="ten" data-fit="2" data-do></div>
<div class="hl"></div>
<div class="by" data-do>Thân ái, <span data-f="th"></span></div>
<div class="sp"></div>
<div class="ft" data-f="thangNam" data-do></div><div class="dc" data-f="diachi" data-fitw data-do></div>
<div class="seat"><span class="seat-l" data-do>SỐ</span><b class="seat-n" data-seat data-do></b></div>
</div></div>
<script>window.MAC_DINH={ten:'Đặng Quỳnh Như'};</script>
<script src="chung/ve.js"></script><script src="chung/ve-moi.js"></script>
<script src="chung/mau.js"></script><script src="chung/cm.js"></script>
<script>(function(){const V=window.VE,vuong=new URLSearchParams(location.search).get('kho')==='vuong';V.kho(1080,vuong?1080:1350);
 const b=vuong?{x:110,y:80,w:860,h:920}:{x:130,y:130,w:820,h:1090};const [m,n]=V.NEN_MAU['hong'];const rot=-1.4;
 VE_MOUNT(V.veKhac(m,n)+`<defs>${V.LOC}</defs>`+V.giayXe(b,9,'tpdl',rot)+
   V.washi(b.x+70,b.y+14,190,50,-38,'soc','#A9C49E','#F3F0E2')+V.washi(b.x+b.w-50,b.y+b.h-8,200,50,-35,'cham','#E8A0B2','#FFF6F0'));
 // hai mẩu washi dán ở mép viền ảnh (ở phía ngoài ảnh, chỉ chạm viền trắng)
 window.CM_SAU.push(()=>{const c=document.getElementById('c').getBoundingClientRect();const a=document.querySelector('.av').getBoundingClientRect();
  const cx=a.left-c.left+a.width/2,cy=a.top-c.top+a.height/2,R=a.width/2+(vuong?4:6);let s='';
  [[-132,'hoa','#CFE0C8','#7FA374'],[-48,'cham','#F2C14E','#FFF6DD']].forEach(([ag,k,c1,c2],i)=>{const t=ag*Math.PI/180;s+=V.washi(cx+Math.cos(t)*(R+8),cy+Math.sin(t)*(R+8),vuong?78:100,vuong?30:38,ag+90+(i?8:-8),k,c1,c2);});
  VE_MOUNT(s,true);});})();</script>
<script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

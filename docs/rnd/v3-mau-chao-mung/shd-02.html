<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-02 – Đen vàng vòm cửa</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), anh (Ảnh học viên), ten (Tên học viên), khoa (Tên khoá), lop (Mã lớp), ngay (Ngày khai giảng)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#131212;color:#F3EBDD}
.fr{position:absolute;inset:36px;border:1px solid #C9A961}
.w{position:absolute;inset:36px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 80px 52px}
.top{display:flex;align-items:center;gap:16px}
.ld{width:64px;height:64px;border-radius:50%;background:#F3EBDD;display:grid;place-items:center}.ld img{width:52px;height:52px}
.th{font:500 20px var(--f-sans);letter-spacing:.3em;color:#C9A961;text-transform:uppercase}
.ar{width:480px;height:560px;border-radius:240px 240px 0 0;overflow:hidden;outline:1px solid #C9A961;outline-offset:14px;margin-top:62px;flex:none}
.hw{font-family:var(--f-tay-1);font-size:calc(112px*var(--tay-co-1));color:#C9A961;line-height:1;margin-top:40px}
.ten{font:600 54px/1.12 var(--f-chan);text-transform:uppercase;letter-spacing:.06em;width:100%;margin-top:14px}
.kh{font:500 21px var(--f-sans);letter-spacing:.28em;color:#C9A961;text-transform:uppercase;margin-top:20px;width:100%}
.ft{font:400 18px var(--f-sans);letter-spacing:.24em;color:#A59C8E;text-transform:uppercase}
.vuong .ar{width:330px;height:360px;margin-top:40px}.vuong .hw{margin-top:22px;font-size:calc(92px*var(--tay-co-1))}.vuong .ten{font-size:46px}.vuong .w{padding:40px 80px 36px}
</style></head><body><div id="c"><div class="fr"></div><div class="w">
<div class="top"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div>
<div class="ar"><img class="ph" data-f="anh" alt=""></div>
<div class="hw">Chào mừng</div>
<div class="ten" data-f="ten" data-fit="2"></div>
<div class="kh" data-fitw style="white-space:nowrap"><span data-f="khoa"></span> · Lớp <span data-f="lop"></span></div>
<div class="sp"></div>
<div class="ft">Khai giảng <span data-f="ngayCham"></span></div>
</div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script></body></html>

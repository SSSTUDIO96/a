<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-03 – Ngày khai giảng lớn</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại
     Nguồn ý tưởng: Học từ ảnh 1 (ngày lớn, ảnh tròn, mã QR, website ở chân)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), ngay (Ngày khai giảng), anh (Ảnh học viên), ten (Tên học viên), khoa (Tên khoá), lop (Mã lớp), diachi (Địa chỉ), web (Website)
     Phông: MP Viết tay 3, MP Chữ đậm có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#FBF8F4;color:#241E1C}
.w{position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 80px 64px}
.top{display:flex;align-items:center;gap:14px}.top img{width:58px;height:58px}
.th{font:600 20px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#8A2E45}
.mid{display:flex;align-items:center;justify-content:space-between;margin-top:56px}
.dt .l{font:600 18px var(--f-sans);letter-spacing:.34em;color:#8C7F78;text-transform:uppercase}
.dt .d{font:900 250px/0.9 var(--f-chan2);color:#8A2E45;margin-top:14px}
.dt .m{font:600 34px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;margin-top:10px}
.dt .y{font:300 34px var(--f-sans);letter-spacing:.3em;color:#8C7F78}
.cir{width:440px;height:440px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 10px #FBF8F4,0 0 0 11.5px #8A2E45;flex:none}
.hw{font-family:var(--f-tay-3);font-size:calc(92px*var(--tay-co-3));color:#8A2E45;line-height:1;margin-top:60px}
.ten{font:700 66px/1.1 var(--f-chan2);margin-top:6px}
.kh{font:600 22px var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:#5E524D;margin-top:18px}
.ft{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;border-top:1px solid #E3D8CF;padding-top:26px}
.ft .t{font:400 22px/1.5 var(--f-sans);color:#5E524D}.ft .t b{font-weight:600;color:#241E1C}
.qr{width:132px;height:132px;color:#241E1C;flex:none}
.vuong .w{padding:52px 72px 46px}.vuong .mid{margin-top:26px}.vuong .dt .d{font-size:180px}.vuong .cir{width:330px;height:330px}.vuong .hw{margin-top:22px;font-size:calc(76px*var(--tay-co-3))}.vuong .ten{font-size:54px}.vuong .qr{width:112px;height:112px}
</style></head><body><div id="c"><div class="w">
<div class="top"><img data-f="logo" alt=""><span class="th" data-f="th"></span></div>
<div class="mid"><div class="dt"><div class="l">Khai giảng</div><div class="d" data-f="ngayD"></div><div class="m" data-f="thangSo"></div><div class="y" data-f="nam"></div></div>
<div class="cir"><img class="ph" data-f="anh" alt=""></div></div>
<div class="hw">Chào mừng</div>
<div class="ten" data-f="ten" data-fit="2"></div>
<div class="kh" data-fitw style="white-space:nowrap"><span data-f="khoa"></span> — Lớp <span data-f="lop"></span></div>
<div class="sp"></div>
<div class="ft"><div class="t"><b data-f="web"></b><br><span data-f="diachi"></span></div><div class="qr" data-qr="web"></div></div>
</div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script></body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Mẫu feedback fb-01 – Tin nhắn và ảnh polaroid</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu feedback
     Nguồn ý tưởng: Học từ ảnh 2 (bong bóng tin nhắn, polaroid nghiêng, chữ viết tay cảm ơn)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), nd (Nội dung lời khen), a1 (Ảnh 1), kh (Tên khách/học viên), dv (Khoá học hoặc dịch vụ)
     Phông: MP Viết tay 3, MP Chữ không chân — khai báo ở ../v3-mau-chao-mung/phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="../v3-mau-chao-mung/phong/phong.css"><link rel="stylesheet" href="../v3-mau-chao-mung/chung/mau.css">
<style>
#c{background:#F7E8E4;color:#2E2224;background-image:radial-gradient(#EBCFC8 2px,transparent 2px);background-size:36px 36px}
.w{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 70px 58px}
.top{display:flex;align-items:center;gap:14px}.top img{width:56px;height:56px}
.th{font:600 19px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#8A2E45}
.k1{font:600 18px var(--f-sans);letter-spacing:.36em;text-transform:uppercase;color:#9C7C80;margin-top:40px}
.row{display:flex;gap:40px;margin-top:22px;flex:1 1 0;min-height:0}
.chat{flex:1;min-width:0;overflow:hidden;font-family:var(--f-sans)}
.chat .bb{background:#fff;border-bottom-left-radius:8px;color:#2E2224}
.chat .bb:nth-child(2){background:#8A2E45;color:#fff;border-bottom-left-radius:30px;border-bottom-right-radius:8px;align-self:flex-end}
.pol{width:400px;flex:none;align-self:flex-start;background:#fff;padding:20px 20px 0;transform:rotate(4deg);margin-top:30px;box-shadow:0 18px 30px rgba(60,30,30,.12)}
.pol .p{height:440px;overflow:hidden}
.pol .c{font-family:var(--f-tay-3);font-size:calc(58px*var(--tay-co-3));text-align:center;color:#8A2E45;padding:16px 0 22px;line-height:1}
.ft{display:flex;align-items:baseline;gap:14px;border-top:1px solid #E6C9C2;padding-top:24px;margin-top:20px}
.ft b{font:700 30px var(--f-sans)}.ft span{font:500 22px var(--f-sans);color:#7A6366}
.vuong .pol{width:330px}.vuong .pol .p{height:330px}.vuong .k1{margin-top:28px}
.row .chat{justify-content:center}
</style></head><body><div id="c"><div class="w"><div class="top"><img data-f="logo" alt=""><span class="th" data-f="th"></span></div>
<div class="k1">Học viên nhắn cho lớp</div>
<div class="row"><div class="chat" data-chat="3" data-fitc="38"></div>
<div class="pol"><div class="p"><img class="ph" data-f="a1" alt=""></div><div class="c">Cảm ơn nhiều!</div></div></div>
<div class="ft"><b data-f="kh"></b><span data-f="dv"></span></div></div></div>
<script>window.MAC_DINH={};</script>
<script src="../v3-mau-chao-mung/chung/qrcode.js"></script><script src="../v3-mau-chao-mung/chung/mau.js"></script></body></html>

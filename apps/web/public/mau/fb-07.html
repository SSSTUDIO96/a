<!-- Makeup Pro · R&D vòng 3 · Mẫu feedback · Dùng cho: cả hợp đồng khoá học và dịch vụ (?loai=khoa|dv)
     Nguồn ý tưởng: Học từ ảnh 2 (nội dung dạng tin nhắn) — biến thể khung điện thoại
     Ô dữ liệu: a1 (Ảnh 1), kh (Tên khách/học viên), nd (Nội dung lời khen), nfb (Ngày nhận lời khen), dv (Khoá học hoặc dịch vụ), logo (Logo), th (Tên thương hiệu)
     Phông: MP Viết tay 1, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#EDE6E1;color:#2B2324}
.ph0{position:absolute;left:70px;top:90px;bottom:90px;width:540px;background:#1E1A1B;border-radius:56px;padding:18px}
.sc{width:100%;height:100%;background:#F7F3F1;border-radius:42px;display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:14px;padding:46px 26px 18px;background:#fff;border-bottom:1px solid #EEE6E2}
.hd .a{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none}.hd b{font:700 24px var(--f-sans);display:block}.hd span{font:500 17px var(--f-sans);color:#7C7271}
.chat{padding:24px 20px;flex:1;min-height:0;overflow:hidden;font-family:var(--f-sans)}
.chat .bb{background:#fff;border:1px solid #ECE3DF;border-radius:24px;border-bottom-left-radius:6px}
.rt{position:absolute;left:650px;right:60px;top:90px;bottom:90px;display:flex;flex-direction:column}
.rt img.lg{width:64px;height:64px}
.th{font:600 17px var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:#8A2E45;margin-top:14px}
.hw{font-family:var(--f-tay-1);font-size:calc(104px*var(--tay-co-1));line-height:1.12;color:#8A2E45;margin-top:auto}
.dv{font:500 20px/1.4 var(--f-sans);color:#6E6264;margin-top:20px}

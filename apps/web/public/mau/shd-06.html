<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-06 – Xanh rêu khung lệch</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại · Dùng cho: hợp đồng khoá học
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), anh (Ảnh học viên), ten (Tên học viên), khoa (Tên khoá), lop (Mã lớp), ngay (Ngày khai giảng), lich (Lịch học)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#1F3A33;color:#EFE7DA}
.w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 80px 58px}
.top{display:flex;align-items:center;gap:16px}
.ld{width:60px;height:60px;border-radius:50%;background:#EFE7DA;display:grid;place-items:center}.ld img{width:48px;height:48px}
.th{font:500 19px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:#C9B99A}
.fw{position:relative;width:580px;height:580px;margin-top:56px;flex:none}
.fw .o{position:absolute;inset:0;transform:translate(22px,22px);border:1.5px solid #C9B99A;border-radius:50%}
.fw .p{position:absolute;inset:0;overflow:hidden;border-radius:50%}
.hw{font-family:var(--f-tay-1);font-size:calc(104px*var(--tay-co-1));line-height:1;color:#EFE7DA;margin-top:60px}
.ten{font:600 62px/1.12 var(--f-chan);width:100%;margin-top:8px}
.kh{font:500 20px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#C9B99A;margin-top:18px}
.ft{display:flex;gap:18px;align-items:center;font:400 22px var(--f-chan);font-style:italic;color:#D7CDBD}
.ft i{width:6px;height:6px;border-radius:50%;background:#C9B99A}
.vuong .fw{width:350px;height:350px;margin-top:36px}.vuong .hw{margin-top:40px;font-size:calc(86px*var(--tay-co-1))}.vuong .w{padding:44px 80px 40px}.vuong .ten{font-size:46px}
</style></head><body><div id="c"><div class="w"><div class="top"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div>
<div class="fw"><div class="o"></div><div class="p"><img class="ph" data-f="anh" alt=""></div></div>
<div class="hw">Chào mừng</div><div class="ten" data-f="ten" data-fit="2"></div>
<div class="kh"><span data-f="khoa"></span> · Lớp <span data-f="lop"></span></div>
<div class="sp"></div>
<div class="ft"><span>Khai giảng <span data-f="ngayCham"></span></span><i></i><span data-f="lich"></span></div></div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

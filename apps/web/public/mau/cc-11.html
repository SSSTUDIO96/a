<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1123">
<title>Giấy chứng nhận cc-11 – Xanh hoàng gia tia sáng</title>
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 11 — mẫu thêm (ý riêng): xanh navy hoàng gia, TIA SÁNG vàng toả từ huy hiệu ở chính giữa mép trên (huy hiệu đè lên khung),
     khung vàng hai lớp góc cắt vát, bố cục đối xứng. Tiêu đề và tên vàng nổi khối 3D.
     Ô ảnh học viên (tròn, nhỏ ~26 mm): góc TRÊN TRÁI; logo + tên trung tâm góc TRÊN PHẢI (đối xứng). ?anh=an để ẩn. -->
<style>
.c11{--f-ten:var(--f-ky-1);--ten-co:var(--ky-co-1);background:#0A1A33;color:#EDE6DA}
.c11 .nen{inset:0}
.c11 .huy{left:471px;top:12px;width:180px}
.c11 .anh{left:96px;top:78px;width:104px;height:104px;box-shadow:0 0 0 3px #0E2142,0 0 0 5px #C9A961,0 0 0 8px #0E2142,0 0 0 9px #8A6420}
.c11 .o-logo{left:953px;top:72px;width:44px;height:44px}
.c11 .thg{left:875px;width:200px;top:126px;text-align:center;font-size:9.5px;color:#CDBF9F;white-space:normal;line-height:1.35}
.c11 .t1{left:211px;top:200px;width:700px;height:62px}
.c11 .t2{left:0;width:1123px;top:272px;text-align:center;font-family:var(--f-sans);font-weight:500;font-size:14px;letter-spacing:.4em;text-transform:uppercase;color:#D8C58E}
.c11 .tag{left:0;width:1123px;top:302px;text-align:center;color:#EDE6DA;font-size:11.5px;letter-spacing:.34em}
.c11 .ten{left:161px;top:318px;width:800px;height:152px;font-size:calc(118px * var(--ten-co))}
.c11 .dong{left:0;width:1123px;top:482px;text-align:center;color:#EDE6DA}
.c11 .ngay{left:0;width:1123px;top:518px;text-align:center;color:#BFB29A}
.c11 .ky1{left:190px;top:574px;width:240px;color:#EDE6DA}
.c11 .ky2{left:693px;top:574px;width:240px;color:#EDE6DA}
.c11 .so{left:0;width:1123px;top:712px;text-align:center;color:#A99C84}
</style></head>
<body class="xem"><main>
<section class="cc c11">
  <svg class="nen" viewBox="0 0 1123 794" aria-hidden="true" id="nen11">
    <defs>
      <radialGradient id="rg11" cx="561" cy="110" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E437C"/><stop offset=".55" stop-color="#10264A"/><stop offset="1" stop-color="#07122A"/></radialGradient>
      <linearGradient id="v11" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#E9CF86"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#F3DE9C"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
    </defs>
    <rect width="1123" height="794" fill="url(#rg11)"/>
    <g id="tia11"></g>
    <path d="M76 28 H1047 L1095 76 V718 L1047 766 H76 L28 718 V76Z" fill="none" stroke="url(#v11)" stroke-width="2.2"/>
    <path d="M82 42 H1041 L1081 82 V712 L1041 752 H82 L42 712 V82Z" fill="none" stroke="url(#v11)" stroke-width=".9"/>
    <g fill="url(#v11)"><path d="M28 397 l9 -12 9 12 -9 12z M1077 397 l9 -12 9 12 -9 12z M552 766 l9 -12 9 12 -9 12z"/>
      <path d="M52 76 l6 -8 6 8 -6 8z M1059 76 l6 -8 6 8 -6 8z M52 718 l6 -8 6 8 -6 8z M1059 718 l6 -8 6 8 -6 8z"/></g>
    <circle cx="561" cy="102" r="98" fill="#12294D"/>
    <circle cx="561" cy="102" r="98" fill="none" stroke="url(#v11)" stroke-width="1.5"/>
  </svg>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#0A1730"></div>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="o-logo de-sang"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="tt sv t1" data-gold="noi" data-al="center" data-max="54">Giấy chứng nhận</div>
  <div class="t2">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten sv" data-f="ten" data-gold="bong" data-al="center" data-line="1" data-line-inset="130" data-line-h="1.4"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv" data-f="gdcv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
  <div class="so meta"><span class="nh">Số </span><b data-f="so"></b><i class="lai" data-f="lai"></i></div>
</section>
</main>
<script>
// Tia sáng toả từ tâm huy hiệu (561,102)
(function(){let s='';const cx=561,cy=102,R=1100,n=40;
  for(let i=0;i<n;i++){const a0=i*2*Math.PI/n,a1=a0+Math.PI/n*0.62;
    s+=`<path d="M${cx} ${cy} L${(cx+R*Math.cos(a0)).toFixed(0)} ${(cy+R*Math.sin(a0)).toFixed(0)} L${(cx+R*Math.cos(a1)).toFixed(0)} ${(cy+R*Math.sin(a1)).toFixed(0)}Z" fill="#E9CF86" opacity="${i%2?.05:.08}"/>`;}
  document.getElementById('tia11').innerHTML=s;})();
</script>
<script src="chung/html-to-image.js"></script><script src="chung/cc.js"></script><script src="chung/cc-xuat.js"></script></body></html>

<!-- Makeup Pro · R&D vòng 3 · Mẫu feedback · Dùng cho: cả hợp đồng khoá học và dịch vụ (?loai=khoa|dv)
     Nguồn ý tưởng: Học từ ảnh 3–4 (thẻ nổi đè lên ảnh khách, sao đánh giá)
     Ô dữ liệu: a1 (Ảnh 1), sao (Số sao), nd (Nội dung lời khen), kh (Tên khách/học viên), dv (Khoá học hoặc dịch vụ), logo (Logo), th (Tên thương hiệu)
     Phông: MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->

<style>
#c{background:#F4EFEA;color:#211C1B}
.pt{position:absolute;left:0;right:0;top:0;height:640px;overflow:hidden;background:#E9DED5}
/* Ảnh khung tròn giữa dải đầu (trước đây ảnh tràn hết dải) — khung mặc định tròn, 19/10/2026. */
.av{position:absolute;left:50%;top:44px;width:430px;height:430px;margin-left:-215px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 10px #F4EFEA}
.cd{position:absolute;left:64px;right:64px;top:520px;bottom:130px;background:#fff;border-radius:26px;box-shadow:0 26px 50px rgba(50,30,20,.12);padding:50px 60px 44px;display:flex;flex-direction:column}
.sao{color:#D9A441}
.nd{font:italic 500 42px/1.4 var(--f-chan);margin-top:20px;flex:1 1 0;min-height:0;overflow:hidden}
.pr{border-top:1px solid #EEE6DF;padding-top:22px}.pr b{font:700 28px var(--f-sans)}.pr span{font:500 22px var(--f-sans);color:#7C7370;margin-left:12px}

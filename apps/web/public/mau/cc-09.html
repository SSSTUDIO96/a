<script>
// Vòng nguyệt quế lớn ôm huy hiệu (tâm 270,350): hai nhành từ dưới vòng lên trên, lá to dần rồi nhỏ lại.
(function(){const cx=270,cy=350,R=152;let s='';
  for(const h of [1,-1]){const a0=h>0?115:65,a1=h>0?250:-70;const n=18;
    for(let i=0;i<n;i++){const t=i/(n-1),a=(a0+(a1-a0)*t)*Math.PI/180;const L=23-10*t,W=8.8-3.6*t;
      for(const [dr,l] of [[-11,-38],[11,38]]){const x=cx+(R+dr)*Math.cos(a),y=cy+(R+dr)*Math.sin(a);
        const rot=(a*180/Math.PI)+(h>0?180:0)+(h>0?l:-l);
        s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${W.toFixed(1)}" ry="${L.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="url(#v9)"/>`;}
      if(i%4===2){const x=cx+(R+25)*Math.cos(a),y=cy+(R+25)*Math.sin(a);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#8A6420"/>`;}}
    const p=(g)=>[(cx+R*Math.cos(g*Math.PI/180)).toFixed(1),(cy+R*Math.sin(g*Math.PI/180)).toFixed(1)].join(' ');
    s+=`<path d="M${p(a0)} A${R} ${R} 0 0 ${h>0?1:0} ${p(a1)}" fill="none" stroke="url(#v9)" stroke-width="2.4"/>`;}
  document.getElementById('vq9').innerHTML=s;})();
</script>
<script src="chung/html-to-image.js"></script><script src="chung/cc.js"></script><script src="chung/cc-xuat.js"></script></body></html>

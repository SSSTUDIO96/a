<title>Lời chúc lc-01 – Thiệp kem chúc mừng ngày cưới</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu lời chúc · Dùng cho: hợp đồng dịch vụ
     Nguồn ý tưởng: Tự sáng tác (cùng họ với shd-01 thư mời kem)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), a1 (Ảnh 1), nv (Nhân vật makeup), kh (Tên khách/học viên), td (Tiêu đề lời chúc), cc (Câu chúc), nsk (Ngày sự kiện)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#F5EFE4;color:#2A2420}
.b1{position:absolute;inset:40px;border:1.5px solid #B8975A}.b2{position:absolute;inset:52px;border:.75px solid #B8975A}
.w{position:absolute;inset:52px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 80px 46px}
.top{display:flex;align-items:center;gap:12px}.top img{width:54px;height:54px}.top span{font:500 18px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:#7A6340}
.ov{width:380px;height:380px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 10px #F5EFE4,0 0 0 11.5px #B8975A;margin-top:38px;flex:none}
.td{font-family:var(--f-tay-1);font-size:calc(96px*var(--tay-co-1));line-height:1.1;color:#8C6A3E;margin-top:34px}
.dg{font:italic 400 30px var(--f-chan);color:#5C4E3E;margin-top:10px}
.kh{font:600 46px/1.15 var(--f-chan);letter-spacing:.04em;text-transform:uppercase;width:100%}
.cc{font:italic 500 33px/1.45 var(--f-chan);margin-top:18px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.ft{font:500 17px var(--f-sans);letter-spacing:.28em;text-transform:uppercase;color:#7A6340}
.vuong .ov{width:240px;height:240px;margin-top:24px}.vuong .td{margin-top:20px;font-size:calc(80px*var(--tay-co-1))}.vuong .w{padding:38px 70px 34px}.vuong .kh{font-size:40px}
</style></head><body><div id="c"><div class="b1"></div><div class="b2"></div><div class="w">
<div class="top"><img data-f="logo" alt=""><span data-f="th"></span></div>
<div class="ov"><img class="ph" data-f="a1" alt=""></div>
<div class="td" data-f="td" data-fit="1"></div>
<div class="dg">Thân gửi <span data-f="nvThuong"></span></div><div class="kh" data-f="kh" data-fit="2"></div>
<div class="cc" data-fitc="36"><span data-f="cc"></span></div>
<div class="ft" data-f="nskChu"></div></div></div>
<script>window.MAC_DINH={"td": "Trăm năm hạnh phúc", "cc": "Chúc hai bạn trăm năm hạnh phúc, luôn giữ trọn yêu thương như ngày hôm nay. Cảm ơn bạn đã tin tưởng để chúng tôi được góp một phần nhỏ vào ngày trọng đại.", "loai": "dv"};</script>

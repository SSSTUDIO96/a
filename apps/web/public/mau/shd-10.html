<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-10 – Thư tay của giảng viên</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại · Dùng cho: hợp đồng khoá học
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), anh (Ảnh học viên), ten (Tên học viên), khoa (Tên khoá), lop (Mã lớp), ngay (Ngày khai giảng), lich (Lịch học), diachi (Địa chỉ), gv (Giảng viên)
     Phông: MP Viết tay 1, MP Viết tay 3, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#1C2333;color:#EFE3CC}
.fr{position:absolute;inset:40px;border:1px solid rgba(230,211,179,.45)}
.w{position:absolute;inset:40px;display:flex;flex-direction:column;padding:64px 80px 60px}
.top{display:flex;align-items:center;justify-content:space-between}
.tl{display:flex;align-items:center;gap:14px}
.ld{width:58px;height:58px;border-radius:50%;background:#EFE3CC;display:grid;place-items:center}.ld img{width:46px;height:46px}
.th{font:500 18px var(--f-sans);letter-spacing:.28em;text-transform:uppercase;color:#E6D3B3}
.cir{width:150px;height:150px;border-radius:50%;overflow:hidden;border:2px solid #E6D3B3;flex:none}
.dg{font:italic 400 40px var(--f-chan);color:#CDBB9C;margin-top:60px}
.ten{font-family:var(--f-tay-1);font-size:calc(110px*var(--tay-co-1));line-height:1.15;margin-top:4px}
.bd{font:400 37px/1.5 var(--f-chan);margin-top:26px;color:#EFE3CC;flex:1 1 0;min-height:0;overflow:hidden}
.bd b{font-weight:600;color:#fff}
.sg{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.sg .n{font-family:var(--f-tay-3);font-size:calc(66px*var(--tay-co-3));color:#E6D3B3;line-height:1.1}
.sg .r{font:500 16px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#A99C86;margin-top:6px}
.vuong .w{padding:46px 70px 44px}.vuong .dg{margin-top:28px}.vuong .bd{font-size:31px;margin-top:14px}.vuong .cir{width:120px;height:120px}.vuong .ten{font-size:calc(92px*var(--tay-co-1))}
</style></head><body><div id="c"><div class="fr"></div><div class="w">
<div class="top"><div class="tl"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div><div class="cir"><img class="ph" data-f="anh" alt=""></div></div>
<div class="dg">Thân gửi</div><div class="ten" data-f="ten" data-fit="2"></div>
<div class="bd" data-fitc="46">Chào mừng em đến với lớp <b data-f="khoa"></b> – <b data-f="lop"></b>. Buổi học đầu tiên vào <b data-f="thu"></b>, ngày <b data-f="ngayCham"></b>, <span data-f="gio"></span> tại <span data-f="diachi"></span>. Hẹn gặp em ở lớp!</div>
<div class="sg"><div class="n" data-f="gv"></div><div class="r">Giảng viên lớp <span data-f="lop"></span></div></div></div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

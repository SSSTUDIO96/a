<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Lời chúc lc-02 – Đen vàng cảm ơn đã tin chọn</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu lời chúc · Dùng cho: cả hợp đồng khoá học và dịch vụ (?loai=khoa|dv)
     Nguồn ý tưởng: Tự sáng tác (cùng họ với shd-02)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), a1 (Ảnh 1), td (Tiêu đề lời chúc), kh (Tên khách/học viên), cc (Câu chúc), dv (Khoá học hoặc dịch vụ)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#131212;color:#F3EBDD}
.fr{position:absolute;inset:36px;border:1px solid #C9A961}
.w{position:absolute;inset:36px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:54px 80px 48px}
.top{display:flex;align-items:center;gap:14px}
.ld{width:60px;height:60px;border-radius:50%;background:#F3EBDD;display:grid;place-items:center}.ld img{width:48px;height:48px}
.th{font:500 19px var(--f-sans);letter-spacing:.3em;color:#C9A961;text-transform:uppercase}
.ar{width:400px;height:470px;border-radius:200px 200px 0 0;overflow:hidden;outline:1px solid #C9A961;outline-offset:12px;margin-top:52px;flex:none}
.td{font-family:var(--f-tay-1);font-size:calc(88px*var(--tay-co-1));color:#C9A961;line-height:1.1;margin-top:40px;width:100%}
.kh{font:600 44px/1.15 var(--f-chan);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;width:100%}
.cc{font:400 32px/1.5 var(--f-chan);color:#E5DCCB;margin-top:16px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.ft{font:500 17px var(--f-sans);letter-spacing:.22em;color:#A59C8E;text-transform:uppercase}
.vuong .ar{width:270px;height:300px;margin-top:34px}.vuong .td{margin-top:28px;font-size:calc(72px*var(--tay-co-1))}.vuong .w{padding:40px 80px 36px}.vuong .kh{font-size:38px}
</style></head><body><div id="c"><div class="fr"></div><div class="w"><div class="top"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div>
<div class="ar"><img class="ph" data-f="a1" alt=""></div>
<div class="td" data-f="td" data-fit="2"></div><div class="kh" data-f="kh" data-fit="2"></div>
<div class="cc" data-fitc="34"><span data-f="cc"></span></div>
<div class="ft" data-f="dv" data-fitw style="white-space:nowrap;max-width:100%"></div></div></div>
<script>window.MAC_DINH={"td": "Cảm ơn bạn đã tin chọn", "cc": "Cảm ơn bạn đã dành cho chúng tôi sự tin tưởng. Mong rằng mỗi khoảnh khắc trong ngày đặc biệt đều rạng rỡ như chính bạn.", "loai": "dv"};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

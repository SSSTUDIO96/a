<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1123">
<title>Giấy chứng nhận cc-06 – Guilloche bạc</title>
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 06 — tự sáng tác: hoa văn guilloche (đường lượn đan nhau như trên tiền giấy, bằng cấp) màu bạc–xanh thép.
     Huy hiệu bạc TO nằm giữa hoa thị guilloche bên phải (là tâm điểm). Tiêu đề chữ xanh thép nổi khối 3D, tên chữ ký TO.
     Ô ảnh học viên (tròn, nhỏ ~27 mm): góc TRÊN PHẢI, trên hoa thị. ?anh=an để ẩn. -->
<style>
.c6{--f-ten:var(--f-ky-4);--ten-co:var(--ky-co-4);--thep:#1F3A5A;background:#F4F6F8;color:var(--thep)}
.c6 .hv{inset:0}
.c6 .anh{left:922px;top:92px;width:104px;height:104px;box-shadow:0 0 0 4px #F4F6F8,0 0 0 6px #7D8996}
.c6 .huy{left:758px;top:252px;width:244px}
.c6 .o-logo{left:98px;top:90px;width:38px;height:38px}
.c6 .thg{left:146px;top:90px;line-height:38px;color:#3C5470;max-width:420px}
.c6.khong-logo .thg{left:98px}
.c6 .t1{left:94px;top:140px;width:640px;height:86px}
.c6 .t2{left:98px;top:236px;font-family:var(--f-sans);font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#3C5470;white-space:nowrap}
.c6 .tag{left:98px;top:284px;color:#4D6480;font-size:12px}
.c6 .ten{left:88px;top:304px;width:606px;height:156px;font-size:calc(118px * var(--ten-co));color:var(--thep)}
.c6 .dong{left:98px;top:476px;color:#1D2B3A}
.c6 .ngay{left:98px;top:514px;color:#4D6480}
.c6 .so{left:758px;width:244px;top:548px;text-align:center;color:#4D6480}
.c6 .ky1{left:98px;top:574px;width:250px}
.c6 .ky2{left:430px;top:574px;width:250px}
</style></head>
<body class="xem"><main>
<section class="cc c6">
  <svg class="hv" viewBox="0 0 1123 794" aria-hidden="true" id="hv6"></svg>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-kim="bac" data-nen="#1F3A5A" data-chu="#E6EBF0"></div>
  <div class="o-logo"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="tt sv t1" data-gold="xanh" data-al="left" data-max="66">Giấy chứng nhận</div>
  <div class="t2">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten sv" data-f="ten" data-al="left" data-line="1" data-line-h="1.5" data-line-color="#7D8996"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="so meta"><span class="nh">Số chứng nhận<br></span><b data-f="so"></b><i class="lai" data-f="lai"></i></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv" data-f="gdcv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
(function(){
  const W=1123,H=794,P=[];
  const f=(n)=>n.toFixed(1);
  function canh(x0,y0,x1,y1,doc){const L=doc?y1-y0:x1-x0;const n=Math.round(L/4);
    for(let k=0;k<8;k++){const ph=k*Math.PI/4;let d='';
      for(let i=0;i<=n;i++){const t=i/n*L;const o=42+11*Math.sin(t/14+ph)+4*Math.sin(t/5.3-ph);
        const x=doc?(x0<W/2?x0+o:x0-o):x0+t, y=doc?y0+t:(y0<H/2?y0+o:y0-o);d+=(i?'L':'M')+f(x)+' '+f(y);}
      P.push(`<path d="${d}" stroke="${k%2?'#9AA6B3':'#5C7591'}"/>`);}}
  canh(60,0,W-60,0,0);canh(60,H,W-60,H,0);canh(0,60,0,H-60,1);canh(W,60,W,H-60,1);
  function hoa(cx,cy,R,a,n,m,mau,w){for(let k=0;k<m;k++){const ph=k*2*Math.PI/m/n;let d='';
    for(let i=0;i<=360;i++){const t=i/360*2*Math.PI;const r=R+a*Math.sin(n*t+ph*n);d+=(i?'L':'M')+f(cx+r*Math.cos(t))+' '+f(cy+r*Math.sin(t));}
    P.push(`<path d="${d}" stroke="${mau}" stroke-width="${w}"/>`);}}
  for(const [x,y] of [[42,42],[W-42,42],[42,H-42],[W-42,H-42]]){P.push(`<circle cx="${x}" cy="${y}" r="30" fill="#F4F6F8"/>`);hoa(x,y,20,7,7,6,'#5C7591',.8);}
  // Hoa thị lớn ôm huy hiệu (tâm 880,374)
  P.push(`<circle cx="880" cy="374" r="168" fill="#F4F6F8" stroke="none"/>`);
  hoa(880,374,156,16,18,14,'#9AA6B3',.7);hoa(880,374,138,10,24,10,'#5C7591',.6);
  P.push(`<rect x="66" y="66" width="${W-132}" height="${H-132}" stroke="#5C7591" stroke-width="1.2"/>`);
  P.push(`<rect x="72" y="72" width="${W-144}" height="${H-144}" stroke="#9AA6B3" stroke-width=".6"/>`);
  document.getElementById('hv6').innerHTML=`<g fill="none" stroke-width=".9">${P.join('')}</g>`;
})();
</script>
<script src="chung/html-to-image.js"></script><script src="chung/cc.js"></script><script src="chung/cc-xuat.js"></script></body></html>

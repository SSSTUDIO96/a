<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Mẫu feedback fb-04 – Thư cảm ơn nền kem</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu feedback · Dùng cho: cả hợp đồng khoá học và dịch vụ (?loai=khoa|dv)
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: nd (Nội dung lời khen), kh (Tên khách/học viên), dv (Khoá học hoặc dịch vụ), nfb (Ngày nhận lời khen), a1 (Ảnh 1), a2 (Ảnh 2), a3 (Ảnh 3), logo (Logo), th (Tên thương hiệu)
     Phông: MP Viết tay 1, MP Viết tay 3, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#F5EFE4;color:#2A2420}
.b1{position:absolute;inset:40px;border:1.5px solid #B8975A}.b2{position:absolute;inset:52px;border:.75px solid #B8975A}
.w{position:absolute;inset:52px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 76px 46px}
.hw{font-family:var(--f-tay-1);font-size:calc(96px*var(--tay-co-1));color:#8C6A3E;line-height:1.1}
.nd{font:italic 500 38px/1.45 var(--f-chan);margin-top:20px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sg{font-family:var(--f-tay-3);font-size:calc(64px*var(--tay-co-3));line-height:1.1;margin-top:14px}
.mt{font:500 16px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#7A6340;margin-top:8px}
.ph3{display:flex;gap:18px;margin-top:28px}.ph3 div{width:250px;height:250px;overflow:hidden;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 1px #E2D6C3}
.ft{display:flex;align-items:center;gap:12px;margin-top:26px}.ft img{width:46px;height:46px}.ft span{font:500 17px var(--f-sans);letter-spacing:.28em;text-transform:uppercase;color:#7A6340}
.vuong .ph3 div{width:200px;height:200px}.vuong .hw{font-size:calc(80px*var(--tay-co-1))}.vuong .nd{font-size:33px}.vuong .w{padding:40px 70px 36px}
</style></head><body><div id="c"><div class="b1"></div><div class="b2"></div><div class="w"><div class="hw">Lời cảm ơn</div>
<div class="nd" data-fitc="52"><span data-f="nd"></span></div>
<div class="sg" data-f="kh"></div><div class="mt"><span data-f="dv"></span> · <span data-f="nfbCham"></span></div>
<div class="ph3"><div><img class="ph" data-f="a1" alt=""></div><div><img class="ph" data-f="a2" alt=""></div><div><img class="ph" data-f="a3" alt=""></div></div>
<div class="ft"><img data-f="logo" alt=""><span data-f="th"></span></div></div></div>
<script>window.MAC_DINH={"loai": "khoa"};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Lời chúc lc-03 – Ảnh lớn, khung trắng</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu lời chúc · Dùng cho: hợp đồng dịch vụ
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: a1 (Ảnh 1), logo (Logo), th (Tên thương hiệu), td (Tiêu đề lời chúc), kh (Tên khách/học viên), cc (Câu chúc), nv (Nhân vật makeup), goi (Tên gói), nsk (Ngày sự kiện)
     Phông: MP Viết tay 3, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#E4D8CE}
/* Ảnh khung tròn lớn viền trắng (trước đây ảnh tràn toàn khung) — khung mặc định tròn, 19/10/2026. */
.bgp{position:absolute;left:50%;top:150px;width:560px;height:560px;margin-left:-280px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 16px #FFFDF9,0 20px 40px 16px rgba(60,40,30,.12)}
.th0{position:absolute;left:56px;top:52px;display:flex;align-items:center;gap:12px;background:#FFFDF9;padding:10px 20px 10px 12px;border-radius:40px}
.th0 img{width:42px;height:42px}.th0 span{font:600 16px var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:#2A2420}
.pn{position:absolute;left:56px;right:56px;bottom:56px;height:540px;background:#FFFDF9;padding:40px 56px 38px;display:flex;flex-direction:column;color:#231E1D}
.pn:before{content:"";position:absolute;inset:14px;border:1px solid #D9C9B0;pointer-events:none}
.td{font-family:var(--f-tay-3);font-size:calc(92px*var(--tay-co-3));line-height:1.05;color:#A0475C}
.kh{font:600 40px/1.2 var(--f-chan);margin-top:6px}
.cc{font:italic 500 33px/1.45 var(--f-chan);margin-top:14px;flex:1 1 0;min-height:0;overflow:hidden}
.ft{font:500 16px var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:#7C716A}
.vuong .pn{height:470px;padding:34px 50px 32px}.vuong .bgp{top:118px;width:380px;height:380px;margin-left:-190px;box-shadow:0 0 0 12px #FFFDF9}.vuong .td{font-size:calc(80px*var(--tay-co-3))}
</style></head><body><div id="c"><div class="bgp"><img class="ph" data-f="a1" alt=""></div>
<div class="th0"><img data-f="logo" alt=""><span data-f="th"></span></div>
<div class="pn"><div class="td" data-f="td" data-fit="1"></div><div class="kh" data-f="kh" data-fit="1"></div>
<div class="cc" data-f="cc" data-fitc="36"></div>
<div class="ft"><span data-f="nv"></span> · <span data-f="goi"></span> · <span data-f="nskCham"></span></div></div></div>
<script>window.MAC_DINH={"td": "Luôn toả sáng", "cc": "Cảm ơn bạn đã chọn chúng tôi cho ngày đặc biệt. Chúc bạn luôn tự tin và toả sáng theo cách riêng của mình.", "loai": "dv", "nv": "Khách dự tiệc", "goi": "Trang điểm dự tiệc", "kh": "Lê Minh Châu", "nsk": "31/10/2026", "a1": "chung/anh-fb-2.svg"};</script>

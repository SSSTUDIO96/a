<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1123">

<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 05 — dựng sát ảnh anh Chiến gửi số 5: viền hoa văn vàng DÀY (ren tròn đan), khung trong có hoa văn góc, chữ xanh đậm,
     tiêu đề có dòng phụ + đường kẻ, "trân trọng trao cho", tên chữ ký nghiêng xanh có gạch dưới, đường cuộn xanh giữa trang,
     hai chữ ký, HUY HIỆU NHỎ CÓ RUY BĂNG xanh ở giữa đáy. Tất cả vẽ SVG (không chép ảnh).
     BIẾN THỂ BẠC (như nửa dưới ảnh gốc): thêm ?vien=bac vào đường dẫn — viền ngoài bạc, hoa văn trong vẫn vàng.
     Ô ảnh học viên (tròn, nhỏ ~25 mm): bên TRÁI tên, trong khung (chỗ trống ở ảnh gốc). ?anh=an để ẩn. -->

.c5 .thg{left:0;width:1123px;top:104px;text-align:center;font-size:10px;color:#3B4A66}
.c5 .t1{left:281px;top:146px;width:560px;height:84px}
.c5 .t2{left:0;width:1123px;top:240px;text-align:center;font-family:var(--f-sans);font-weight:500;font-size:15px;letter-spacing:.36em;text-transform:uppercase;color:var(--xanh)}
.c5 .gach0{left:561px;top:278px;width:340px;margin-left:-170px;height:1px;background:var(--xanh);opacity:.75}
.c5 .tag{left:0;width:1123px;top:296px;text-align:center;font-size:12.5px;letter-spacing:.3em;color:#3B4A66}
.c5 .ten{left:261px;top:318px;width:600px;height:158px;font-size:calc(118px * var(--ten-co));color:var(--xanh)}
.c5 .dong{left:0;width:1123px;top:490px;text-align:center;color:#1F2A3C}
.c5 .ngay{left:0;width:1123px;top:526px;text-align:center;color:#3B4A66}
.c5 .cuon{left:441px;top:558px;width:240px;height:36px}
.c5 .anh{left:150px;top:372px;width:96px;height:96px;box-shadow:0 0 0 3px #FFFDF8,0 0 0 5px #B88A35,0 0 0 6px #FFFDF8}
.c5 .huy{left:513px;top:588px;width:96px}
.c5 .ky1{left:270px;top:566px;width:227px}
.c5 .ky2{left:702px;top:566px;width:227px}
.c5 .so{left:0;width:1123px;top:718px;text-align:center;color:#3B4A66}
</style></head>
<body class="xem"><main>
<section class="cc c5">
  <svg class="vien" viewBox="0 0 1123 794" aria-hidden="true">
    <defs>
      <linearGradient id="v5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#E9CF86"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#F3DE9C"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <linearGradient id="vo5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#E9CF86"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#F3DE9C"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <linearGradient id="vb5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E7B89"/><stop offset=".3" stop-color="#EEF1F5"/><stop offset=".55" stop-color="#98A3B0"/><stop offset=".8" stop-color="#FAFBFC"/><stop offset="1" stop-color="#6E7B89"/></linearGradient>
      <pattern id="ren5" width="26" height="26" patternUnits="userSpaceOnUse">
        <rect width="26" height="26" fill="#FBF3DF"/>
        <g fill="none" stroke="#A97C2C" stroke-width="1.3"><circle cx="13" cy="7.5" r="5.2"/><circle cx="13" cy="18.5" r="5.2"/><circle cx="7.5" cy="13" r="5.2"/><circle cx="18.5" cy="13" r="5.2"/></g>
        <circle cx="13" cy="13" r="1.8" fill="#8A6420"/><path d="M0 0 l3 0 -3 3z M26 0 l-3 0 3 3z M0 26 l3 0 -3 -3z M26 26 l-3 0 3 -3z" fill="#A97C2C"/>
      </pattern>
      <pattern id="ren5b" width="26" height="26" patternUnits="userSpaceOnUse">
        <rect width="26" height="26" fill="#F2F4F7"/>
        <g fill="none" stroke="#8F99A7" stroke-width="1.3"><circle cx="13" cy="7.5" r="5.2"/><circle cx="13" cy="18.5" r="5.2"/><circle cx="7.5" cy="13" r="5.2"/><circle cx="18.5" cy="13" r="5.2"/></g>
        <circle cx="13" cy="13" r="1.8" fill="#6F7B89"/><path d="M0 0 l3 0 -3 3z M26 0 l-3 0 3 3z M0 26 l3 0 -3 -3z M26 26 l-3 0 3 -3z" fill="#8F99A7"/>
      </pattern>
    </defs>
    <!-- viền ngoài: vàng (mặc định) hoặc bạc (?vien=bac). Không dùng biến CSS trong SVG để html-to-image xuất đúng. -->
    <g class="og"><rect x="12" y="12" width="1099" height="770" rx="18" fill="url(#ren5)"/><rect x="12" y="12" width="1099" height="770" rx="18" fill="none" stroke="url(#vo5)" stroke-width="3.5"/></g>
    <g class="ob"><rect x="12" y="12" width="1099" height="770" rx="18" fill="url(#ren5b)"/><rect x="12" y="12" width="1099" height="770" rx="18" fill="none" stroke="url(#vb5)" stroke-width="3.5"/></g>
    <rect x="46" y="46" width="1031" height="702" fill="#FFFDF8" stroke="url(#vo5)" stroke-width="3"/>
    <rect x="52" y="52" width="1019" height="690" fill="none" stroke="url(#v5)" stroke-width="2"/>
    <rect x="62" y="62" width="999" height="670" fill="none" stroke="#B88A35" stroke-width="1"/>
    <rect x="68" y="68" width="987" height="658" fill="none" stroke="#B88A35" stroke-width=".7" stroke-dasharray="2 4"/>
    <g id="goc5"></g>
    <!-- lá thoi giữa hai cạnh bên -->
    <g fill="url(#v5)"><path d="M82 397 q11 -17 0 -34 q-11 17 0 34z M82 397 q11 17 0 34 q-11 -17 0 -34z" transform="translate(-2 0)"/><path d="M1041 397 q11 -17 0 -34 q-11 17 0 34z M1041 397 q11 17 0 34 q-11 -17 0 -34z" transform="translate(2 0)"/></g>
  </svg>
  <svg class="cuon" viewBox="0 0 220 40" aria-hidden="true" id="cuon5"></svg>
  <div class="o-logo"><img data-f="logo" alt=""></div>

  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv" data-f="gdcv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
</section>
</main>
<script>
// Hoa văn góc và đường cuộn: xoắn ốc tự sinh.
(function(){
  function xoan(cx,cy,r0,vong,chieu,goc0){let d='';const n=60;for(let i=0;i<=n;i++){const t=i/n;const a=goc0+chieu*t*vong*2*Math.PI;const r=r0*(1-t*.82);
    d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);}return d;}
  const g1=`<g fill="none" stroke="url(#v5)" stroke-width="2.4" stroke-linecap="round">
    <path d="M70 160 C70 106 94 78 146 72"/><path d="M70 200 C76 140 114 98 196 88"/>
    <path d="${xoan(104,110,26,1.1,1,Math.PI*0.9)}"/><path d="${xoan(154,88,14,1,-1,Math.PI*1.4)}"/><path d="${xoan(88,156,14,1,1,Math.PI*0.2)}"/>
    <path d="M196 88 C221 84 234 92 242 104" /><path d="M70 200 C66 225 74 238 86 246"/></g>
    <g fill="#8A6420"><circle cx="244" cy="106" r="3"/><circle cx="88" cy="248" r="3"/><path d="M104 104 l8 -14 8 14 -8 14z" opacity=".9"/></g>`;
  const W=1123,H=794;
  document.getElementById('goc5').innerHTML=[`<g>${g1}</g>`,`<g transform="translate(${W} 0) scale(-1 1)">${g1}</g>`,`<g transform="translate(0 ${H}) scale(1 -1)">${g1}</g>`,`<g transform="translate(${W} ${H}) scale(-1 -1)">${g1}</g>`].join('');
  const nua=`<path d="M100 20 C80 4 52 4 40 20 C30 34 14 30 14 20 C14 12 24 10 26 18" /><path d="${xoan(26,20,9,.9,-1,Math.PI)}"/><path d="M100 20 C84 32 66 34 56 28"/>`;
  document.getElementById('cuon5').innerHTML=`<g fill="none" stroke="#14284B" stroke-width="2.2" stroke-linecap="round">${nua}<g transform="translate(220 0) scale(-1 1)">${nua}</g></g><path d="M110 10 l7 10 -7 10 -7 -10z" fill="#14284B"/>`;
})();
</script>
<script src="chung/html-to-image.js"></script><script src="chung/cc.js"></script><script src="chung/cc-xuat.js"></script></body></html>

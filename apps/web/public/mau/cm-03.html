<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng cm-03 – Tem nền đậm</title>
<!-- Makeup Pro · R&D-10 (19/10/2026), vào app theo bản vẽ H (26/10/2026): phông của app (phong/phong.css + ss-album.css, nối ở chung/cm.css), ô mã data-f="ma".
     · kiểu (c) "Tem răng cưa trên nền đậm" của R&D-07 vòng 2.
     Chất liệu: tờ tem giấy kem đục lỗ răng cưa trên nền hoa lá nét khắc xanh rêu ĐẬM; trong tem có hoa văn guilloche (hoa thị) quanh ảnh.
     Bố cục "tem bưu chính": hàng đầu trái = logo + tên trung tâm, phải = MÃ SỐ như "mệnh giá" của tem; giữa = ảnh tròn trên hoa thị;
     dưới = tên khoá chữ vàng, "Thân gửi", TÊN chữ ký TO (MonteCarlo).
     Ô dữ liệu: logo, th, anh (khung tròn), khoa, lop, ngay, ten, diachi + ma (mã số học viên trong lớp, bản vẽ H; trống thì ẩn hẳn khối .seat).
     Phông: MonteCarlo (chữ ký, OFL; = 'MP Chữ ký 5' của app) · Cormorant Garamond · Playfair Display · Montserrat. Khổ 1080×1350, ?kho=vuong → 1080×1080. ?ma=12 đổi mã số. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/mau.css"><link rel="stylesheet" href="chung/cm.css">
<style>
:root{--chu:#2A2420;--phu:#5C4E3E;--nhan:#6B5535;--vien:#B8975A}
#c{background:#1F3328;color:var(--chu)}
.w{left:152px;top:170px;width:776px;height:996px;padding:6px 18px 0}
.hd{display:flex;align-items:flex-start;justify-content:space-between;width:100%;gap:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;padding-top:14px;flex:1}
.lg{width:56px;height:56px}
.th{font:600 19px/1.35 var(--f-sans);letter-spacing:.26em;color:var(--nhan);text-transform:uppercase;text-align:left;min-width:0}
.seat{flex:none;flex-direction:column;width:132px;padding:8px 0 16px;border:2px solid #6B5535;background:#FBF7EC;box-shadow:inset 0 0 0 4px #FBF7EC,inset 0 0 0 5.5px #B8975A}
.seat-l{font:600 15px var(--f-sans);letter-spacing:.34em;text-indent:.34em;color:var(--nhan)}
.seat-n{font:600 64px/1 var(--f-chan2);color:var(--chu);margin-top:2px}
.av{width:270px;height:270px;margin-top:4px;box-shadow:0 0 0 7px #F5EFE3,0 0 0 9px var(--vien)}
.k1{font:500 18px var(--f-sans);letter-spacing:.4em;color:var(--nhan);text-transform:uppercase}
.kh{font:600 56px/1.08 var(--f-chan);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.lo{font:italic 400 29px var(--f-chan);color:var(--phu);margin-top:8px}
.or{display:flex;align-items:center;gap:16px;margin:16px 0 8px}.or i{width:110px;height:1px;background:var(--vien)}.or b{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--vien)}
.dg{font:italic 400 32px var(--f-chan);color:var(--phu)}
.ten{font-size:calc(96px*var(--tay-co-1));color:var(--chu)}
.by{font:italic 400 27px var(--f-chan);color:var(--phu);margin-top:14px}
.ft{font:500 17px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--nhan)}
.dc{font:400 25px var(--f-chan);color:var(--phu);margin-top:6px;max-width:100%;white-space:nowrap}
.vuong .w{left:146px;top:112px;width:788px;height:850px;padding:4px 18px 0}
.vuong .lg{width:46px;height:46px}.vuong .th{font-size:17px}.vuong .seat{width:112px;padding:6px 0 14px}.vuong .seat-n{font-size:52px}
.vuong .av{width:190px;height:190px;margin-top:0}.vuong .k1{font-size:16px}.vuong .kh{font-size:44px;margin-top:6px}.vuong .lo{font-size:26px;margin-top:4px}
.vuong .or{margin:8px 0 2px}.vuong .dg{font-size:28px}.vuong .ten{font-size:calc(80px*var(--tay-co-1))}.vuong .by{font-size:24px}.vuong .dc{font-size:23px}.vuong .ft{font-size:16px}
</style></head><body><div id="c"><div class="w">
<div class="hd"><div class="brand"><img class="lg" data-f="logo" alt=""><div class="th" data-f="th" data-do></div></div>
 <div class="seat"><span class="seat-l" data-do>SỐ</span><b class="seat-n" data-f="ma" data-do></b></div></div>
<div class="sp" style="flex:.3 1 0"></div>
<div class="av"><img data-f="anh" alt=""></div>
<div class="sp" style="flex:.6 1 0;min-height:44px"></div>
<div class="k1" data-do>Chào mừng đến với lớp</div>
<div class="kh vang" data-f="khoa" data-fit="2" data-do data-vang="#684010,#8E6116,#684010,#8E6116"></div>
<div class="lo" data-do>Lớp <span data-f="lop"></span> · khai giảng <span data-f="ngayCham"></span></div>
<div class="or"><i></i><b></b><i></i></div>
<div class="dg" data-do>Thân gửi</div>
<div class="ten" data-f="ten" data-fit="2" data-do></div>
<div class="by" data-do>Thân ái, <span data-f="th"></span></div>
<div class="sp"></div>
<div class="ft" data-f="thangNam" data-do></div><div class="dc" data-f="diachi" data-fitw data-do></div>
</div></div>
<script>window.MAC_DINH={ten:'Đặng Quỳnh Như'};</script>
<script src="chung/ve.js"></script><script src="chung/ve-moi.js"></script>
<script src="chung/mau.js"></script><script src="chung/cm.js"></script>
<script>(function(){const V=window.VE,vuong=new URLSearchParams(location.search).get('kho')==='vuong';V.kho(1080,vuong?1080:1350);
 const b=vuong?{x:130,y:76,w:820,h:928}:{x:130,y:130,w:820,h:1090};const [m,n]=V.NEN_MAU['toi-reu'];
 VE_MOUNT(V.veKhac(m,n)+`<defs>${V.LOC}<mask id="lo" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="${V.H}"><rect width="1080" height="${V.H}" fill="#fff"/><g fill="#000">${V.loTem(b,14,40)}</g></mask></defs>`+
   V.giayVan(V.hinhChuNhat(b),'mask="url(#lo)"')+`<rect x="${b.x+30}" y="${b.y+30}" width="${b.w-60}" height="${b.h-60}" fill="none" stroke="#B8975A" stroke-width="1.2"/><rect x="${b.x+37}" y="${b.y+37}" width="${b.w-74}" height="${b.h-74}" fill="none" stroke="#B8975A" stroke-width=".6"/>`);
 // hoa thị (guilloche) quanh ảnh: đặt theo vị trí thật của khung ảnh sau khi bố cục xong
 window.CM_SAU.push(()=>{const a=document.querySelector('.av').getBoundingClientRect(),c=document.getElementById('c').getBoundingClientRect();
  const cx=a.left-c.left+a.width/2,cy=a.top-c.top+a.height/2,R=a.width*.5+(vuong?24:30);
  VE_MOUNT(`<g opacity=".8">${V.hoaThi(cx,cy,R,'#A98650')}</g><circle cx="${cx}" cy="${cy}" r="${R*.62}" fill="#F5EFE3"/><circle cx="${cx}" cy="${cy}" r="${a.width/2+22}" fill="none" stroke="#B8975A" stroke-width="1" stroke-dasharray="2 5"/>`,true);});})();</script>
<script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

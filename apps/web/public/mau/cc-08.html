<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1123">

<!-- Mẫu 08 — tự sáng tác: nền đen tuyền, khung vàng mảnh kiểu Art Deco (góc bậc thang), bố cục giữa.
     HUY HIỆU TO ở chính giữa phía trên, quạt Art Deco toả sau lưng như vầng hào quang. Tiêu đề và tên vàng nổi khối 3D.
     Ô ảnh học viên (tròn, nhỏ ~26 mm): giữa hai chỗ ký, cạnh hàng chữ ký. ?anh=an để ẩn. -->

.c8 .day i{width:1px;height:16px;background:#6B5A3A}
.c8 .huy{left:481px;top:62px;width:160px}
.c8 .t1{left:211px;top:244px;width:700px;height:62px}
.c8 .t2{left:0;width:1123px;top:314px;text-align:center;font-family:var(--f-sans);font-weight:500;font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:#CDBF9F}
.c8 .tag{left:0;width:1123px;top:342px;text-align:center;color:#EDE6DA;font-size:11.5px;letter-spacing:.34em}
.c8 .ten{left:141px;top:358px;width:840px;height:150px;font-size:calc(116px * var(--ten-co))}
.c8 .dong{left:0;width:1123px;top:514px;text-align:center;color:#EDE6DA}
.c8 .ngay{left:0;width:1123px;top:548px;text-align:center;color:#BFB29A}
.c8 .ky1{left:210px;top:572px;width:240px}
.c8 .ky2{left:673px;top:572px;width:240px}
.c8 .anh{left:511px;top:584px;width:100px;height:100px;box-shadow:0 0 0 3px #0E0E0F,0 0 0 5px #C9A961,0 0 0 8px #0E0E0F,0 0 0 9px #8A6420}
.c8 .so{position:static;color:#A99C84}
</style></head>
<body class="xem"><main>
<section class="cc c8">
  <svg class="khung" viewBox="0 0 1123 794" aria-hidden="true">
    <defs><linearGradient id="v8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#E9CF86"/><stop offset=".55" stop-color="#A97C2C"/><stop offset=".8" stop-color="#F3DE9C"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <g id="g8"><path d="M28 120 V28 H120 M40 100 V40 H100 M52 80 V52 H80" fill="none" stroke="url(#v8)" stroke-width="1.6"/><path d="M52 52 L64 64" stroke="url(#v8)" stroke-width="1.6"/><rect x="60" y="60" width="8" height="8" transform="rotate(45 64 64)" fill="url(#v8)"/></g></defs>
    <rect x="28" y="28" width="1067" height="738" fill="none" stroke="url(#v8)" stroke-width="1.6"/>
    <rect x="40" y="40" width="1043" height="714" fill="none" stroke="url(#v8)" stroke-width=".8"/>
    <use href="#g8"/><use href="#g8" transform="translate(1123 0) scale(-1 1)"/><use href="#g8" transform="translate(0 794) scale(1 -1)"/><use href="#g8" transform="translate(1123 794) scale(-1 -1)"/>

<script>
// Quạt Art Deco toả sau huy hiệu (tâm 561,142).
(function(){let s='';const cx=561,cy=142;for(let i=0;i<=22;i++){const a=Math.PI+i*Math.PI/22;const r1=88,r2=i%2?100:112;
  s+=`<path d="M${(cx+r1*Math.cos(a)).toFixed(1)} ${(cy+r1*Math.sin(a)).toFixed(1)} L${(cx+r2*Math.cos(a)).toFixed(1)} ${(cy+r2*Math.sin(a)).toFixed(1)}"/>`;}
  s+=`<path d="M${cx-112} ${cy} A112 112 0 0 1 ${cx+112} ${cy}"/><path d="M${cx-112} ${cy} H${cx-200} M${cx+112} ${cy} H${cx+200}"/>`;
  document.getElementById('quat8').innerHTML=s;})();
</script>

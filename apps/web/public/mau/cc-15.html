<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1123">
<title>Giấy chứng nhận cc-15 – Đỏ nhung ren vàng</title>
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/cc.css">
<!-- Mẫu 15 — mẫu thêm (ý riêng): đỏ nhung rượu vang, VIỀN REN CUNG TRÒN vàng, RUY BĂNG KEM có đuôi gập chứa tiêu đề, ảnh học viên là
     huy chương nhỏ ngồi trên mép ruy băng, huy hiệu TO có hai đuôi vàng ở giữa đáy. Tiêu đề vàng đậm nổi khối 3D trên ruy băng, tên vàng nổi khối trên nền đỏ.
     Ô ảnh học viên (tròn, nhỏ ~26 mm): giữa mép trên, đè lên mép ruy băng. Logo + tên trung tâm góc trên trái. ?anh=an để ẩn. -->
<style>
.c15{--f-ten:var(--f-ky-2);--ten-co:var(--ky-co-2);background:#4A0E1B;color:#F3E6D0}
.c15 .nen{inset:0}
.c15 .anh{left:511px;top:32px;width:100px;height:100px;box-shadow:0 0 0 3px #4A0E1B,0 0 0 5px #C9A961,0 0 0 8px #4A0E1B,0 0 0 9px #8A6420}
.c15 .o-logo{left:92px;top:66px;width:38px;height:38px}
.c15 .thg{left:138px;top:66px;line-height:38px;color:#E4D6B4;font-size:11px}
.c15.khong-logo .thg{left:92px}
.c15 .t1{left:221px;top:140px;width:680px;height:62px}
.c15 .t2{left:0;width:1123px;top:224px;text-align:center;font-family:var(--f-sans);font-weight:500;font-size:14px;letter-spacing:.4em;text-transform:uppercase;color:#E4D09A}
.c15 .tag{left:0;width:1123px;top:258px;text-align:center;color:#F3E6D0;font-size:12px;letter-spacing:.34em}
.c15 .ten{left:171px;top:274px;width:780px;height:150px;font-size:calc(118px * var(--ten-co))}
.c15 .dong{left:0;width:1123px;top:436px;text-align:center;color:#F3E6D0}
.c15 .ngay{left:0;width:1123px;top:472px;text-align:center;color:#D9C9AE}
.c15 .huy{left:476px;top:522px;width:170px}
.c15 .ky1{left:205px;top:574px;width:230px;color:#F3E6D0}
.c15 .ky2{left:687px;top:574px;width:230px;color:#F3E6D0}
.c15 .so{left:92px;top:716px;color:#C9B89A}
</style></head>
<body class="xem"><main>
<section class="cc c15">
  <svg class="nen" viewBox="0 0 1123 794" aria-hidden="true" id="nen15">
    <defs>
      <radialGradient id="bg15" cx="561" cy="360" r="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C1A2E"/><stop offset=".6" stop-color="#561021"/><stop offset="1" stop-color="#32070F"/></radialGradient>
      <linearGradient id="v15" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6420"/><stop offset=".3" stop-color="#F3DE9C"/><stop offset=".55" stop-color="#B88A35"/><stop offset=".8" stop-color="#F0D587"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
      <linearGradient id="rb15" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset=".6" stop-color="#FBEFD2"/><stop offset="1" stop-color="#F1E1BC"/></linearGradient>
    </defs>
    <rect width="1123" height="794" fill="url(#bg15)"/>
    <g id="ren15" fill="none" stroke="url(#v15)"></g>
    <!-- ruy băng: đuôi gập hai bên, thân kem -->
    <path d="M96 150 H190 V226 H96 L128 188Z" fill="#CBB483"/><path d="M96 150 H190 V226 H96 L128 188Z" fill="#000" opacity=".12"/>
    <path d="M1027 150 H933 V226 H1027 L995 188Z" fill="#CBB483"/><path d="M1027 150 H933 V226 H1027 L995 188Z" fill="#000" opacity=".12"/>
    <path d="M190 226 L190 242 L236 226Z M933 226 L933 242 L887 226Z" fill="#6A5226"/>
    <path d="M150 116 H973 V204 H150Z" fill="#000" opacity=".28" transform="translate(0 8)"/>
    <rect x="150" y="116" width="823" height="88" fill="url(#rb15)"/>
    <path d="M150 122 H973 M150 198 H973" stroke="url(#v15)" stroke-width="1.6"/>
    <path d="M150 116 H973 V204 H150Z" fill="none" stroke="#B88A35" stroke-width=".8"/>
  </svg>
  <div class="anh"><img data-f="anh" alt=""></div>
  <div class="o-logo de-sang"><img data-f="logo" alt=""></div>
  <div class="thg" data-f="th"></div>
  <div class="tt sv t1" data-gold="dam" data-al="center" data-max="58">Giấy chứng nhận</div>
  <div class="t2">Hoàn thành khoá học</div>
  <div class="tag caps">Trân trọng trao cho</div>
  <div class="ten sv" data-f="ten" data-gold="bong" data-al="center" data-line="1" data-line-inset="110" data-line-h="1.4"></div>
  <div class="dong" data-f="dong"></div>
  <div class="ngay" data-f="ngayChu"></div>
  <div class="huy" data-huy-hieu data-kieu="rang" data-nen="#4A0E1B" data-duoi="1" data-ruy="vang"></div>
  <div class="ky ky1"><div class="cv">Giảng viên</div><div class="dl"></div><div class="nm" data-f="gv"></div></div>
  <div class="ky ky2"><div class="cv" data-f="gdcv">Giám đốc trung tâm</div><div class="dl"></div><div class="nm" data-f="gd"></div></div>
  <div class="so meta"><span class="nh">Số </span><b data-f="so"></b><i class="lai" data-f="lai"></i></div>
</section>
</main>
<script>
// Viền ren cung tròn: hàng cung nhỏ chạy quanh trang + đường kẻ trong + hoa góc.
(function(){
  const W=1123,H=794;let d='';const r=13,a=26,b=24;
  // trên/dưới
  for(let x=b+r;x<=W-b-r;x+=2*r){d+=`M${x-r} ${b} A${r} ${r} 0 0 0 ${x+r} ${b} `;d+=`M${x-r} ${H-b} A${r} ${r} 0 0 1 ${x+r} ${H-b} `;}
  for(let y=b+r;y<=H-b-r;y+=2*r){d+=`M${b} ${y-r} A${r} ${r} 0 0 1 ${b} ${y+r} `;d+=`M${W-b} ${y-r} A${r} ${r} 0 0 0 ${W-b} ${y+r} `;}
  let s=`<path d="${d}" stroke-width="1.6"/><rect x="${b+r+8}" y="${b+r+8}" width="${W-2*(b+r+8)}" height="${H-2*(b+r+8)}" stroke-width="1.2"/><rect x="${b+r+14}" y="${b+r+14}" width="${W-2*(b+r+14)}" height="${H-2*(b+r+14)}" stroke-width=".6"/>`;
  // hoa bốn cánh ở góc trong
  const hoa=(x,y)=>{let t='';for(let i=0;i<4;i++)t+=`<ellipse cx="${x}" cy="${y-9}" rx="4.5" ry="9" transform="rotate(${i*90} ${x} ${y})" fill="url(#v15)" stroke="none"/>`;return t+`<circle cx="${x}" cy="${y}" r="3" fill="#4A0E1B" stroke="none"/>`;};
  for(const [x,y] of [[b+r+11,b+r+11],[W-b-r-11,b+r+11],[b+r+11,H-b-r-11],[W-b-r-11,H-b-r-11]])s+=hoa(x,y);
  document.getElementById('ren15').innerHTML=s;})();
</script>
<script src="chung/html-to-image.js"></script><script src="chung/cc.js"></script><script src="chung/cc-xuat.js"></script></body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-01 – Thư mời kem</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại · Dùng cho: hợp đồng khoá học
     Nguồn ý tưởng: Học từ ảnh 6 (thư mời "Dear:", tháng/năm và địa chỉ ở chân)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), anh (Ảnh học viên — khung tròn, thêm 19/10/2026), khoa (Tên khoá), lop (Mã lớp), ngay (Ngày khai giảng), ten (Tên học viên), diachi (Địa chỉ)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#F5EFE4;color:#2A2420}
.b1{position:absolute;inset:44px;border:1.5px solid #B8975A}
.b2{position:absolute;inset:58px;border:.75px solid #B8975A}
.w{position:absolute;inset:58px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 90px 50px}
.lg{width:70px;height:70px;flex:none}
.th{font:500 21px var(--f-sans);letter-spacing:.32em;color:#7A6340;margin-top:18px;text-transform:uppercase}
.k1{font:500 18px var(--f-sans);letter-spacing:.42em;color:#7A6340;text-transform:uppercase}
/* Ảnh học viên khung tròn (lời anh Chiến 19/10/2026: mẫu nào cũng có ảnh, khung mặc định tròn) — bố cục theo R&D-07 pa1, không nền hoa văn. */
.av{width:260px;height:260px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 8px #F5EFE4,0 0 0 9.5px #B8975A}
/* Bản vẽ H: khối MÃ SỐ (nhãn "SỐ" + số data-f="ma"), màu lấy từ bảng màu của mẫu, đặt chỗ không đè chữ/ảnh/logo/QR; mã trống → mau.js ẩn hẳn khối. */
.hang{display:flex;align-items:center;width:100%;margin:34px 0 30px;flex:none}.hang>.l,.hang>.r{flex:1 1 0;display:flex;justify-content:center}
.seat{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:112px;border-radius:50%;background:#FBF7EE;border:1.5px solid #B8975A;box-shadow:inset 0 0 0 5px #FBF7EE,inset 0 0 0 6px #B8975A}
.seat-l{font:600 14px var(--f-sans);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#7A6340}
.seat-n{font:600 40px/1 var(--f-chan);color:#2A2420;margin-top:2px}
.kh{font:600 58px/1.08 var(--f-chan);text-transform:uppercase;letter-spacing:.04em;margin-top:18px;width:100%}
.lo{font:italic 400 32px var(--f-chan);color:#5C4E3E;margin-top:14px}
.or{display:flex;align-items:center;gap:16px;margin:24px 0 14px;color:#B8975A}
.or i{width:120px;height:1px;background:#B8975A}.or b{width:10px;height:10px;transform:rotate(45deg);border:1px solid #B8975A}
.dg{font:italic 400 36px var(--f-chan);color:#5C4E3E}
.ten{font-family:var(--f-tay-1);font-size:calc(112px*var(--tay-co-1));line-height:1.18;width:100%;margin-top:6px;padding:0 10px}
.by{font:italic 400 30px var(--f-chan);color:#5C4E3E;margin-top:16px}
.ft{font:500 18px var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:#7A6340}
.dc{font:400 26px var(--f-chan);color:#5C4E3E;margin-top:8px}
.vuong .w{padding:36px 80px 32px}.vuong .lg{width:60px;height:60px}.vuong .th{margin-top:10px}.vuong .hang{margin:18px 0 16px}.vuong .av{width:150px;height:150px}.vuong .seat{width:92px;height:92px}.vuong .seat-l{font-size:12px}.vuong .seat-n{font-size:31px}.vuong .kh{font-size:48px;margin-top:10px}.vuong .lo{font-size:28px;margin-top:8px}.vuong .ten{font-size:calc(92px*var(--tay-co-1))}.vuong .or{margin:14px 0 8px}.vuong .by{margin-top:8px;font-size:26px}.vuong .dg{font-size:30px}
</style></head><body><div id="c"><div class="b1"></div><div class="b2"></div><div class="w">
<img class="lg" data-f="logo" alt=""><div class="th" data-f="th" data-fitw></div>
<div class="sp"></div>
<div class="hang"><div class="l"></div><div class="av"><img class="ph" data-f="anh" alt=""></div><div class="r"><div class="seat"><span class="seat-l">Số</span><b class="seat-n" data-f="ma"></b></div></div></div>
<div class="sp"></div>
<div class="k1">Chào mừng đến với lớp</div>
<div class="kh" data-f="khoa" data-fit="2"></div>
<div class="lo">Lớp <span data-f="lop"></span> · khai giảng <span data-f="ngayCham"></span></div>
<div class="or"><i></i><b></b><i></i></div>
<div class="dg">Thân gửi</div>
<div class="ten" data-f="ten" data-fit="2"></div>
<div class="by">Thân ái, <span data-f="th"></span></div>
<div class="sp"></div>
<div class="ft" data-f="thangNam"></div><div class="dc" data-f="diachi" data-fitw style="max-width:100%;white-space:nowrap"></div>
</div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

<!-- Makeup Pro · R&D vòng 3 · Mẫu feedback · Dùng cho: cả hợp đồng khoá học và dịch vụ (?loai=khoa|dv)
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: a1 (Ảnh 1), a2 (Ảnh 2), a3 (Ảnh 3), nd (Nội dung lời khen), kh (Tên khách/học viên), dv (Khoá học hoặc dịch vụ), logo (Logo), th (Tên thương hiệu)
     Phông: MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#FFFFFF;color:#1F1B1A}
/* Ba ảnh khung tròn (trước đây lưới ảnh chữ nhật) — khung mặc định tròn, 19/10/2026: một ảnh lớn + hai ảnh nhỏ so le. */
.gr{position:absolute;left:0;right:0;top:0;height:700px;background:#F7EDF0}
.gr div{position:absolute;overflow:hidden;border-radius:50%;box-shadow:0 0 0 8px #fff}
.gr div:nth-child(1){left:64px;top:76px;width:560px;height:560px}
.gr div:nth-child(2){left:676px;top:44px;width:330px;height:330px}
.gr div:nth-child(3){left:720px;top:400px;width:270px;height:270px}
.w{position:absolute;left:0;right:0;top:700px;bottom:0;display:flex;flex-direction:column;padding:44px 72px 50px;border-top:10px solid #A63D62}
.nd{font:400 31px/1.5 var(--f-sans);flex:1 1 0;min-height:0;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:14px;margin-top:18px}.pr b{font:italic 600 40px var(--f-chan)}.pr span{font:500 21px var(--f-sans);color:#7C7370}
.ft{display:flex;align-items:center;gap:12px;margin-top:20px}.ft img{width:46px;height:46px}.ft span{font:600 17px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#A63D62}
.vuong .gr{height:500px}.vuong .gr div:nth-child(1){left:70px;top:50px;width:400px;height:400px}.vuong .gr div:nth-child(2){left:560px;top:30px;width:240px;height:240px}.vuong .gr div:nth-child(3){left:640px;top:290px;width:190px;height:190px}.vuong .w{top:500px;padding:34px 64px 38px}.vuong .nd{font-size:27px}
.nd{display:flex;flex-direction:column;justify-content:center}
</style></head><body><div id="c"><div class="gr"><div><img class="ph" data-f="a1" alt=""></div><div><img class="ph" data-f="a2" alt=""></div><div><img class="ph" data-f="a3" alt=""></div></div>
<div class="w"><div class="nd" data-f="nd" data-fitc="44"></div><div class="pr"><b data-f="kh"></b><span data-f="dv"></span></div>
<div class="ft"><img data-f="logo" alt=""><span data-f="th"></span></div></div></div>

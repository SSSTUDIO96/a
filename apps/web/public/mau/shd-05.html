<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Thẻ chào mừng shd-05 – Tạp chí tối giản</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu chào mừng sang trọng hiện đại · Dùng cho: hợp đồng khoá học
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: anh (Ảnh học viên), logo (Logo), th (Tên thương hiệu), ten (Tên học viên), khoa (Tên khoá), lop (Mã lớp), ngay (Ngày khai giảng), gv (Giảng viên)
     Phông: MP Viết tay 2, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#FFFDF9;color:#1F1B1A}
.pt{position:absolute;left:0;right:0;top:0;height:800px;overflow:hidden}
.th0{position:absolute;left:56px;top:50px;display:flex;align-items:center;gap:14px;background:#FFFDF9;padding:12px 22px 12px 14px;border-radius:40px}
.th0 img{width:44px;height:44px}.th0 span{font:600 17px var(--f-sans);letter-spacing:.24em;text-transform:uppercase}
.pn{position:absolute;left:0;right:0;top:800px;bottom:0;display:flex;flex-direction:column;padding:30px 70px 56px}
.hw{font-family:var(--f-tay-2);font-size:calc(118px*var(--tay-co-2));line-height:.95;color:#A0475C;padding-left:4px}
.ten{font:500 70px/1.1 var(--f-chan);margin-top:4px}
.gr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:26px;border-top:1px solid #E5DDD2;padding-top:24px}
.gr .l{font:600 15px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#8B8079}
.gr .v{font:500 28px/1.25 var(--f-chan);margin-top:8px}
.vuong .pt{height:520px}.vuong .pn{top:520px;padding:24px 70px 40px}.vuong .ten{font-size:56px}
</style></head><body><div id="c"><div class="pt"><img class="ph" data-f="anh" alt=""><div class="th0"><img data-f="logo" alt=""><span data-f="th"></span></div></div>
<div class="pn"><div class="hw">Chào mừng</div>
<div class="ten" data-f="ten" data-fit="2"></div><div class="sp" style="min-height:24px"></div>
<div class="gr"><div><div class="l">Khoá học</div><div class="v"><span data-f="khoa"></span> · <span data-f="lop"></span></div></div>
<div><div class="l">Khai giảng</div><div class="v" data-f="ngayCham"></div></div>
<div><div class="l">Giảng viên</div><div class="v" data-f="gv"></div></div></div></div></div>
<script>window.MAC_DINH={};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

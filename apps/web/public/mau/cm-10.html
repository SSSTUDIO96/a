<!-- Makeup Pro · R&D-10 (19/10/2026), vào app theo bản vẽ H (26/10/2026): phông của app (phong/phong.css + ss-album.css, nối ở chung/cm.css), ô mã data-f="ma".
     · KIỂU MỚI 3 (cùng tinh thần R&D-07): KHUNG GƯƠNG OVAL CỔ ĐIỂN — hợp với ngành trang điểm ("soi gương").
     Chất liệu: khung gương vàng đồng kiểu baroque (vành vàng gradient, hàng ngọc trai, mào lá cọ + hai dây cuốn ở đỉnh, hai hoa nhỏ hai bên) trên nền hoa lá nét khắc xanh than ĐẬM;
     mặt kính kem có vệt phản chiếu chéo và bóng viền trong. Toàn bộ nội dung nằm TRONG mặt gương: logo → tên trung tâm → ảnh tròn → tên khoá chữ vàng → TÊN chữ ký TO (MonteCarlo).
     MÃ SỐ là TẤM BẢNG ĐỒNG gắn dưới chân khung gương (chữ nâu đen trên vàng đồng, như bảng tên treo gương trong bảo tàng).
     Ô dữ liệu: logo, th, anh (khung tròn), khoa, lop, ngay, ten, diachi + ma (mã số học viên trong lớp, bản vẽ H; trống thì ẩn hẳn khối .seat).
     Phông: MonteCarlo (chữ ký, OFL; = 'MP Chữ ký 5' của app) · Cormorant Garamond · Playfair Display · Montserrat. Khổ 1080×1350, ?kho=vuong → 1080×1080. ?ma=12 đổi mã số. -->

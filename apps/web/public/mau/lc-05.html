<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Lời chúc lc-05 – Chúc mừng hoàn thành khoá học</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu lời chúc · Dùng cho: hợp đồng khoá học
     Nguồn ý tưởng: Tự sáng tác (cùng họ với shd-10)
     Ô dữ liệu: logo (Logo), th (Tên thương hiệu), anh (Ảnh học viên), td (Tiêu đề lời chúc), ten (Tên học viên), cc (Câu chúc), khoa (Tên khoá), lop (Mã lớp), nkt (Ngày hoàn thành khoá), gv (Giảng viên)
     Phông: MP Viết tay 1, MP Viết tay 3, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="phong/ss-album/ss-album.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#1C2333;color:#EFE3CC}
.fr{position:absolute;inset:40px;border:1px solid rgba(230,211,179,.45)}
.w{position:absolute;inset:40px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 80px 52px}
.top{display:flex;align-items:center;gap:14px}
.ld{width:58px;height:58px;border-radius:50%;background:#EFE3CC;display:grid;place-items:center}.ld img{width:46px;height:46px}
.th{font:500 18px var(--f-sans);letter-spacing:.28em;text-transform:uppercase;color:#E6D3B3}
.cir{width:260px;height:260px;border-radius:50%;overflow:hidden;border:2px solid #E6D3B3;margin-top:48px;flex:none}
.td{font-family:var(--f-tay-1);font-size:calc(96px*var(--tay-co-1));line-height:1.1;color:#E6D3B3;margin-top:34px}
.ten{font:600 50px/1.15 var(--f-chan);margin-top:4px;width:100%}
.kh{font:500 19px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#CDBB9C;margin-top:14px}
.cc{font:400 33px/1.5 var(--f-chan);margin-top:16px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.sg{display:flex;justify-content:space-between;align-items:flex-end;width:100%;text-align:left}
.sg .n{font-family:var(--f-tay-3);font-size:calc(56px*var(--tay-co-3));color:#E6D3B3;line-height:1.1}
.sg .r{font:500 15px var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:#A99C86;margin-top:4px}
.vuong .cir{width:170px;height:170px;margin-top:30px}.vuong .td{margin-top:18px;font-size:calc(80px*var(--tay-co-1))}.vuong .w{padding:42px 70px 40px}.vuong .ten{font-size:42px}
</style></head><body><div id="c"><div class="fr"></div><div class="w"><div class="top"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div>
<div class="cir"><img class="ph" data-f="anh" alt=""></div>
<div class="td" data-f="td" data-fit="1"></div><div class="ten" data-f="ten" data-fit="2"></div>
<div class="kh"><span data-f="khoa"></span> · Lớp <span data-f="lop"></span></div>
<div class="cc" data-fitc="35"><span data-f="cc"></span></div>
<div class="sg"><div><div class="n" data-f="gv"></div><div class="r">Giảng viên</div></div><div style="text-align:right"><div class="r">Hoàn thành</div><div class="r" style="color:#EFE3CC" data-f="nktCham"></div></div></div></div></div>
<script>window.MAC_DINH={"td": "Chúc mừng em", "cc": "Chúc mừng em đã hoàn thành khoá học. Chúc em vững tay nghề, tự tin trên con đường trở thành chuyên viên trang điểm.", "loai": "khoa", "ten": "Nguyễn Hoa", "khoa": "Makeup chuyên nghiệp", "lop": "K10"};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>

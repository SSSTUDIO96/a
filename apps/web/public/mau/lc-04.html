<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Lời chúc lc-04 – Hai ảnh nghiêng, xanh rêu</title>
<!-- Makeup Pro · R&D vòng 3 · Mẫu lời chúc · Dùng cho: hợp đồng dịch vụ
     Nguồn ý tưởng: Tự sáng tác
     Ô dữ liệu: a1 (Ảnh 1), a2 (Ảnh 2), td (Tiêu đề lời chúc), kh (Tên khách/học viên), cc (Câu chúc), nsk (Ngày sự kiện), logo (Logo), th (Tên thương hiệu)
     Phông: MP Viết tay 1, MP Chữ có chân, MP Chữ không chân — khai báo ở phong/phong.css (phông viết tay là PHÔNG TẠM, thay một chỗ trong tệp đó).
     Khổ: mặc định 1080×1350; thêm ?kho=vuong để ra 1080×1080. Thay dữ liệu bằng tham số đường dẫn (xem chung/mau.js).
     Ảnh người và logo mặc định: vector do R&D tự vẽ. -->
<link rel="stylesheet" href="phong/phong.css"><link rel="stylesheet" href="chung/mau.css">
<style>
#c{background:#1F3A33;color:#EFE7DA}
.w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 80px 54px}
.top{display:flex;align-items:center;gap:14px}
.ld{width:58px;height:58px;border-radius:50%;background:#EFE7DA;display:grid;place-items:center}.ld img{width:46px;height:46px}
.th{font:500 18px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:#C9B99A}
.ph2{position:relative;width:640px;height:470px;margin-top:40px;flex:none}
/* Hai ảnh khung tròn so le, viền kem (trước đây hai ảnh chữ nhật nghiêng) — khung mặc định tròn, 19/10/2026. */
.ph2 div{position:absolute;width:350px;height:350px;border-radius:50%;overflow:hidden;background:#F6F1E8;border:12px solid #F6F1E8;box-shadow:0 18px 34px rgba(0,0,0,.25)}
.ph2 div img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ph2 .p1{left:0;top:110px}.ph2 .p2{right:0;top:0}
.td{font-family:var(--f-tay-1);font-size:calc(92px*var(--tay-co-1));line-height:1.1;margin-top:34px;width:100%}
.kh{font:600 42px/1.15 var(--f-chan);margin-top:4px;width:100%}
.cc{font:italic 400 32px/1.45 var(--f-chan);color:#DCD3C3;margin-top:14px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.ft{font:500 17px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:#C9B99A}
.vuong .ph2{width:520px;height:330px;margin-top:26px}.vuong .ph2 div{width:270px;height:270px}.vuong .ph2 .p1{top:60px}.vuong .td{margin-top:20px;font-size:calc(76px*var(--tay-co-1))}.vuong .w{padding:44px 80px 40px}
</style></head><body><div id="c"><div class="w"><div class="top"><span class="ld"><img data-f="logo" alt=""></span><span class="th" data-f="th"></span></div>
<div class="ph2"><div class="p1"><img data-f="a1" alt=""></div><div class="p2"><img data-f="a2" alt=""></div></div>
<div class="td" data-f="td" data-fit="1"></div><div class="kh" data-f="kh" data-fit="1"></div>
<div class="cc" data-fitc="34"><span data-f="cc"></span></div>
<div class="ft"><span data-f="goi"></span> · <span data-f="nskCham"></span></div></div></div>
<script>window.MAC_DINH={"td": "Chúc mừng lễ ăn hỏi", "cc": "Chúc mừng lễ ăn hỏi của hai bạn. Chúc chặng đường phía trước luôn ngập tràn yêu thương, thấu hiểu và bình an.", "loai": "dv", "goi": "Cô dâu – Lễ ăn hỏi", "nsk": "08/11/2026", "kh": "Hoàng Bảo Anh"};</script>
<script src="chung/qrcode.js"></script><script src="chung/mau.js"></script><script src="chung/html-to-image.js"></script><script src="chung/xuat.js"></script></body></html>
